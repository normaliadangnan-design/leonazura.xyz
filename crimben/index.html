<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>crimben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 16px;
    background:#090909;
    color:#fff;
    overflow-x:hidden;
}

/* Background (naka-fixed para gumana rin sa mobile) */
.background{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.88)),
        url("../members/founder/leon.gif") center/cover no-repeat;
}
.background::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:8px 8px;
}

/* Intro overlay */
#loading-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    width:100%;
    border:0;
    background:#090909;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:opacity .8s ease,visibility .8s ease;
}
#loading-overlay.hidden{opacity:0;visibility:hidden}
.click-text{
    color:#fff;
    font-size:24px;
    font-weight:600;
    letter-spacing:10px;
    padding-left:10px;
    text-shadow:0 0 18px rgba(255,255,255,.7);
    animation:pulse 1.4s ease-in-out infinite alternate;
}
@keyframes pulse{from{opacity:.3;transform:scale(.98)}to{opacity:1;transform:scale(1.04)}}

.card{
    width:100%;
    max-width:440px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity .8s ease .2s,transform .8s ease .2s;
}
body.entered .card{opacity:1;transform:none}

/* Header */
.main-logo{display:block;max-width:220px;max-height:140px;margin:0 auto 14px;object-fit:contain}
.title{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    min-height:40px;
    margin-bottom:12px;
}
.title img{height:40px;width:auto;object-fit:contain}
.title-fallback{
    font-size:28px;
    font-weight:700;
    letter-spacing:3px;
    text-shadow:0 0 16px rgba(255,255,255,.55);
}

.pill{
    display:flex;
    align-items:center;
    gap:8px;
    width:fit-content;
    margin:0 auto 18px;
    padding:7px 16px;
    font-size:13px;
    font-weight:500;
    background:rgba(15,15,15,.75);
    border:1px solid rgba(255,255,255,.1);
    border-radius:99px;
}

.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#80848e}
.status-online{background:#23a55a;box-shadow:0 0 8px #23a55a}
.status-idle{background:#f0b232;box-shadow:0 0 8px #f0b232}
.status-dnd{background:#f13f43;box-shadow:0 0 8px #f13f43}
.status-offline{background:#80848e}

/* Glass cards */
.section-card{
    position:relative;
    background:rgba(15,15,15,.6);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    box-shadow:0 18px 45px rgba(0,0,0,.45);
    margin-bottom:16px;
}
.profile-card{padding:26px 22px;text-align:center;z-index:5}

/* Avatar */
.avatar{position:relative;width:132px;height:132px;margin:6px auto 20px}
.avatar-button{
    width:100%;
    height:100%;
    padding:0;
    border-radius:50%;
    overflow:hidden;
    border:3px solid rgba(255,255,255,.2);
    background:#111;
    cursor:pointer;
}
.avatar-button img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-decoration{
    position:absolute;
    top:50%;
    left:50%;
    width:160px;
    height:160px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:2;
}

/* Popup */
.profile-popup{
    position:absolute;
    bottom:calc(100% + 18px);
    left:50%;
    width:min(340px,calc(100vw - 48px));
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 18px;
    text-align:left;
    background:#0b0b0b;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.8);
    opacity:0;
    visibility:hidden;
    transform:translate(-50%,8px);
    transition:.2s ease;
    z-index:20;
}
.avatar.open .profile-popup,
.avatar:focus-within .profile-popup{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media (hover:hover){
    .avatar:hover .profile-popup{opacity:1;visibility:visible;transform:translate(-50%,0)}
}
.popup-avatar-wrapper{position:relative;width:48px;height:48px;flex-shrink:0}
.popup-avatar-wrapper>img:first-child{width:100%;height:100%;border-radius:50%;object-fit:cover}
.popup-decoration{
    position:absolute;
    top:50%;
    left:50%;
    width:58px;
    height:58px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}
.popup-info{flex:1;min-width:0}
.popup-info>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.popup-nickname{font-size:16px;font-weight:600}
.popup-name{font-size:13px;color:#999}
.popup-status{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:#aaa}
.popup-activity{margin-top:6px;padding:4px 8px;font-size:11px;color:#bbb;background:#171717;border-radius:6px}

.bio{font-size:15px;line-height:1.5;color:#e5e5e5;margin-bottom:22px;overflow-wrap:anywhere}

/* Socials */
.socials{display:flex;justify-content:center;gap:16px}
.social{
    width:54px;
    height:54px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    transition:.25s;
}
.social:hover,.social:focus-visible{
    transform:translateY(-4px);
    background:#fff;
    color:#000;
    box-shadow:0 8px 22px rgba(255,255,255,.25);
}

/* Music player */
.music-card{padding:16px}
.music-label{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:11px;
    color:#999;
}
.music-label a{color:#ccc;text-decoration:none}
.music-label a:hover{color:#fff;text-decoration:underline}
.music-header{display:flex;align-items:center;gap:13px}
.music-album-art{
    width:58px;
    height:58px;
    flex-shrink:0;
    border-radius:50%;
    object-fit:cover;
    background:#222;
    border:2px solid rgba(255,255,255,.15);
    animation:spin 8s linear infinite;
    animation-play-state:paused;
}
.spinning .music-album-art{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.music-info{flex:1;min-width:0}
.music-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-title{font-size:15px;font-weight:600}
.music-artist{font-size:12px;color:#aaa}
.music-play-button{
    width:42px;
    height:42px;
    flex-shrink:0;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#000;
    cursor:pointer;
    transition:transform .2s;
}
.music-play-button:hover{transform:scale(1.08)}

.music-progress-container{padding:8px 0;margin-top:8px;cursor:pointer}
.music-progress-container.locked{cursor:default}
.music-progress-track{height:5px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.music-progress-bar{width:0;height:100%;background:#fff;border-radius:99px}
.music-time{display:flex;justify-content:space-between;font-size:11px;color:#999}

@media (prefers-reduced-motion:reduce){
    .click-text,.music-album-art{animation:none}
    .card{transition:none}
}
</style>
<script>
function titleFallback(){
    document.getElementById('title').innerHTML = '<span class="title-fallback">@LEON</span>';
}
</script>
</head>
<body>

<div class="background"></div>

<button type="button" id="loading-overlay">
    <span class="click-text">CLICK</span>
</button>

<main class="card">
    <img src="public%20azura.png" alt="crimben Logo" class="main-logo" onerror="this.remove()">

    <!-- Ilagay ang dalawang image na ito sa tabi ng HTML file. Kapag wala, text ang lalabas. -->
    <h1 class="title" id="title">
        <img src="at-symbol.png" alt="@" onerror="titleFallback()">
        <img src="leon-text.png" alt="Leon" onerror="titleFallback()">
    </h1>

    <div class="pill">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Loading...</span>
    </div>

    <section class="section-card profile-card">
        <div class="avatar" id="avatar">
            <div class="profile-popup">
                <div class="popup-avatar-wrapper">
                    <img id="popupAvatarImg" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
                    <img id="popupDeco" class="popup-decoration" alt="" hidden>
                </div>
                <div class="popup-info">
                    <div class="popup-nickname" id="popupNickname">Leon</div>
                    <div class="popup-name" id="popupUsername">@wtf.leon</div>
                    <div class="popup-status">
                        <span id="popupStatusDot" class="status-dot"></span>
                        <span id="popupStatusText">Loading...</span>
                    </div>
                    <div class="popup-activity" id="popupActivity">No Activity</div>
                </div>
            </div>
            <button type="button" class="avatar-button" id="avatarButton" aria-label="Ipakita ang profile">
                <img id="avatarImg" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Leon Avatar">
            </button>
            <img id="decoImg" class="avatar-decoration" alt="" hidden>
        </div>

        <p id="noteText" class="bio">PA KISS NGA</p>

        <nav class="socials">
            <a class="social" href="https://discord.gg/HcfB72yT" target="_blank" rel="noopener noreferrer" aria-label="Discord">
                <i class="fa-brands fa-discord" aria-hidden="true"></i>
            </a>
            <a class="social" href="https://www.instagram.com/zaer_mjzxz" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i>
            </a>
        </nav>
    </section>

    <section class="section-card music-card" id="musicCard">
        <div class="music-label">
            <span id="musicSource">Background music</span>
            <a id="trackLink" href="#" target="_blank" rel="noopener noreferrer">Buksan sa Spotify ↗</a>
        </div>
        <div class="music-header">
            <img id="musicAlbumArt" class="music-album-art" src="leonaise.webp" alt="Album Art">
            <div class="music-info">
                <span class="music-title" id="musicTitle">ORIGIMAL</span>
                <span class="music-artist" id="musicArtist">Uncle Dags ORIGIMAL</span>
            </div>
            <button type="button" id="playPauseBtn" class="music-play-button" aria-label="Play background music">
                <i id="playIcon" class="fa-solid fa-play" aria-hidden="true"></i>
            </button>
        </div>
        <div class="music-progress-container" id="progressBarContainer">
            <div class="music-progress-track">
                <div id="musicProgressBar" class="music-progress-bar"></div>
            </div>
        </div>
        <div class="music-time">
            <span id="musicTimeCurrent">0:00</span>
            <span id="musicTimeTotal">2:31</span>
        </div>
    </section>
</main>

<audio id="bgMusic" src="../uncle-dags-origimal-feat.mp3" loop preload="metadata"></audio>

<script>
const DISCORD_ID = "1123145717461033041";
const API_URL = `https://api.lanyard.rest/v1/users/${DISCORD_ID}`;

const DEFAULT_TRACK = {
    title: "ORIGIMAL",
    artist: "Uncle Dags ORIGIMAL",
    art: "leonaise.webp",
    link: "https://open.spotify.com/track/0FRtjVrSshjgQzd7ex645B",
    duration: 151 // segundo (2:31)
};

const $ = id => document.getElementById(id);
const audio = $('bgMusic');
audio.volume = 0.5;

let spotify = null; // may laman kapag nakikinig ka sa Spotify

/* ---------- Intro ---------- */
$('loading-overlay').addEventListener('click', () => {
    audio.play().catch(console.warn);
    $('loading-overlay').classList.add('hidden');
    document.body.classList.add('entered');
});

/* ---------- Profile popup (tap sa mobile) ---------- */
$('avatarButton').addEventListener('click', () => $('avatar').classList.toggle('open'));
document.addEventListener('click', e => {
    if (!$('avatar').contains(e.target)) {
        $('avatar').classList.remove('open');
        $('avatarButton').blur();
    }
});

/* ---------- Music player ---------- */
function formatTime(seconds) {
    const s = Math.max(0, Math.floor(seconds || 0));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function localDuration() {
    return Number.isFinite(audio.duration) ? audio.duration : DEFAULT_TRACK.duration;
}

function updateProgress() {
    let current, total;
    if (spotify) {
        total = (spotify.end - spotify.start) / 1000;
        current = Math.min((Date.now() - spotify.start) / 1000, total);
    } else {
        total = localDuration();
        current = audio.currentTime;
    }
    $('musicProgressBar').style.width = `${total > 0 ? Math.max(0, current / total) * 100 : 0}%`;
    $('musicTimeCurrent').textContent = formatTime(current);
    $('musicTimeTotal').textContent = formatTime(total);
}

function updatePlayState() {
    const playing = !audio.paused;
    $('playIcon').className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'}`;
    $('playPauseBtn').setAttribute('aria-label', `${playing ? 'Pause' : 'Play'} background music`);
    $('musicCard').classList.toggle('spinning', playing || Boolean(spotify));
}

$('playPauseBtn').addEventListener('click', () => {
    if (audio.paused) audio.play().catch(console.warn);
    else audio.pause();
});
audio.addEventListener('play', updatePlayState);
audio.addEventListener('pause', updatePlayState);
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', updateProgress);

$('progressBarContainer').addEventListener('click', e => {
    if (spotify || !Number.isFinite(audio.duration)) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const percent = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    audio.currentTime = percent * audio.duration;
});

function showTrack(data) {
    const valid = data?.timestamps?.end > data?.timestamps?.start;
    spotify = valid ? data.timestamps : null;

    $('musicTitle').textContent = valid ? data.song : DEFAULT_TRACK.title;
    $('musicArtist').textContent = valid ? data.artist : DEFAULT_TRACK.artist;

    const art = valid && data.album_art_url ? data.album_art_url : DEFAULT_TRACK.art;
    if ($('musicAlbumArt').getAttribute('src') !== art) $('musicAlbumArt').src = art;

    $('trackLink').href = valid && data.track_id
        ? `https://open.spotify.com/track/${data.track_id}`
        : DEFAULT_TRACK.link;
    $('musicSource').textContent = valid ? "Pinapakinggan ngayon ni Leon" : "Background music";
    $('progressBarContainer').classList.toggle('locked', valid);

    updatePlayState();
    updateProgress();
}

/* ---------- Discord (Lanyard) ---------- */
const STATUSES = {
    online: 'Online',
    idle: 'Idle',
    dnd: 'Do Not Disturb',
    offline: 'Offline / Invisible'
};

function setImage(el, url) {
    if (el.getAttribute('src') !== url) el.src = url;
}

function setStatus(key, label) {
    ['statusDot', 'popupStatusDot'].forEach(id => $(id).className = `status-dot status-${key}`);
    ['statusText', 'popupStatusText'].forEach(id => $(id).textContent = label);
}

async function fetchData() {
    try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (!json.success) throw new Error('Lanyard error');

        const d = json.data;
        const user = d.discord_user;

        // Avatar (gumagana na rin ang animated)
        const avatarUrl = user.avatar
            ? `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=256`
            : 'https://cdn.discordapp.com/embed/avatars/0.png';
        setImage($('avatarImg'), avatarUrl);
        setImage($('popupAvatarImg'), avatarUrl);

        // Avatar decoration
        const asset = user.avatar_decoration_data?.asset;
        ['decoImg', 'popupDeco'].forEach(id => {
            $(id).hidden = !asset;
            if (asset) setImage($(id), `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`);
        });

        $('popupNickname').textContent = user.global_name || 'Leon';
        $('popupUsername').textContent = `@${user.username || 'wtf.leon'}`;

        const custom = d.activities?.find(a => a.type === 4);
        $('noteText').textContent = custom?.state || 'PA KISS NGA';

        const key = STATUSES[d.discord_status] ? d.discord_status : 'offline';
        setStatus(key, STATUSES[key]);

        const labels = { 0: 'Playing', 2: 'Listening to', 3: 'Watching' };
        const activity = d.activities?.find(a => a.type in labels);
        $('popupActivity').textContent = activity ? `${labels[activity.type]}: ${activity.name}` : 'No Activity';

        showTrack(d.spotify);
    } catch (err) {
        console.error('API Fetch Error:', err);
        setStatus('offline', 'Status unavailable');
        showTrack(null);
    }
}

showTrack(null);
fetchData();
setInterval(fetchData, 10000);
setInterval(() => { if (spotify) updateProgress(); }, 1000);
</script>
</body>
</html>
