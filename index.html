<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AZURA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    cursor: url('https://cdn.cursors-4u.com/cursor/2019/06/08/12345.png'), auto !important;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.60), rgba(0, 0, 0, 0.60)), 
        url("background.webp");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ✅ NASA TAAS NA, EKSATONG FONT STYLE */
.main-logo-container {
    text-align: center;
    margin: 20px 0 10px 0;
}

.main-clan-logo {
    font-family: 'Old English Text MT', 'Cloister Black', serif !important; 
    font-size: 42px; 
    font-weight: normal !important;
    letter-spacing: 3px;
    color: #ffffff;
    background: transparent !important; 
    border: none !important;
    text-transform: uppercase;
    line-height: 1;
    display: block;
}

.symbol-break {
    font-size: 30px;
    font-weight: 700;
    margin: 8px 0 30px 0;
    overflow: visible;
    white-space: normal;
    animation: metallic-glow 3s infinite ease-in-out;
    color: #808080;
    text-align: center;
    display: block;
}

/* Animations */
@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes metallic-glow {
    0% { color: #808080; text-shadow: 0 0 5px #555; }
    50% { color: #ffffff; text-shadow: 0 0 10px #aaa; }
    100% { color: #808080; text-shadow: 0 0 5px #555; }
}

.typewriter-header {
    font-family: 'Inter', sans-serif;
    font-size: 30px; 
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    width: fit-content;
    margin: 0 auto 20px auto;
    animation: 
        typing 2s steps(20, end) forwards,
        metallic-glow 3s infinite ease-in-out;
    animation-play-state: paused;
    width: 0;
}

.navigation-bar {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px; 
    letter-spacing: 2px;
    opacity: 0.5;
    z-index: 100;
}

.views-box {
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 3px;
}

.center-container {
    width: 100%;
    max-width: 1000px; 
    margin: 50px auto 20px auto;
    display: flex;
    flex-direction: column; 
    align-items: center; 
    position: relative; 
    z-index: 10;
}

.title-group-block {
    margin-top: 45px; 
    margin-bottom: 15px; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
}

.tiny-top-text {
    font-size: 9px; 
    font-weight: 700; 
    letter-spacing: 5px; 
    color: rgba(255, 255, 255, 0.3); 
    text-transform: uppercase; 
    display: block; 
    margin-bottom: 3px;
}

/* ✅ SAKTO LANG ANG LAYO NG BILOG */
.horizontal-avatar-row {
    display: flex !important; 
    flex-direction: row !important; 
    flex-wrap: nowrap !important; 
    justify-content: center; 
    align-items: center; 
    width: 100%; 
    padding: 20px 0; 
    gap: 20px !important; 
    overflow: visible !important; 
}

.avatar-wrapper-node {
    position: relative !important; 
    transition: transform 0.2s ease, z-index 0.2s ease; 
    z-index: 10; 
    overflow: visible !important; 
    cursor: pointer; 
    text-decoration: none; 
    color: inherit; 
    display: block; 
    flex-shrink: 0 !important; 
}

.avatar-wrapper-node:hover { 
    transform: scale(1.15); 
    z-index: 999 !important; 
}

.avatar-wrapper-node.active-pop { 
    transform: scale(1.15); 
    z-index: 9999 !important; 
}

/* ✅ BILOG / BORDER - PURONG PUTI LANG */
.circle-avatar-container {
    position: relative !important; 
    width: 95px; 
    height: 95px; 
    border-radius: 50%; 
    border: 2px solid #ffffff !important; 
    background: #000000; 
    padding: 3px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    overflow: visible !important; 
    z-index: 5 !important; 
    transition: none !important; 
    box-shadow: none !important;
}

/* ✅ STATUS DOT (AUTOMATIC COLOR) */
.status-indicator {
    position: absolute; 
    bottom: 5px; 
    right: 5px; 
    width: 14px; 
    height: 14px; 
    border-radius: 50%; 
    border: 2px solid #000; 
    z-index: 10; 
    transition: background-color 0.2s ease;
}
.status-online { background-color: #23a55a; }  /* BERDE */
.status-idle { background-color: #f0b232; }    /* DILAW */
.status-dnd { background-color: #f13f42; }     /* PULA */
.status-offline { background-color: #80848e; }  /* GRAY */

.circle-avatar-container img.avatar-img {
    width: 100%; 
    height: 100%; 
    border-radius: 50%; 
    object-fit: cover; 
    pointer-events: none; 
    position: relative; 
    z-index: 2 !important;
}

/* ✅ AVATAR DECORATION (AUTOMATIC) */
img.avatar-decoration {
    position: absolute !important; 
    top: 50% !important; 
    left: 50% !important; 
    transform: translate(-50%, -50%) !important; 
    width: 130px !important; 
    height: 130px !important; 
    pointer-events: none !important; 
    z-index: 1 !important; 
    border-radius: 0 !important; 
    display: block !important;
}

/* ✅ CARD / TOOLTIP */
.avatar-tooltip {
    position: absolute; 
    bottom: 110%; 
    left: 50%; 
    transform: translateX(-50%) translateY(10px); 
    background: #000000 !important; 
    border: 1px solid #222; 
    border-radius: 8px; 
    padding: 12px; 
    width: 240px; 
    color: #fff; 
    opacity: 0; 
    visibility: hidden; 
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s; 
    pointer-events: none; 
    z-index: 999999; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.avatar-wrapper-node:hover .avatar-tooltip { 
    opacity: 1; 
    visibility: visible; 
    transform: translateX(-50%) translateY(0); 
}

.tooltip-header { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    margin-bottom: 10px; 
}
.tooltip-header img { 
    width: 32px; 
    height: 32px; 
    border-radius: 50%; 
}
.tooltip-content { 
    display: flex; 
    flex-direction: column;
}
.tooltip-name { 
    font-size: 14px; 
    font-weight: 700; 
    color: #ffffff; 
}
.tooltip-username { 
    font-size: 11px; 
    color: #969696; 
    margin-top: 2px; 
}

.tooltip-activity { 
    background: #111; 
    border-radius: 4px; 
    padding: 6px; 
    margin-top: 8px; 
    font-size: 10px; 
    line-height: 1.4; 
    border-left: 2px solid; 
}
.activity-spotify { border-color: #1db954; }
.activity-game { border-color: #7289da; }

.marquee-ticker { 
    overflow: hidden; 
    width: 100%; 
    max-width: 750px; 
    padding: 5px 0; 
    background: transparent; 
}
.marquee-wrapper { 
    display: flex; 
    flex-direction: row; 
    flex-wrap: nowrap; 
    gap: 12px; 
    width: max-content; 
    animation: scroll 30s linear infinite; 
}
@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.marquee-item {
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-size: 12px; 
    font-weight: 500; 
    color: rgba(255,255,255,0.8); 
    background: rgba(0,0,0,0.3); 
    border: 1px solid rgba(255,255,255,0.08); 
    padding: 4px 16px; 
    border-radius: 30px; 
    white-space: nowrap; 
}
.marquee-item img { 
    width: 32px; 
    height: 32px; 
    border-radius: 50%; 
    pointer-events: none; 
}

#azura-discord-btn { 
    position: fixed !important; 
    bottom: 30px !important; 
    right: 30px !important; 
    z-index: 9999 !important; 
    display: block !important; 
}
#azura-discord-btn a { 
    display: flex !important; 
    align-items: center !important; 
    gap: 8px !important; 
    padding: 10px 18px !important; 
    background-color: #000 !important; 
    border: 1px solid rgba(255,255,255,0.15) !important; 
    color: #fff !important; 
    font-size: 11px !important; 
    font-weight: bold !important; 
    text-decoration: none !important; 
    border-radius: 2px !important; 
    transition: all 0.2s !important; 
}
#azura-discord-btn a:hover { 
    background-color: #111 !important; 
    border-color: rgba(255,255,255,0.3) !important; 
}

#gateway-overlay { 
    position: fixed; 
    inset: 0; 
    background: #000; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    z-index: 999999; 
    transition: opacity 0.8s ease, visibility 0.8s; 
}
.gateway-text { 
    padding: 12px 30px; 
    font-size: 12px; 
    letter-spacing: 5px; 
    background: transparent; 
    border: 1px solid #444; 
    color: #aaa; 
    border-radius: 2px; 
    cursor: pointer; 
    transition: all 0.3s; 
}
.gateway-text:hover { 
    border-color: #fff; 
    color: #fff; 
}

#audio-player { display: none; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body onload="startTypewriter()">

<div id="gateway-overlay" onclick="enterSite()">
    <div class="gateway-text">ENTER</div>
</div>

<div class="navigation-bar">
    <div class="views-box">VIEWS: <span id="view-count">0000</span></div>
</div>

<div class="main-logo-container">
    <h1 class="main-clan-logo">AZURA</h1>
    <div class="symbol-break">✦</div>
</div>

<div class="center-container">
    <div class="title-group-block">
        <div class="tiny-top-text">• MEMBERS •</div>
        <h2 class="typewriter-header" id="typewriter-target">ABOVE ALL</h2>
    </div>

    <div class="horizontal-avatar-row" id="avatar-container">
        <!-- MEMBERS LOAD HERE -->
    </div>

    <div class="marquee-ticker">
        <div class="marquee-wrapper" id="marquee-content">
            <!-- STATUS SCROLLER -->
        </div>
    </div>
</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/yourinvite" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" width="16" height="16" alt="">
        AZURA OFFICIAL
    </a>
</div>

<audio id="audio-player" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">


<script>
let memberIds = [];
let liveDataMap = new Map();

async function initLoad() {
    // 1. KUNIN LANG ANG ID MULA SA BAGONG MEMBERS.JSON
    try {
        const resJson = await fetch(`members.json?nocache=${Date.now()}`);
        memberIds = await resJson.json();
        memberIds = memberIds.map(m => m.id); // Kunin lang yung array ng mga ID
    } catch (e) {
        console.error("Error reading members.json:", e);
        return;
    }

    // 2. KUNIN LAHAT NG DETALYE MULA SA API (NAME, AVATAR, STATUS, DECORATION)
    await fetchLiveStatus(memberIds);

    // 3. IPAKITA SA WEBSITE
    renderMembers();
    
    // Auto-refresh bawat 30s para laging updated
    setInterval(async () => {
        await fetchLiveStatus(memberIds);
        renderMembers();
    }, 30000);
}

async function fetchLiveStatus(ids) {
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${ids.join(',')}`);
        const apiData = await res.json();
        
        if(apiData.success) {
            liveDataMap.clear();
            Object.values(apiData.data).forEach(userData => {
                liveDataMap.set(userData.discord_id, userData);
            });
        }
    } catch (err) {
        console.error("API Error:", err);
    }
}

function renderMembers() {
    const container = document.getElementById('avatar-container');
    const marquee = document.getElementById('marquee-content');
    container.innerHTML = '';
    marquee.innerHTML = '';

    memberIds.forEach(id => {
        const data = liveDataMap.get(id);
        if(!data) return;

        // ✅ AUTOMATIC NA KINUKUHA ANG LAHAT
        const username = data.discord_username;
        const displayName = data.discord_global_name || username;
        const status = data.discord_status;
        const avatarHash = data.discord_avatar;
        const decoHash = data.avatar_decoration_data?.asset; // <-- AUTOMATIC DECORATION

        // ✅ AVATAR URL (GIF kung animated)
        let avatarURL = avatarHash 
            ? `https://cdn.discordapp.com/avatars/${id}/${avatarHash}?size=256` 
            : `https://cdn.discordapp.com/embed/avatars/${(id >> 22) % 6}.png`;

        // ✅ DECORATION URL (KUNG MERON)
        let decoHTML = '';
        if(decoHash) {
            const decoFinalHash = decoHash.startsWith('a_') ? decoHash : decoHash;
            decoHTML = `<img class="avatar-decoration" src="https://cdn.discordapp.com/avatar-decoration-presets/${decoFinalHash}?size=240" alt="">`;
        }

        // AVATAR ELEMENT
        const avatarEl = document.createElement('div');
        avatarEl.className = 'avatar-wrapper-node';
        avatarEl.innerHTML = `
            <div class="circle-avatar-container">
                <img class="avatar-img" src="${avatarURL}" alt="${displayName}">
                ${decoHTML} <!-- ✅ KUSA LUMALABAS O NAWAWALA ITO -->
                <span class="status-indicator status-${status}"></span>
            </div>
            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <img src="${avatarURL}" alt="">
                    <div class="tooltip-content">
                        <div class="tooltip-name">${displayName}</div>
                        <div class="tooltip-username">@${username}</div>
                    </div>
                </div>
                ${renderActivity(data.activities)}
            </div>
        `;
        container.appendChild(avatarEl);

        // MARQUEE ITEM
        const marqEl = document.createElement('div');
        marqEl.className = 'marquee-item';
        marqEl.innerHTML = `<img src="${avatarURL}" alt=""><span>${displayName} • ${status.toUpperCase()}</span>`;
        marquee.appendChild(marqEl);
    });

    marquee.innerHTML += marquee.innerHTML; // Infinite loop
}

function renderActivity(activities) {
    if (!activities || activities.length === 0) return '';
    const act = activities.find(a => a.type === 0 || a.type === 2); // Game or Spotify
    if (!act) return '';

    if (act.type === 2) { // Spotify
        return `<div class="tooltip-activity activity-spotify">🎵 ${act.details || 'Playing'}<br><small>${act.state || ''}</small></div>`;
    } else if (act.type === 0) { // Game
        return `<div class="tooltip-activity activity-game">🎮 ${act.name || 'Playing'}<br><small>${act.state || ''}</small></div>`;
    }
    return '';
}

// --- EXTRA SCRIPTS (WAG BAGUHIN) ---
function startTypewriter() {
    setTimeout(() => {
        document.querySelector('.typewriter-header').style.animationPlayState = 'running';
    }, 500);
}

function enterSite() {
    document.getElementById('gateway-overlay').style.opacity = '0';
    document.getElementById('gateway-overlay').style.visibility = 'hidden';
    document.getElementById('audio-player').play().catch(e=>{});
    initLoad(); // Simulan ang pagbasa ng data
}

let viewCount = 0;
setInterval(() => {
    viewCount++;
    document.getElementById('view-count').textContent = viewCount.toString().padStart(4, '0');
}, 2000);
</script>
</body>
</html>
