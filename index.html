<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.60), rgba(0, 0, 0, 0.60)), 
        url("background.webp");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-logo-container {
    text-align: center;
    margin: 20px 0 10px 0;
}

.main-clan-logo {
    font-family: 'Old English Text MT', 'Cloister Black', serif !important; 
    font-size: 42px; 
    font-weight: normal !important;
    letter-spacing: 3px;
    color: #ffffff;
    background: transparent !important; 
    border: none !important;
    text-transform: uppercase;
    line-height: 1;
    display: block;
}

.symbol-break {
    font-size: 30px;
    font-weight: 700;
    margin: 8px 0 30px 0;
    overflow: visible;
    white-space: normal;
    animation: metallic-glow 3s infinite ease-in-out;
    color: #808080;
    text-align: center;
    display: block;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes metallic-glow {
    0% { color: #808080; text-shadow: 0 0 5px #555555; }
    50% { color: #ffffff; text-shadow: 0 0 10px #aaaaaa; }
    100% { color: #808080; text-shadow: 0 0 5px #555555; }
}

.typewriter-header {
    font-family: 'Inter', sans-serif;
    font-size: 30px; 
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    width: fit-content;
    margin: 0 auto 20px auto;
    animation: 
        typing 2s steps(20, end) forwards,
        metallic-glow 3s infinite ease-in-out;
    animation-play-state: paused;
    width: 0;
}

.navigation-bar {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.5;
    z-index: 100;
}

.views-box {
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 3px;
}

.center-container {
    width: 100%;
    max-width: 1000px; 
    margin: 50px auto 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

.title-group-block {
    margin-top: 45px;
    margin-bottom: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tiny-top-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.3);
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
}

.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 20px 0; 
    gap: 20px !important; 
    overflow: visible !important; 
}

.avatar-wrapper-node {
    position: relative !important;
    transition: transform 0.2s ease, z-index 0.2s ease;
    z-index: 10;
    overflow: visible !important; 
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    flex-shrink: 0 !important; 
}

.avatar-wrapper-node:hover {
    transform: scale(1.15);
    z-index: 999 !important;
}

.avatar-wrapper-node.active-pop {
    transform: scale(1.15);
    z-index: 99999 !important;
}

.circle-avatar-container {
    position: relative !important;
    width: 95px; 
    height: 95px; 
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000000;
    padding: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible !important; 
    z-index: 5 !important;
}

.status-indicator {
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #000;
    z-index: 10;
}
.status-online { background-color: #23a55a; } 
.status-idle { background-color: #f0b232; }   
.status-dnd { background-color: #f13f43; }     
.status-offline { background-color: #80848e; } 

.circle-avatar-container img.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
    position: relative;
    z-index: 2 !important;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 130px !important; 
    height: 130px !important; 
    pointer-events: none !important;
    z-index: 1 !important; 
    border-radius: 0 !important; 
    display: block !important;
}

.avatar-tooltip {
    position: absolute;
    bottom: 110%; 
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #000000 !important;
    border: none !important;
    border-radius: 8px;
    padding: 12px;
    width: 200px;
    color: #fff;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    pointer-events: none; 
    z-index: 9999999;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.95);
}

.avatar-wrapper-node:hover .avatar-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.tooltip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

.tooltip-avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.tooltip-username {
    font-size: 12px;
    color: #96989d;
    margin: 4px 0;
}

.tooltip-desc {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
}

.tooltip-status {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 3px;
    background: #1a1a1a;
}
.status-dot-sm {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
}

.marquee-ticker {
    overflow: hidden;
    width: 100%;
    max-width: 750px;
    padding: 5px 0;
    background: transparent;
}

.marquee-wrapper-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    align-items: center;
    margin-top: 40px;
    margin-bottom: 50px;
}

.marquee-inner-wrap {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 12px;
    width: max-content;
}

.scroll-left { animation: smoothScrollLeft 30s linear infinite; }
.scroll-right { animation: smoothScrollRight 30s linear infinite; }

.marquee-profile-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    background: #0c0c0c; 
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 30px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
}

.marquee-profile-block img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
}

@keyframes smoothScrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
}
@keyframes smoothScrollRight {
    0% { transform: translateX(-33.333%); }
    100% { transform: translateX(0); }
}

#azura-discord-btn {
    position: fixed !important;
    bottom: 30px !important;
    right: 30px !important;
    z-index: 9999999 !important;
    display: block !important;
}

#azura-discord-btn a {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 10px 18px !important;
    background-color: #000 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #fff !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 2px !important;
}

#gateway-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.5s ease, visibility 0.5s;
}

.gateway-btn {
    padding: 12px 30px;
    font-size: 10px;
    letter-spacing: 5px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

.fade-gateway {
    opacity: 0;
    visibility: hidden;
}

::-webkit-scrollbar { display: none !important; }
</style>
</head>
<body>

<div class="navigation-bar">
    HOME
    <div class="views-box">VIEWS : <span id="views">5569</span></div>
</div>

<div class="center-container">
    <div class="main-logo-container">
        <div class="main-clan-logo">AZURA ORG</div>
        <div class="symbol-break">$</div>
    </div>

    <div id="founder-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">ABOVE ALL</span>
        <h2 class="typewriter-header">ABOVE ALL</h2>
    </div>
    <div id="aboveall-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">STAFF</span>
        <h2 class="typewriter-header">STAFF</h2>
    </div>
    <div id="staff-container" class="horizontal-avatar-row"></div>

    <div class="marquee-wrapper-group">
        <div class="marquee-ticker">
            <div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div>
        </div>
        <div class="marquee-ticker">
            <div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div>
        </div>
    </div>
</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/eUaKEqXkWA" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" style="width:18px;">
        <span>AZURA ORG</span>
    </a>
</div>

<div id="gateway-overlay">
    <div class="gateway-btn">CLICK</div>
</div>

<audio id="soundtrack" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("soundtrack");
audio.volume = 0.4;

document.getElementById("gateway-overlay").onclick = () => {
    audio.play().catch(() => {});
    document.getElementById("gateway-overlay").classList.add("fade-gateway");
    
    document.querySelectorAll('.typewriter-header').forEach(el => {
        el.style.animationPlayState = 'running';
        el.style.width = '100%';
    });
};

// ✅ LIVE API FETCH
fetch('https://api.leonazura.xyz/api/members')
    .then(res => res.json())
    .then(members => {
        const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"]; 
        const aboveAllIDs = ["1081806153341743144", "1416019497051095091", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426"]; 
        const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
        
        const scrollingIDsRow1 = ["1499093156321431622", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
        const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];

        showGroup(members, founderIDs, 'founder-container');
        showGroup(members, aboveAllIDs, 'aboveall-container');
        showGroup(members, staffIDs, 'staff-container');
        showMarquee(members, scrollingIDsRow1, "marquee-container-1");
        showMarquee(members, scrollingIDsRow2, "marquee-container-2");
    });

function showGroup(allMembers, listIDs, container) {
    const box = document.getElementById(container);
    listIDs.forEach((id, i) => {
        const mem = allMembers.find(m => m.id === id);
        if (!mem) return;
        const div = document.createElement('a');
        div.className = 'avatar-wrapper-node';
        div.style.zIndex = 50 - i; 
        div.href = (id === "1250654354344775703") ? "./leon/index.html" : "#"; 
        
        let decorationHTML = '';
        if(mem.effectURL && mem.effectURL !== null && mem.effectURL !== "null") {
            decorationHTML = `<img src="${mem.effectURL}" class="avatar-decoration" onerror="this.style.display='none'">`;
        }
        
        let statusText = '';
        let statusClass = '';
        let statusDotClass = '';
        if(mem.status === 'online') {
            statusText = 'Online'; statusClass = 'status-online'; statusDotClass = 'status-online';
        } else if(mem.status === 'idle') {
            statusText = 'Idle'; statusClass = 'status-idle'; statusDotClass = 'status-idle';
        } else if(mem.status === 'dnd') {
            statusText = 'Do Not Disturb'; statusClass = 'status-dnd'; statusDotClass = 'status-dnd';
        } else {
            statusText = 'Offline / Invisible'; statusClass = 'status-offline'; statusDotClass = 'status-offline';
        }

        div.innerHTML = `
            <div class="circle-avatar-container">
                <img src="${mem.avatarURL}" class="avatar-img" alt="">
                ${decorationHTML} 
                <span class="status-indicator ${statusClass}"></span>
            </div>
            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <img src="${mem.avatarURL}" class="tooltip-avatar-sm" alt="">
                </div>
                <div class="tooltip-desc">${mem.displayName || 'Member'}</div>
                <div class="tooltip-username">@${mem.username || 'username'}</div>
                <div class="tooltip-status">
                    <span class="status-dot-sm ${statusDotClass}"></span>
                    <span>${statusText}</span>
                </div>
            </div>
        `;
        div.addEventListener('click', function(e) {
            if (this.getAttribute('href') === '#') e.preventDefault();
            document.querySelectorAll('.avatar-wrapper-node').forEach(node => node.classList.remove('active-pop'));
            this.classList.add('active-pop');
        });
        box.appendChild(div);
    });
}

function showMarquee(allMembers, listIDs, containerId) {
    const box = document.getElementById(containerId);
    const selectedMembers = allMembers.filter(mem => listIDs.includes(mem.id));
    if (selectedMembers.length === 0) return;
    const list = [...selectedMembers, ...selectedMembers, ...selectedMembers];
    list.forEach(mem => {
        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName || mem.username}</span>`;
        box.appendChild(block);
    });
}
</script>
</body>
