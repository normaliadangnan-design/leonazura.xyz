/* ✅ SAKTO LANG ANG LAKI NG $ SIGN - GAYA SA PUBLIC ENEMY */

    text-align: center;
    display: block;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes metallic-glow {
    0% { color: #808080; text-shadow: 0 0 5px #555555; }
    50% { color: #ffffff; text-shadow: 0 0 10px #aaaaaa; }
    100% { color: #808080; text-shadow: 0 0 5px #555555; }
}

/* ✅ SAKTO LANG ANG LAKI NG TEXT - GAYA SA PUBLIC ENEMY */
.typewriter-header {
    font-family: 'Inter', sans-serif;
    font-size: 32px; 
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    width: fit-content;
    margin: 0 auto 20px auto;
    animation: 
        typing 3.5s steps(20, end) forwards,
        metallic-glow 3s infinite ease-in-out;
    animation-play-state: paused;
    width: 0;
    position: relative;
}

/* ✅ DALAWANG LINYA ITAAS AT BABA (GAYA SA PUBLIC ENEMY) */
.typewriter-header::before,
.typewriter-header::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 180%;
    height: 1px;
    background: rgba(255,255,255,0.08);
}
.typewriter-header::before {
    top: -12px;
}
.typewriter-header::after {
    bottom: -12px;
}

.navigation-bar {

.views-box {

    border-radius: 3px;
}

/* ✅ GAYA SA PUBLIC ENEMY: MAS MALIIT AT PULIDO ANG CONTAINER */
.center-container {

    margin: 50px auto 20px auto;

.title-group-block {

.tiny-top-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;

}

.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important; 
    justify-content: center;
    align-items: center;
    width: 100%;
    gap: 25px !important; 
    padding: 20px 0;
    min-height: 120px; 
}

.avatar-wrapper-node {
    position: relative;
    transition: transform 0.2s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.avatar-wrapper-node:hover {
    transform: scale(1.08);
}

.circle-avatar-container {
    position: relative;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    overflow: visible; 
    background: transparent; 
    display: flex;
    align-items: center;
    justify-content: center;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 140px !important; 
    height: 140px !important; 
    pointer-events: none !important;
    z-index: 1 !important;  
    border-radius: 0 !important; 
    object-fit: contain !important;
    background: transparent !important;
    display: block !important;
    opacity: 1 !important;
}

.circle-avatar-container img.avatar-img {
    width: 95px !important;
    height: 95px !important;
    border-radius: 50% !important;
    object-fit: cover !important;
    pointer-events: none !important;
    position: relative !important;
    z-index: 2 !important; 
    border: 2px solid #000 !important; 
    background: #000 !important; 
}

.status-indicator {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #000;
    z-index: 3 !important;
}

.status-online { background-color: #23a55a; }
.status-idle { background-color: #f0b232; }
.status-dnd { background-color: #f13f43; }
.status-offline { background-color: #80848e; }

.avatar-tooltip {
    position: absolute;
    bottom: 115%; 
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #0a0a0a !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    border-radius: 10px;
    padding: 12px 15px;
    width: 200px;
    color: #fff;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    pointer-events: none; 
    z-index: 99999;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
}
.avatar-wrapper-node:hover .avatar-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.tooltip-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 8px;
}
/* ✅ AVATAR DECO SA LOOB NG POPUP */
.tooltip-decoration {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translate(-50%, -50%);
    width: 55px;
    height: 55px;
    pointer-events: none;
    z-index: 1;
}
.tooltip-avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: relative;
    z-index: 2;
}
.tooltip-header-inner {
    display: flex;
    align-items: center;
    gap: 8px;
}
/* ✅ STATUS CIRCLE SA TABI NG PANGALAN */
.tooltip-status-dot-inline {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
.tooltip-username {
    font-size: 12px;
    color: #96989d;
    margin: 4px 0;
}
.tooltip-desc {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.tooltip-note {
    font-size: 11px;
    color: #888888;
    margin-top: 4px;
    line-height: 1.4;
}

.marquee-ticker {
    overflow: hidden;
    width: 100%;
    max-width: 900px;
    padding: 5px 0;
    background: transparent;
}

.marquee-wrapper-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    align-items: center;
    margin-top: 40px;
    margin-bottom: 50px;
}

.marquee-inner-wrap {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 12px;
    width: max-content;
}

.scroll-left { animation: smoothScrollLeft 30s linear infinite; }
.scroll-right { animation: smoothScrollRight 30s linear infinite; }

.marquee-profile-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    background: #0c0c0c; 
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 30px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
}

.marquee-profile-block img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
}

@keyframes smoothScrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
}
@keyframes smoothScrollRight {
    0% { transform: translateX(-33.333%); }
    100% { transform: translateX(0); }
}

#azura-discord-btn {
    position: fixed !important;
    bottom: 30px !important;
    right: 30px !important;
    z-index: 9999999 !important;
    display: block !important;
}

#azura-discord-btn a {
    display: flex !important;

    padding: 10px 18px !important;
    background-color: #000 !important;

    font-size: 11px !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 2px !important;
}

#gateway-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.2s ease, visibility 0.2s; /* ✅ PINABILIS ANG LALABAS */
}

.gateway-btn {
    padding: 12px 30px;

    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);

}

.fade-gateway {
    opacity: 0;

}

::-webkit-scrollbar { display: none !important; }

.name-label {

    max-width: 95px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
</style>

<body oncontextmenu="return false;" onkeydown="return disableKeys(event);">

<div class="center-container">

        <div class="main-clan-logo">
            <img src="public azura.png" alt="AZURA ORG LOGO">
        </div>

    <div class="title-group-block">
        <span class="tiny-top-text">ABOVE ALL</span>
        <h2 class="typewriter-header">ABOVE ALL</h2>
    </div>
    <div id="aboveall-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">STAFF</span>
        <h2 class="typewriter-header">STAFF</h2>

</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/azuraorg" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" style="width:18px;">
        <span>AZURA ORG</span>
    </a>
</div>

    <div class="gateway-btn">CLICK</div>
</div>

<audio id="soundtrack" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">


<script>
// 🛡️ SECURITY: BLOCK INSPECT ELEMENT, VIEW SOURCE, RIGHT CLICK
function disableKeys(e) {
    if(e.keyCode == 123 || 
       (e.ctrlKey && e.keyCode == 85) || 
       (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
       (e.ctrlKey && e.keyCode == 83)) {
        return false;
    }
}
document.onkeydown = disableKeys;
document.oncontextmenu = function() { return false; };
document.onmousedown = function(e) { if(e.button === 2) return false; };


const audio = document.getElementById("soundtrack");
audio.volume = 0.4;

document.getElementById("gateway-overlay").addEventListener("click", function() {
    audio.play().catch(() => {});
    this.classList.add("fade-gateway");
    
    document.querySelectorAll('.typewriter-header').forEach(el => {
        el.style.animationPlayState = 'running';
        el.style.width = '100%';
    });
});

// ✅ AUTOMATIC UPDATE: BAWAT 5 SEGUNDO
const UPDATE_INTERVAL = 5000; 

// ✅ LISTA NG ID — ILAGAY LAHAT NG ID NIYO DITO
const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"]; 
const aboveAllIDs = ["1081806153341743144", "1414546504437207161", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426"]; 
const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
const scrollingIDsRow1 = ["1499093156321431622", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];


// ✅ LANYARD API: BABASA LAMANG KUNG NASA LOOB NG SERVER
async function getUserData(userId) {
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
        const json = await res.json();

        // ✅ KUNG NASA LOOB NG SERVER: MAY DATA
        if (json.success) {
            const d = json.data;
            return {
                id: userId,
                username: d.discord_user.username,
                displayName: d.discord_user.global_name || d.discord_user.username,
                status: d.discord_status,
                avatarURL: `https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.png?size=1024`,
                effectURL: d.discord_user.avatar_decoration_data?.asset 
                    ? `https://cdn.discordapp.com/avatar-decoration-presets/${d.discord_user.avatar_decoration_data.asset}.png?size=256` 
                    : null,
                activity: d.activities?.[0] || null,
                customStatus: d.activities?.find(a => a.type === 4) || null
            };
        }
        // ❌ KUNG WALA SA SERVER: WALANG IBABALIK = HINDI LALABAS
        return null;
    } catch (e) {
        return null;
    }
}


async function fetchAndUpdate() {
    const allFounder = await Promise.all(founderIDs.map(id => getUserData(id)));
    const allAboveAll = await Promise.all(aboveAllIDs.map(id => getUserData(id)));
    const allStaff = await Promise.all(staffIDs.map(id => getUserData(id)));
    const allScroll1 = await Promise.all(scrollingIDsRow1.map(id => getUserData(id)));
    const allScroll2 = await Promise.all(scrollingIDsRow2.map(id => getUserData(id)));

    showGroup(allFounder.filter(Boolean), 'founder-container');
    showGroup(allAboveAll.filter(Boolean), 'aboveall-container');
    showGroup(allStaff.filter(Boolean), 'staff-container');
    showMarquee(allScroll1.filter(Boolean), "marquee-container-1");
    showMarquee(allScroll2.filter(Boolean), "marquee-container-2");
}


function showGroup(members, container) {
    const box = document.getElementById(container);
    if (!box) return;
    box.innerHTML = '';

    members.forEach(mem => {
        const wrapper = document.createElement('div'); 
        wrapper.className = 'avatar-wrapper-node';

        let decoHTML = '';
        if (mem.effectURL) {
            decoHTML = `<img src="${mem.effectURL}" class="avatar-decoration" alt="decoration" loading="lazy">`;
        }

        let statusClass = 'status-offline'; 
        if (mem.status) {
            const s = mem.status.toLowerCase().trim();
            if (s === 'online') statusClass = 'status-online';
            else if (s === 'idle') statusClass = 'status-idle';
            else if (s === 'dnd') statusClass = 'status-dnd';
        }

        // ✅ TINANGGAL NA ANG "STATUS : CUSTOM STATUS"
        let customStatusText = '';
        if (mem.customStatus?.state) {
            // ✅ KULAY GRAY ANG NOTES
            customStatusText = `<div class="tooltip-note">${mem.customStatus.emoji || ''} ${mem.customStatus.state}</div>`;
        }

        // ✅ AVATAR DECO SA LOOB NG POPUP
        let tooltipDeco = '';
        if (mem.effectURL) {
            tooltipDeco = `<img src="${mem.effectURL}" class="tooltip-decoration" alt="decoration">`;
        }

        wrapper.innerHTML = `
            <div class="circle-avatar-container">
                ${decoHTML} 
                <img src="${mem.avatarURL}" class="avatar-img" alt="avatar">
                <span class="status-indicator ${statusClass}"></span>
            </div>
            <div class="name-label">${mem.displayName}</div>

            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    ${tooltipDeco}
                    <div class="tooltip-header-inner">
                        <img src="${mem.avatarURL}" class="tooltip-avatar-sm">
                        <!-- ✅ STATUS CIRCLE SA TABI NG PANGALAN -->
                        <span class="tooltip-status-dot-inline ${statusClass}"></span>
                    </div>
                </div>
                <div class="tooltip-desc">${mem.displayName}</div>
                <div class="tooltip-username">@${mem.username}</div>
                ${customStatusText}
            </div>
        `;
        box.appendChild(wrapper);
    });
}


function showMarquee(members, containerId) {
    const box = document.getElementById(containerId);
    if (!box || members.length === 0) return;
    const list = [...members, ...members, ...members];
    box.innerHTML = '';
    list.forEach(mem => {
        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName}</span>`;
        box.appendChild(block);
    });
}


fetchAndUpdate();
setInterval(fetchAndUpdate, UPDATE_INTERVAL);
</script>
</body>
