<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AZURA ORG</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Old+English+Text+MT&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000;
    background-image: 
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
        url("background.webp");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Header / Logo */
.logo-top {
    text-align: center;
    margin-top: 20px;
    margin-bottom: 10px;
}
.logo-text {
    font-family: 'Old English Text MT', serif;
    font-size: 48px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
}
.divider-symbol {
    text-align: center;
    font-size: 32px;
    color: #777;
    margin: 5px 0 40px;
    animation: glow 3s infinite;
}
@keyframes glow {
    0%,100% {color:#666;}
    50% {color:#fff;}
}

/* Navigation */
.nav-bar {
    position: absolute;
    top: 25px;
    right: 30px;
    font-size: 10px;
    letter-spacing: 3px;
    opacity: 0.6;
}
.view-count {
    border: 1px solid #444;
    padding: 2px 8px;
    margin-left: 10px;
}

/* Sections */
.section-title {
    text-align: center;
    margin: 40px 0 20px;
}
.small-text {
    font-size: 9px;
    letter-spacing: 5px;
    color: #888;
    text-transform: uppercase;
}
.big-text {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    position: relative;
}
.big-text::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    height: 1px;
    background: #444;
}

/* Avatars Row */
.avatar-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    flex-wrap: nowrap;
    padding: 10px 0 40px;
    min-height: 110px;
}

.avatar-card {
    position: relative;
    transition: transform 0.2s;
}
.avatar-card:hover {
    transform: scale(1.15);
    z-index: 999;
}

.avatar-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #000;
    border: 1px solid #333;
    padding: 3px;
    position: relative;
    overflow: visible;
}
.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    position: relative;
    z-index: 2;
}

/* Avatar Decoration */
.avatar-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 120px;
    pointer-events: none;
    z-index: 1;
}

/* Status Dot */
.status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid #000;
    z-index: 3;
}
.online {background:#23a55a;}
.idle {background:#f0b232;}
.dnd {background:#f13f43;}
.offline {background:#80848e;}

/* Tooltip / Info Box */
.tooltip {
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #000;
    border: 1px solid #222;
    border-radius: 6px;
    width: 220px;
    padding: 10px;
    opacity: 0;
    visibility: hidden;
    transition: 0.2s;
    pointer-events: none;
    box-shadow: 0 0 15px #000;
}
.avatar-card:hover .tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}
.tooltip-name {
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 3px;
}
.tooltip-user {
    font-size: 11px;
    color: #888;
    margin-bottom: 6px;
}
.tooltip-status {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: #1a1a1a;
    padding: 3px 6px;
    border-radius: 3px;
    margin-bottom: 4px;
}
.tooltip-spotify {
    font-size: 10px;
    background: #1a1a1a;
    padding: 3px 6px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #1db954;
}

/* Scrolling Marquee */
.marquee-wrap {
    overflow: hidden;
    width: 100%;
    max-width: 800px;
    margin: 20px auto 60px;
}
.marquee {
    display: flex;
    gap: 12px;
    width: fit-content;
}
.marquee-left {animation: scrollLeft 40s linear infinite;}
.marquee-right {animation: scrollRight 40s linear infinite;}
@keyframes scrollLeft {
    0% {transform: translateX(0);}
    100% {transform: translateX(-33.33%);}
}
@keyframes scrollRight {
    0% {transform: translateX(-33.33%);}
    100% {transform: translateX(0);}
}
.marquee-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #111;
    border: 1px solid #222;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    white-space: nowrap;
}
.marquee-item img {
    width: 25px;
    height: 25px;
    border-radius: 50%;
}

/* Discord Button */
.discord-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #000;
    border: 1px solid #444;
    padding: 8px 15px;
    font-size: 11px;
    text-decoration: none;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
}
.discord-btn img {width:16px;}

/* Entry Overlay */
#entry-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    cursor: pointer;
}
.entry-text {
    border: 1px solid #555;
    padding: 10px 30px;
    font-size: 10px;
    letter-spacing: 4px;
}
.fade-out {
    opacity: 0;
    visibility: hidden;
    transition: 0.5s;
}

/* Scrollbar */
::-webkit-scrollbar {display:none;}
body {scrollbar-width:none;}
</style>
</head>
<body oncontextmenu="return false;">

<div id="entry-screen" onclick="this.classList.add('fade-out');playAudio()">
    <div class="entry-text">CLICK</div>
</div>

<audio id="bg-audio" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">


<div class="nav-bar">
    HOME <span class="view-count>VIEWS : 7304</span>
</div>

<div class="logo-top">
    <div class="logo-text">AZURA ORG</div>
    <div class="divider-symbol">$</div>
</div>

<!-- FOUNDER SECTION -->
<div class="section-title">
    <div class="small-text">LEADERSHIP</div>
    <div class="big-text">FOUNDER</div>
</div>
<div class="avatar-row" id="founder-row"></div>

<!-- ABOVE ALL SECTION -->
<div class="section-title">
    <div class="small-text">ABOVE ALL</div>
    <div class="big-text">ABOVE ALL ENEMIES</div>
</div>
<div class="avatar-row" id="aboveall-row"></div>

<!-- STAFF SECTION -->
<div class="section-title">
    <div class="small-text">STAFF</div>
    <div class="big-text">STAFF</div>
</div>
<div class="avatar-row" id="staff-row"></div>

<!-- SCROLLING NAMES -->
<div class="marquee-wrap">
    <div class="marquee marquee-left" id="marquee-1"></div>
</div>
<div class="marquee-wrap">
    <div class="marquee marquee-right" id="marquee-2"></div>
</div>

<a href="https://discord.gg/eUaKEqXkWA" target="_blank" class="discord-btn">
    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
    AZURA ORG
</a>

<script>
function playAudio(){
    const a = document.getElementById("bg-audio");
    a.volume = 0.4;
    a.play().catch(e=>{});
}

// ✅ ITO ANG SERVER ID MO GAYA NG NAKIKITA SA SCREEN
const SERVER_ID = "1506830822207127552";

// ✅ ITO ANG BUONG LISTAHAN MULA SA MEMBERS.JSON MO
const ALL_MEMBERS = [
  {"id": "1414546504437207161"},
  {"id": "1499093156321431622"},
  {"id": "1495366872516923553"},
  {"id": "1314554124976656505"},
  {"id": "1123145717461033041"},
  {"id": "1081806153341743144"},
  {"id": "1495341225174368276"},
  {"id": "1366187912118665276"},
  {"id": "1501438491207405588"},
  {"id": "1498999674969784426"},
  {"id": "1488388828241723513"},
  {"id": "1509479201114296353"},
  {"id": "1374740899422277703"},
  {"id": "995205070679453789"},
  {"id": "1418157973867597845"},
  {"id": "1459797319863242797"},
  {"id": "1250654354344775703"},
  {"id": "1506434429613113405"},
  {"id":1398759472821702773},
  {"id": "1057219921907556404"},
  {"id": "1486015538026123358"},
  {"id": "1085580321623375938"},
  {"id": "1506975053370359848"},
  {"id": "918633044276019232"},
  {"id": "1469640368361439357"},
  {"id": "1436822049002623137"}
];

// ✅ PAG HATI-HATI NATIN SILA SA SEKSYON
const FOUNDER_IDS = ["1250654354344775703", "1506975053370359848", "1123145717461033041"];
const ABOVEALL_IDS = ["1081806153341743144", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426", "1414546504437207161"];
const STAFF_IDS = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"];

let userData = {};

// ✅ GAGAMITIN NATIN ANG SERVER WIDGET API NA BUKAS NA BUKAS SA SERVER MO
async function fetchServerData() {
    try {
        // Ito mismo ang link na nakikita mo sa screen mo
        const res = await fetch(`https://discord.com/api/guilds/${SERVER_ID}/widget.json`);
        const json = await res.json();

        // Ayusin at ilagay ang lahat ng impormasyon
        json.members.forEach(member => {
            userData[member.id] = {
                username: member.username,
                displayName: member.username,
                status: member.status,
                avatarHash: member.avatar_url,
                decorationHash: null,
                spotify: null
            };
        });

        // Siguraduhing kasama lahat kahit offline
        ALL_MEMBERS.forEach(m => {
            if(!userData[m.id]) {
                userData[m.id] = {
                    username: "Offline", displayName: "Member", status: "offline",
                    avatarHash: `https://cdn.discordapp.com/embed/avatars/${(Number(m.id) >> 22) % 6}.png`,
                    decorationHash: null, spotify: null
                };
            }
        });

        renderAll();
    } catch (e) {
        // Kung sakaling may mali, gamitin ang backup
        loadBackupData();
    }
}

// ✅ KUNG MAY ERROR, ITO ANG LALABAS
function loadBackupData() {
    ALL_MEMBERS.forEach(m => {
        userData[m.id] = {
            username: `User${m.id.slice(-4)}`,
            displayName: `MEMBER ${m.id.slice(-4)}`,
            status: ['online','idle','dnd','offline'][Math.floor(Math.random()*4)],
            avatarHash: `https://cdn.discordapp.com/embed/avatars/${(Number(m.id) >> 22) % 6}.png`,
            decorationHash: null, spotify: null
        };
    });
    renderAll();
}

// ✅ KUMUHA NG LINK NG LITRATO
function getAvatarUrl(id, hash) {
    if(!hash) return `https://cdn.discordapp.com/embed/avatars/${(Number(id) >> 22) % 6}.png`;
    // Kung buong link na ang ibinigay ng Widget, gamitin yun
    return (hash.startsWith('http')) ? hash : `https://cdn.discordapp.com/avatars/${id}/${hash}.png?size=256`;
}

// ✅ KUMUHA NG LINK NG PALAMUTI
function getDecorationUrl(hash) {
    if(!hash) return "";
    return `https://cdn.discordapp.com/avatar-decoration-presets/${hash}.png?size=240`;
}

// ✅ GUMAGAWA NG BAWAT BILOG
function createAvatarElement(id) {
    const data = userData[id];
    const avatarUrl = getAvatarUrl(id, data.avatarHash);
    const decorationUrl = getDecorationUrl(data.decorationHash);

    let statusClass = 'offline';
    if(data.status === 'online') statusClass = 'online';
    if(data.status === 'idle') statusClass = 'idle';
    if(data.status === 'dnd') statusClass = 'dnd';

    let spotifyHtml = "";
    if(data.spotify) {
        spotifyHtml = `<div class="tooltip-spotify">🎵 ${data.spotify.details}</div>`;
    }

    const card = document.createElement('div');
    card.className = 'avatar-card';

    card.innerHTML = `
    <div class="avatar-circle">
        ${decorationUrl ? `<img class="avatar-decoration" src="${decorationUrl}">` : ''}
        <img class="avatar-img" src="${avatarUrl}" alt="">
        <span class="status-dot ${statusClass}"></span>
    </div>
    <div class="tooltip">
        <div class="tooltip-name">${data.displayName || 'Member'}</div>
        <div class="tooltip-user">@${data.username || id}</div>
        <div class="tooltip-status">
            <span class="status-dot ${statusClass}" style="width:8px;height:8px;position:static;"></span>
            <span>${statusClass.charAt(0).toUpperCase() + statusClass.slice(1)}</span>
        </div>
        ${spotifyHtml}
    </div>
    `;
    return card;
}

// ✅ ILAGAY ANG MGA TAO SA SEKSYON
function renderSection(ids, containerId) {
    const cont = document.getElementById(containerId);
    cont.innerHTML = '';
    ids.forEach(id => {
        if(userData[id]) cont.appendChild(createAvatarElement(id));
    });
}

// ✅ GAWIN ANG SCROLLING
function renderMarquee(containerId) {
    const cont = document.getElementById(containerId);
    cont.innerHTML = '';
    const list = [...ALL_MEMBERS, ...ALL_MEMBERS, ...ALL_MEMBERS];
    list.forEach(m => {
        const d = userData[m.id] || {displayName: "User", username: m.id};
        const img = getAvatarUrl(m.id, d.avatarHash || null);
        const div = document.createElement('div');
        div.className = 'marquee-item';
        div.innerHTML = `<img src="${img}"> <span>${d.displayName}</span>`;
        cont.appendChild(div);
    });
}

// ✅ IPAKITA LAHAT
function renderAll() {
    renderSection(FOUNDER_IDS, 'founder-row');
    renderSection(ABOVEALL_IDS, 'aboveall-row');
    renderSection(STAFF_IDS, 'staff-row');
    renderMarquee('marquee-1');
    renderMarquee('marquee-2');
}

// ✅ SIMULAN ANG PAGKUHA GAMIT ANG BINUKSAN MONG SERVER WIDGET
fetchServerData();
setInterval(fetchServerData, 60000);
</script>
</body>
</html>
