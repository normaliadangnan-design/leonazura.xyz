<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AZURA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("banner.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.navigation-bar {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.5;
    z-index: 100;
}

.views-box {
    padding: 3px 8px;
    border: 1px solid rgba(255,  255, 255, 0.1);
    border-radius: 3px;
}

.center-container {
    width: 100%;
    max-width: 800px;
    margin: 50px auto 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

.main-clan-logo {
    max-width: 180px;
    width: 100%;
    height: auto;
    margin-bottom: 5px;
    pointer-events: none;
}

.symbol-break {
    font-size: 28px;
    color: rgba(255,  255, 255, 0.8);
    margin-bottom: 20px;
    font-weight: 700;
}

.title-group-block {
    margin-top: 45px;
    margin-bottom: 15px;
    text-align: center;
}

.tiny-top-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255,  255, 255, 0.3);
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
}

.bold-main-header {
    font-family: 'Inter', sans-serif;
    font-size: 30px; 
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,  255, 255, 0.8);
}

.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    justify-content: center;
    align-items: center;
    width: auto;
    padding: 5px 0;
}

.avatar-wrapper-node {
    position: relative;
    margin-left: -22px;
    transition: transform 0.2s ease, z-index 0.2s ease;
    z-index: 10;
}

.avatar-wrapper-node:first-child {
    margin-left: 0;
}

.avatar-wrapper-node.clickable {
    cursor: pointer;
}
.avatar-wrapper-node.clickable:hover {
    transform: scale(1.18);
    z-index: 9999 !important;
}

.avatar-link {
    text-decoration: none;
    color: inherit;
    display: block;
}

/* ✅ CONTAINER */
.circle-avatar-container {
    position: relative;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(255,  255, 255, 0.15);
    background: #000000;
    padding: 2px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
    overflow: visible; 
}

/* ✅ LITRATO */
.circle-avatar-container img.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
    position: relative;
    z-index: 2;
}

/* ✅ DITO KO INAYOS NG TAMA! SUMAKTO NA ANG LAKI AT PWESE */
img.avatar-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 125px;  /* ✅ TAMA NA LAKI */
    height: 125px;  /* ✅ TAMA NA LAKI */
    pointer-events: none;
    z-index: 3; 
    border-radius: 0 !important;
    object-fit: contain; 
    background: transparent !important; /* ✅ TANGGAL ANG PUTING LIKOD */
    border: none !important; /* ✅ TANGGAL ANG KAHON */
}

/* ==================================================
   ✅ TOOLTIP
   ================================================== */
.avatar-tooltip {
    position: absolute;
    bottom: -85px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #000000;
    border: 1px solid rgba(255,  255, 255, 0.1);
    border-radius: 12px;
    padding: 12px 15px;
    width: 180px;
    white-space: normal;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 99999;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
}

.tooltip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.tooltip-avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #222;
}
.tooltip-emojis {
    font-size: 14px;
}
.tooltip-username {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
}
.tooltip-desc {
    font-size: 12px;
    color: #fff;
    margin-top: 5px;
    font-weight: 500;
}

.avatar-wrapper-node:hover .avatar-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* ==================================================
   ✅ SCROLLING AREA - DALAWANG LINYA
   ================================================== */
.marquee-ticker {
    overflow: hidden;
    width: 100%;
    max-width: 700px;
    padding: 10px 0;
    margin-top: 45px; 
    margin-bottom: 10px;
    background: transparent;
}

.marquee-inner-wrap-top {
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    width: max-content;
    animation: scrollLeft 20s linear infinite; 
}

.marquee-inner-wrap-bottom {
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    width: max-content;
    animation: scrollRight 20s linear infinite; 
}

.marquee-profile-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,  255, 255, 0.8);
    background: #0c0c0c; 
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 30px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.marquee-profile-block img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
}

@keyframes scrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes scrollRight {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
}

#azura-discord-btn {
    position: fixed !important;
    bottom: 30px !important;
    right: 30px !important;
    z-index: 9999999 !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}

#azura-discord-btn a {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 10px 18px !important;
    background-color: #000 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #fff !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-decoration: none !important;
    letter-spacing: 1px !important;
    border-radius: 2px !important;
}

#azura-discord-btn a:hover {
    background-color: #1a1a1a !important;
    border-color: rgba(255,255,255,0.3) !important;
}

#azura-discord-btn img {
    width: 18px !important;
    height: auto !important;
}

#gateway-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.5s ease, visibility 0.5s;
}

.gateway-btn {
    padding: 12px 30px;
    font-size: 10px;
    letter-spacing: 5px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

.fade-gateway {
    opacity: 0;
    visibility: hidden;
}
</style>
</head>
<body oncontextmenu="return false;" onkeydown="return disableKeyPress(event);">

<div class="navigation-bar">
    HOME
    <div class="views-box">VIEWS : <span id="views">0</span></div>
</div>

<div class="center-container">
    <img src="azura-logo.webp" alt="AZURA" class="main-clan-logo">
    
    <div class="symbol-break">$</div>
    <div id="founder-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">ABOVE ALL</span>
        <h2 class="bold-main-header">ABOVE ALL</h2>
    </div>
    <div id="aboveall-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">STAFF</span>
        <h2 class="bold-main-header">STAFF</h2>
    </div>
    <div id="staff-container" class="horizontal-avatar-row"></div>

    <div class="marquee-ticker">
      <div id="marquee-top" class="marquee-inner-wrap-top"></div>
    </div>
    
    <div class="marquee-ticker">
      <div id="marquee-bottom" class="marquee-inner-wrap-bottom"></div>
    </div>

</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/eUaKEqXkWA" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
        <span>AZURA ORG</span>
    </a>
</div>

<div id="gateway-overlay">
    <div class="gateway-btn">CLICK</div>
</div>

<audio id="soundtrack" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">


<script>
function disableKeyPress(e) {
    if (e.keyCode == 123 || 
        (e.ctrlKey && e.keyCode == 85) || 
        (e.ctrlKey && e.keyCode == 83) || 
        (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
        (e.ctrlKey && e.shiftKey && e.keyCode == 74) || 
        (e.ctrlKey && e.shiftKey && e.keyCode == 67) || 
        (e.ctrlKey && e.keyCode == 80)) {
        return false;
    }
}
document.onkeydown = disableKeyPress;
document.onmousedown = disableKeyPress;

const audio = document.getElementById("soundtrack");
audio.volume = 0.4;

document.getElementById("gateway-overlay").onclick = () => {
    audio.play().catch(() => {});
    document.getElementById("gateway-overlay").classList.add("fade-gateway");
};

fetch("https://api.jsonbin.io/v3/b/6a0fde5e6877513b27b20766/latest")
.then(r => r.json())
.then(d => { document.getElementById("views").innerText = d.record.views; })
.catch(e => console.log(e));

fetch('members.json')
    .then(res => res.json())
    .then(members => {
        const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"]; 
        const aboveAllIDs = ["1081806153341743144", "1416019497051095091", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426"]; 
        const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
        const scrollingIDs = ["1499093156321431622", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588", "1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"]; 

        showGroup(members, founderIDs.slice(0, 3), 'founder-container');
        showGroup(members, aboveAllIDs.slice(0, 6), 'aboveall-container');
        showGroup(members, staffIDs.slice(0, 8), 'staff-container');
        
        showMarqueeTop(members, scrollingIDs.slice(0, 10));
        showMarqueeBottom(members, scrollingIDs.slice(0, 10));
    })
    .catch(err => console.error("Error:", err));

// ✅ TAMA NA ITO, WALANG KAHON, WALANG SAKA
function showGroup(allMembers, listIDs, container) {
    const box = document.getElementById(container);
    const filtered = allMembers.filter(mem => listIDs.includes(mem.id));

    filtered.forEach((mem, i) => {
        const div = document.createElement('div');
        div.className = 'avatar-wrapper-node';
        div.style.zIndex = 50 - i;

        let decorationHTML = '';
        if(mem.effectURL) { 
            decorationHTML = `<img src="${mem.effectURL}" class="avatar-decoration" alt="">`;
        }

        div.innerHTML = `
            <div class="circle-avatar-container">
                <img src="${mem.avatarURL}" class="avatar-img" alt="">
                ${decorationHTML} 
            </div>
            
            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <img src="${mem.avatarURL}" class="tooltip-avatar-sm" alt="">
                    <span class="tooltip-emojis">👑</span>
                </div>
                <div class="tooltip-username">
                    <span>◇</span> @${mem.username || 'username'}
                </div>
                <div class="tooltip-desc">
                    ${mem.displayName || 'Walang Pangalan'}
                </div>
            </div>
        `;
        box.appendChild(div);
    })
}

function showMarqueeTop(allMembers, listIDs) {
    const box = document.getElementById("marquee-top");
    const selectedMembers = allMembers.filter(mem => listIDs.includes(mem.id));
    const ulit = [...selectedMembers, ...selectedMembers, ...selectedMembers];
    
    ulit.forEach(mem => {
        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName || mem.username}</span>`;
        box.appendChild(block);
    })
}

function showMarqueeBottom(allMembers, listIDs) {
    const box = document.getElementById("marquee-bottom");
    const selectedMembers = allMembers.filter(mem => listIDs.includes(mem.id));
    const ulit = [...selectedMembers, ...selectedMembers, ...selectedMembers];
    
    ulit.forEach(mem => {
        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName || mem.username}</span>`;
        box.appendChild(block);
    })
}
</script>
</body>
</html>
