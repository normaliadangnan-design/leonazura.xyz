                        status: d.discord_status || 'offline',
                        avatarURL: user.avatar ? `https://cdn.discordapp.com/avatars/${userId}/${user.avatar}.png?size=1024` : "https://cdn.discordapp.com/embed/avatars/0.png",
                        effectURL: user.avatar_decoration_data?.asset ? `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png?size=256` : null,
                        spotify: d.spotify || null,
                        activities: d.activities || [],
                        customStatus: (d.activities || []).find(a => a.type === 4) || null
                    };
                }
                return null;
            } catch (e) {
                console.log("Fetch error for", userId, ":", e);
                return null;
            }
        }

        async function fetchAndUpdate() {
            try {
                const [founders, aboveAll, staff, scroll1, scroll2] = await Promise.allSettled([
                    Promise.all(founderIDs.map(getUserData)),
                    Promise.all(aboveAllIDs.map(getUserData)),
                    Promise.all(staffIDs.map(getUserData)),
                    Promise.all(scrollingIDsRow1.map(getUserData)),
                    Promise.all(scrollingIDsRow2.map(getUserData))
                ]);
                showGroup(founders.status === 'fulfilled' ? founders.value.filter(Boolean) : [], 'founder-container');
                showGroup(aboveAll.status === 'fulfilled' ? aboveAll.value.filter(Boolean) : [], 'aboveall-container');
                showGroup(staff.status === 'fulfilled' ? staff.value.filter(Boolean) : [], 'staff-container');
                showMarquee(scroll1.status === 'fulfilled' ? scroll1.value.filter(Boolean) : [], "marquee-container-1");
                showMarquee(scroll2.status === 'fulfilled' ? scroll2.value.filter(Boolean) : [], "marquee-container-2");
            } catch (e) {
                console.log("Update error:", e);
            }
        }

     // ✅ Improved Activity Detection with REAL Discord Activity Icons
function showGroup(members, containerId) {
    const box = document.getElementById(containerId);
    if (!box) return;
    box.innerHTML = '';
    members.forEach(mem => {
        const wrapper = document.createElement('div'); 
        wrapper.className = 'avatar-wrapper-node';
        const decoHTML = mem.effectURL ? `<img src="${mem.effectURL}" class="avatar-decoration" alt="decoration" loading="lazy" onerror="this.remove()">` : '';
        
        let statusClass = 'status-offline';
        const s = String(mem.status || 'offline').toLowerCase().trim();
        if (s === 'online') statusClass = 'status-online';
        else if (s === 'idle') statusClass = 'status-idle';
        else if (s === 'dnd') statusClass = 'status-dnd';

        let noteText = "";
        let activityHTML = "";
        let activityClass = "";

        // ✅ Custom Status / Note
        if (mem.customStatus?.state?.trim()) {
            noteText = mem.customStatus.state.trim();
        }

        // ✅ Activity Priority: Spotify > Game > Stream > Watch > Others
        if (mem.spotify) {
            // 🎵 EKSAKTONG SPOTIFY LOGO - Katulad ng Discord
            activityHTML = `
                <div style="display:flex;align-items:center;gap:10px;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="#1db954" style="flex-shrink:0;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5c-2.75 0-5-2.25-5-5s2.25-5 5-5c.29 0 .57.03.85.08l-1.21 1.21c-.21-.05-.43-.08-.64-.08-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5c.21 0 .43-.03.64-.08l1.21 1.21c-.28.05-.56.08-.85.08zm4.5-5c0-1.93-1.57-3.5-3.5-3.5-.21 0-.43.03-.64.08l1.21 1.21c.28-.05.56-.08.85-.08 1.93 0 3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5c-.29 0-.57-.03-.85-.08l-1.21 1.21c.21.05.43.08.64.08 1.93 0 3.5-1.57 3.5-3.5zm2.5 0c0-2.75-2.25-5-5-5-.29 0-.57.03-.85.08l1.21 1.21c.28-.05.56-.08.85-.08 1.93 0 3.5 1.57 3.5 3.5s-1.57 3.5-3.5 3.5c-.29 0-.57-.03-.85-.08l-1.21 1.21c.28.05.56.08.85.08 2.75 0 5-2.25 5-5z"/>
                    </svg>
                    <div>
                        <div style="font-weight:500; color:#1db954;">Listening to Spotify</div>
                        <div style="font-size:12px;opacity:0.9; color:#fff;">${mem.spotify.song || 'Unknown Song'}</div>
                        <div style="font-size:11px;opacity:0.7; color:#ccc;">${mem.spotify.artist || 'Unknown Artist'}</div>
                    </div>
                </div>`;
            activityClass = 'activity-listening';
        } 
        else if (Array.isArray(mem.activities) && mem.activities.length > 0) {
            const mainAct = mem.activities.find(a => a.type !== 4) || null;
            if (mainAct) {
                // ✅ Kunin ang icon mula sa Discord assets
                let actIcon = "";
                if (mainAct.assets?.large_image) {
                    if (mainAct.assets.large_image.startsWith('mp:')) {
                        actIcon = `https://media.discordapp.net/${mainAct.assets.large_image.replace('mp:', '')}?size=64`;
                    } else {
                        actIcon = `https://cdn.discordapp.com/app-assets/${mainAct.application_id}/${mainAct.assets.large_image}.png?size=64`;
                    }
                } else if (mainAct.application_id) {
                    actIcon = `https://cdn.discordapp.com/app-icons/${mainAct.application_id}/${mainAct.application_id}.png?size=64`;
                }

                // ✅ Ayusin ayon sa uri ng activity
                switch(mainAct.type) {
                    case 0: // Playing
                        activityHTML = `
                            <div style="display:flex;align-items:center;gap:10px;">
                                ${actIcon ? `<img src="${actIcon}" alt="Game" style="width:32px;height:32px;border-radius:4px;" onerror="this.style.display='none'; this.parentNode.innerHTML='<div style=width:32px;height:32px;border-radius:4px;background:#222;display:flex;align-items:center;justify-content:center;>🎮</div>';">` : `<div style="width:32px;height:32px;border-radius:4px;background:#222;display:flex;align-items:center;justify-content:center;">🎮</div>`}
                                <div>
                                    <div style="font-weight:500; color:#43b581;">Playing ${mainAct.name || 'Game'}</div>
                                    ${mainAct.state ? `<div style="font-size:12px;opacity:0.8;">${mainAct.state}</div>` : ''}
                                </div>
                            </div>`;
                        activityClass = 'activity-playing';
                        break;
                    case 1: // Streaming
                        activityHTML = `
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div style="width:32px;height:32px;border-radius:4px;background:#9146ff;display:flex;align-items:center;justify-content:center;">📹</div>
                                <div>
                                    <div style="font-weight:500; color:#9146ff;">Streaming on ${mainAct.name || 'Stream'}</div>
                                    ${mainAct.state ? `<div style="font-size:12px;opacity:0.8;">${mainAct.state}</div>` : ''}
                                </div>
                            </div>`;
                        activityClass = 'activity-streaming';
                        break;
                    case 2: // Listening
                        activityHTML = `
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div style="width:32px;height:32px;border-radius:4px;background:#1db954;display:flex;align-items:center;justify-content:center;">🎧</div>
                                <div>
                                    <div style="font-weight:500; color:#1db954;">Listening to ${mainAct.name || 'Audio'}</div>
                                    ${mainAct.state ? `<div style="font-size:12px;opacity:0.8;">${mainAct.state}</div>` : ''}
                                </div>
                            </div>`;
                        activityClass = 'activity-listening';
                        break;
                    case 3: // Watching
                        activityHTML = `
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div style="width:32px;height:32px;border-radius:4px;background:#faa61a;display:flex;align-items:center;justify-content:center;">📺</div>
                                <div>
                                    <div style="font-weight:500; color:#faa61a;">Watching ${mainAct.name || 'Video'}</div>
                                    ${mainAct.state ? `<div style="font-size:12px;opacity:0.8;">${mainAct.state}</div>` : ''}
                                </div>
                            </div>`;
                        activityClass = 'activity-watching';
                        break;
                    default: // Iba pang activity
                        activityHTML = `
                            <div style="display:flex;align-items:center;gap:10px;">
                                ${actIcon ? `<img src="${actIcon}" alt="Activity" style="width:32px;height:32px;border-radius:4px;" onerror="this.style.display='none'; this.parentNode.innerHTML='<div style=width:32px;height:32px;border-radius:4px;background:#222;display:flex;align-items:center;justify-content:center;>🔹</div>';">` : `<div style="width:32px;height:32px;border-radius:4px;background:#222;display:flex;align-items:center;justify-content:center;">🔹</div>`}
                                <div>
                                    <div style="font-weight:500; color:#7289da;">${mainAct.name || 'Active'}</div>
                                    ${mainAct.state ? `<div style="font-size:12px;opacity:0.8;">${mainAct.state}</div>` : ''}
                                </div>
                            </div>`;
                        activityClass = 'activity-custom';
                }
            }
        }

        const tooltipDeco = mem.effectURL ? `<img src="${mem.effectURL}" class="tooltip-avatar-decoration" alt="decoration">` : '';
        wrapper.innerHTML = `
            <div class="circle-avatar-container">
                ${decoHTML} 
                <img src="${mem.avatarURL}" class="avatar-img" alt="avatar" loading="lazy">
                <span class="status-indicator ${statusClass}"></span>
            </div>
            <div class="name-label">${mem.displayName}</div>
            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <div class="tooltip-avatar-wrapper">
                        ${tooltipDeco}
                        <img src="${mem.avatarURL}" class="tooltip-avatar-sm" alt="avatar" loading="lazy">
                    </div>
                    <div class="tooltip-user-info">
                        <h4>${mem.displayName}</h4>
                        <p>@${mem.username}</p>
                    </div>
                </div>
                ${noteText ? `<div class="tooltip-custom-note">📝 ${noteText}</div>` : ''}
                ${activityHTML ? `<div class="tooltip-activity-wrapper ${activityClass}">${activityHTML}</div>` : ''}
            </div>
        `;
        box.appendChild(wrapper);
    });
}

        function showMarquee(members, containerId) {
            const box = document.getElementById(containerId);
            if (!box || !Array.isArray(members) || members.length === 0) return;
            const list = [...members, ...members, ...members];
            box.innerHTML = '';
            list.forEach(mem => {
                const block = document.createElement('div');
                block.className = 'marquee-profile-block';
                block.innerHTML = `<img src="${mem.avatarURL}" loading="lazy" alt="avatar"> <span>${mem.displayName}</span>`;
                box.appendChild(block);
            });
        }

        setInterval(fetchAndUpdate, UPDATE_INTERVAL);

        // ✅ Views counter
        function updateViews() {
            let count = localStorage.getItem('page_views');
            if (!count) count = 5689;
            count = parseInt(count) + 1;
            localStorage.setItem('page_views', count);
            document.getElementById('views').innerText = count;
        }
        updateViews();
    </script>
