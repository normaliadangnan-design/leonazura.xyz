<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    background: 
        linear-gradient(rgba(0, 0, 0, 0.90), rgba(0, 0, 0, 0.93)),
        url("bg.webp");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #ffffff;
    overflow-x: hidden;
    min-height: 100vh;
    text-align: center;
}

/* LOGO HEADER */
.header {
    padding-top: 50px;
    margin-bottom: 20px;
    position: relative;
    z-index: 10;
}

.logo {
    width: 100%;
    max-width: 340px;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.5));
}

/* SECTIONS STRUCTURE */
.section-wrapper {
    margin: 45px auto;
    width: 100%;
    max-width: 800px;
    position: relative;
    z-index: 10;
}

/* PUBLIC ENEMY TEXT TYPOGRAPHY */
.clan-symbol {
    font-size: 32px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 20px;
    display: block;
}

.section-subtitle {
    font-size: 8px;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.3);
    text-transform: uppercase;
    margin-bottom: 3px;
    display: block;
}

.section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 25px;
}

/* OVERLAPPING AVATAR CHAIN SYSTEM */
.avatar-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.profile-node {
    position: relative;
    text-decoration: none;
    color: inherit;
    /* Gumagawa ng patong-patong na epekto sa tabi */
    margin-left: -16px; 
    transition: transform 0.25s ease, z-index 0.25s ease;
    z-index: 1;
}

/* Unang item walang kabig sa kaliwa para laging sentro */
.profile-node:first-child {
    margin-left: 0;
}

/* Kapag nag-hover, umaangat sa ibabaw ng mga katabi */
.profile-node:hover {
    transform: scale(1.15) translateY(-5px);
    z-index: 999 !important;
}

.circle-wrapper {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    padding: 3px;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    transition: all 0.25s ease;
}

/* Red Glow para sa specific segments or general hover */
.profile-node:hover .circle-wrapper {
    border-color: #ff3333;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
}

.circle-wrapper img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

/* HOVER TOOLTIPS */
.node-tooltip {
    position: absolute;
    bottom: -45px;
    left: 50%;
    transform: translateX(-50%) translateY(5px);
    background: rgba(5, 5, 5, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 5px 12px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    pointer-events: none;
}

.node-name {
    font-size: 11px;
    font-weight: 700;
    display: block;
    color: #ffffff;
}

.profile-node:hover .node-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* BOTTOM MARQUEE RUNNER */
.marquee-wrapper {
    overflow: hidden;
    width: 100%;
    padding: 14px 0;
    margin-top: 60px;
    background: rgba(0, 0, 0, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid rgba(255, 255, 255, 0.02);
}

.marquee-content {
    display: flex;
    gap: 35px;
    width: max-content;
    animation: runMarquee 28s linear infinite;
}

.marquee-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
}

.marquee-pic {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
}

@keyframes runMarquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* GENERAL WIDGETS */
.top-nav {
    position: absolute;
    top: 30px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    z-index: 20;
    opacity: 0.6;
}

.view-counter {
    padding: 4px 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
}

.discord-anchor {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 9999;
}

.discord-anchor a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    text-decoration: none;
    color: #fff;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
}

.discord-anchor img { width: 16px; }

/* RE-ENTRY DOOR */
#gatekeeper {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s;
}

.gate-button {
    padding: 14px 35px;
    font-size: 10px;
    letter-spacing: 6px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    color: #fff;
}

.exit-gate {
    opacity: 0;
    visibility: hidden;
}
</style>
</head>
