<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>PUBLIC AZURA</title>
    <meta name="description" content="PUBLIC AZURA ORG - Official Website">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://leonazura.xyz/">
    <meta property="og:site_name" content="PUBLIC AZURA">
    <meta property="og:title" content="PUBLIC AZURA ORG">
    <meta property="og:description" content="Official site of PUBLIC AZURA ORG">
    <meta name="twitter:title" content="PUBLIC AZURA ORG">
    <meta name="twitter:description" content="Official site of PUBLIC AZURA ORG">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.lanyard.rest https://cdn.discordapp.com https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:;">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: default;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.92)), 
                url("pba.webp");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 10px;
        }

        .center-container, .navigation-bar {
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        body.loaded .center-container,
        body.loaded .navigation-bar {
            opacity: 1;
            visibility: visible;
        }

        .main-logo-container {
            text-align: center;
            margin: 0 0 20px 0;
        }

        .main-clan-logo {
            background: transparent;
            border: none;
            display: block;
        }

        .main-clan-logo img {
            height: 90px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
        }

        .symbol-break {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin: 5px 0 15px 0;
            text-align: center;
            display: block;
            animation: metallicRGB 2s infinite alternate;
        }

        @keyframes metallicRGB {
            0% { color: #666; text-shadow: 0 0 4px #444, 0 0 8px #555; }
            25% { color: #888; text-shadow: 0 0 6px #666, 0 0 12px #777; }
            50% { color: #ccc; text-shadow: 0 0 8px #999, 0 0 16px #aaa; }
            75% { color: #eee; text-shadow: 0 0 6px #bbb, 0 0 12px #ccc; }
            100% { color: #fff; text-shadow: 0 0 4px #ddd, 0 0 8px #eee; }
        }

        .typewriter-header {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            overflow: visible;
            white-space: nowrap;
            width: fit-content;
            margin: 0 auto 10px auto;
            position: relative;
            border: none;
            animation: metallicRGB 2s infinite alternate;
        }

        .title-group-block {
            position: relative;
            margin: 15px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .staff-header {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            position: relative;
            border: none;
            animation: metallicRGB 2s infinite alternate;
        }

        .navigation-bar {
            position: fixed;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #888;
            opacity: 0.8;
            z-index: 100;
        }

        .views-box {
            padding: 3px 0;
            border: none;
            border-radius: 0;
            font-size: 12px;
            letter-spacing: 1px;
            background: transparent;
            color: #888;
        }
        #views {
            font-weight: 500;
            color: #888;
        }

        .center-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            padding: 0 15px;
            gap: 18px;
            overflow: visible;
            max-height: calc(100vh - 40px);
        }

        .horizontal-avatar-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 35px;
            padding: 10px 0;
            min-height: 110px;
            position: relative;
        }

        .avatar-wrapper-node {
            position: relative;
            transition: transform 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-wrapper-node:hover {
            transform: scale(1.08);
        }

        .circle-avatar-container {
            position: relative;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            overflow: visible;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img.avatar-decoration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.05);
            width: 115px;
            height: 115px;
            pointer-events: none;
            z-index: 1;
            border-radius: 0;
            object-fit: contain;
            background: transparent;
            display: block;
            opacity: 1;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.25));
        }

        .circle-avatar-container img.avatar-img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
            position: relative;
            z-index: 2;
            border: 2px solid #000;
            background: #000;
        }

        .status-indicator {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #000;
            z-index: 3;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f13f43; }
        .status-offline { background-color: #80848e; }

        .avatar-tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #000000;
            border: 1px solid #2a2a2e;
            border-radius: 10px;
            width: 290px;
            padding: 18px;
            color: #ffffff;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
        }
        .avatar-wrapper-node:hover .avatar-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-avatar-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tooltip-avatar-decoration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.08);
            width: 48px;
            height: 48px;
            pointer-events: none;
            z-index: 1;
            object-fit: contain;
        }
        .tooltip-avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            z-index: 2;
            position: relative;
        }

        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .tooltip-user-info h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            color: #fff;
        }
        .tooltip-user-info p {
            font-size: 11px;
            color: #888;
            margin: 2px 0 0 0;
        }

        .tooltip-activity-wrapper {
            background: #111;
            border-radius: 4px;
            padding: 6px 8px;
            margin-top: 8px;
            font-size: 11px;
            color: #aaa;
            word-wrap: break-word;
            max-width: 100%;
        }
        .activity-playing { color: #43b581; }
        .activity-streaming { color: #9146ff; }
        .activity-listening { color: #1db954; }
        .activity-watching { color: #faa61a; }

        .marquee-wrapper-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
            margin: 10px 0 0 0;
            flex-shrink: 0;
        }

        .marquee-ticker {
            overflow: hidden;
            width: 100%;
            max-width: 950px;
            padding: 4px 0;
            background: transparent;
            min-height: 36px;
        }

        .marquee-inner-wrap {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 12px;
            width: max-content;
        }

        .scroll-left { animation: smoothScrollLeft 35s linear infinite; }
        .scroll-right { animation: smoothScrollRight 35s linear infinite; }

        @keyframes smoothScrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-33.333%); }
        }
        @keyframes smoothScrollRight {
            0% { transform: translateX(-33.333%); }
            100% { transform: translateX(0); }
        }

        .marquee-profile-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            background: #0c0c0c;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 14px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }

        .marquee-profile-block img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .discord-animated {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            animation: discordPulse 1.5s infinite alternate;
        }
        .discord-animated img {
            width: 28px;
            height: 28px;
            opacity: 0.75;
        }
        @keyframes discordPulse {
            0% { transform: scale(1); opacity: 0.6; filter: drop-shadow(0 0 3px #5865F2); }
            100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #5865F2); }
        }

        #gateway-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999999;
            cursor: pointer;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .gateway-btn {
            font-size: 22px;
            letter-spacing: 8px;
            background: transparent;
            border: none;
            color: #555;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-weight: 500;
            font-family: 'Oswald', sans-serif;
            opacity: 1;
            visibility: visible;
        }
        .gateway-btn:hover {
            color: #fff;
            text-shadow: 0 0 12px rgba(255,255,255,0.4);
        }

        .fade-gateway {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        ::-webkit-scrollbar { display: none; }

        .name-label {
            text-align: center;
            font-size: 12px;
            margin-top: 6px;
            color: #ccc;
            max-width: 95px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .section-divider {
            width: 100%;
            max-width: 1100px;
            height: 1px;
            background: #222;
            margin: 12px 0;
        }

        @media (max-width: 768px) {
            .main-clan-logo img { height: 70px; }
            .circle-avatar-container {
                width: 75px;
                height: 75px;
            }
            img.avatar-decoration {
                width: 92px;
                height: 92px;
                transform: translate(-50%, -50%) scale(1.05);
            }
            .circle-avatar-container img.avatar-img {
                width: 75px;
                height: 75px;
            }
            .horizontal-avatar-row {
                gap: 22px;
            }
            .typewriter-header {
                font-size: 24px;
            }
            .staff-header {
                font-size: 20px;
            }
            .avatar-tooltip {
                width: 240px;
            }
            .gateway-btn { font-size: 18px; }
        }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return disableKeys(event);">

    <div class="navigation-bar">
        HOME
        <div class="views-box">VIEWS : <span id="views">6529</span></div>
    </div>

    <div class="center-container">
        <div class="main-logo-container">
            <div class="main-clan-logo">
                <img src="public azura.png" alt="PUBLIC AZURA LOGO">
            </div>
            <div class="symbol-break">$</div>
        </div>

        <div id="founder-container" class="horizontal-avatar-row"></div>
        <div class="section-divider"></div>

        <div class="title-group-block">
            <h2 class="typewriter-header">ABOVE ALL</h2>
        </div>

        <div id="aboveall-container" class="horizontal-avatar-row"></div>
        <div class="section-divider"></div>

        <div class="title-group-block">
            <h2 class="staff-header">STAFF</h2>
        </div>

        <div id="staff-container" class="horizontal-avatar-row"></div>

        <div class="marquee-wrapper-group">
            <div class="marquee-ticker">
                <div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div>
            </div>
            <div class="marquee-ticker">
                <div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div>
            </div>
        </div>
    </div>

    <a href="https://discord.gg/azuraorg" class="discord-animated" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" loading="lazy">
    </a>

    <div id="gateway-overlay">
        <div class="gateway-btn">CLICK</div>
    </div>

    <audio id="soundtrack" loop>
        <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">
    

    <script>
        function disableKeys(e) {
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.keyCode == 85) || 
               (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
               (e.ctrlKey && e.keyCode == 83)) {
                return false;
            }
        }
        document.onkeydown = disableKeys;
        document.oncontextmenu = function() { return false; };
        document.onmousedown = function(e) { if(e.button === 2) return false; };

        const audio = document.getElementById("soundtrack");
        audio.volume = 0.4;

        document.getElementById("gateway-overlay").addEventListener("click", function() {
            audio.play().catch(() => {});
            this.classList.add("fade-gateway");
            document.body.classList.add('loaded');
        });

        const UPDATE_INTERVAL = 5000; 

        const founderIDs = ["1250654354344775703", "1123145717461033041", "1085580321623375938"]; 
        const aboveAllIDs = ["1081806153341743144", "1414546504437207161", "918633044276019232", "1499093156321431622", "1242051125776093256", "1498999674969784426"]; 
        const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
        const scrollingIDsRow1 = ["1276210406880317522", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
        const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];


        async function getUserData(userId) {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const json = await res.json();

                if (json.success) {
                    const d = json.data;
                    
                    let status = d.discord_status || 'offline';
                    let activities = d.activities || [];
                    let spotify = d.spotify || null;
                    let customStatus = activities.find(a => a.type === 4) || null;

                    let effectURL = null;
                    if (d.discord_user.avatar_decoration_data?.asset) {
                        const assetId = d.discord_user.avatar_decoration_data.asset.replace(/^a_/, '');
                        effectURL = `https://cdn.discordapp.com/avatar-decoration-presets/a_${assetId}.png?size=256`;
                    }

                    return {
                        id: userId,
                        username: d.discord_user.username,
                        displayName: d.discord_user.global_name || d.discord_user.username,
                        status: status,
                        avatarURL: `https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.png?size=1024`,
                        effectURL: effectURL,
                        spotify: spotify,
                        activities: activities,
                        customStatus: customStatus
                    };
                }
                return null;
            } catch (e) {
                console.log("Error fetching user:", e);
                return null;
            }
        }


        async function fetchAndUpdate() {
            const allFounder = await Promise.all(founderIDs.map(id => getUserData(id)));
            const allAboveAll = await Promise.all(aboveAllIDs.map(id => getUserData(id)));
            const allStaff = await Promise.all(staffIDs.map(id => getUserData(id)));
            const allScroll1 = await Promise.all(scrollingIDsRow1.map(id => getUserData(id)));
            const allScroll2 = await Promise.all(scrollingIDsRow2.map(id => getUserData(id)));

            showGroup(allFounder.filter(Boolean), 'founder-container');
            showGroup(allAboveAll.filter(Boolean), 'aboveall-container');
            showGroup(allStaff.filter(Boolean), 'staff-container');
            showMarquee(allScroll1.filter(Boolean), "marquee-container-1");
            showMarquee(allScroll2.filter(Boolean), "marquee-container-2");
        }


        function showGroup(members, container) {
            const box = document.getElementById(container);
            if (!box) return;
            
            box.innerHTML = '';

            members.forEach(mem => {
                const wrapper = document.createElement('div'); 
                wrapper.className = 'avatar-wrapper-node';

                let decoHTML = '';
                if (mem.effectURL) {
                    decoHTML = `<img src="${mem.effectURL}" class="avatar-decoration" alt="decoration" loading="lazy" onerror="this.remove()">`;
                }

                let statusClass = 'status-offline'; 
                if (mem.status) {
                    const s = mem.status.toLowerCase().trim();
                    if (s === 'online') statusClass = 'status-online';
                    else if (s === 'idle') statusClass = 'status-idle';
                    else if (s === 'dnd') statusClass = 'status-dnd';
                }

                let statusText = '';
                let statusType = '';

                if (mem.spotify) {
                    statusType = 'activity-listening';
                    statusText = `Listening to ${mem.spotify.song}`;
                } 
                else if (mem.activities && mem.activities.length > 0) {
                    const act = mem.activities.find(a => a.type !== 4) || mem.activities[0];
                    if (act) {
                        if (act.type === 0) { statusType = 'activity-playing'; statusText = `Playing ${act.name}`; }
                        if (act.type === 1) { statusType = 'activity-streaming'; statusText = `Streaming ${act.name}`; }
                        if (act.type === 2) { statusType = 'activity-listening'; statusText = `Listening to ${act.name}`; }
                        if (act.type === 3) { statusType = 'activity-watching'; statusText = `Watching ${act.name}`; }
                    }
                }

                if (mem.customStatus && mem.customStatus.state) {
                    statusText = mem.customStatus.state;
                    statusType = '';
                }

                const tooltipDeco = mem.effectURL ? `<img src="${mem.effectURL}" class="tooltip-avatar-decoration" alt="decoration">` : '';

                wrapper.innerHTML = `
                    <div class="circle-avatar-container">
                        ${decoHTML} 
                        <img src="${mem.avatarURL}" class="avatar-img" alt="avatar" loading="lazy">
                        <span class="status-indicator ${statusClass}"></span>
                    </div>
                    <div class="name-label">${mem.displayName}</div>

                    <div class="avatar-tooltip">
                        <div class="tooltip-header">
                            <div class="tooltip-avatar-wrapper">
                                ${tooltipDeco}
                                <img src="${mem.avatarURL}" class="tooltip-avatar-sm" alt="avatar" loading="lazy">
                            </div>
                            <div class="tooltip-user-info">
                                <h4>${mem.displayName}</h4>
                                <p>@${mem.username}</p>
                            </div>
                        </div>
                        ${statusText ? `<div class="tooltip-activity-wrapper ${statusType}">${statusText}</div>` : ''}
                    </div>
                `;
                box.appendChild(wrapper);
            });
        }


        function showMarquee(members, containerId) {
            const box = document.getElementById(containerId);
            if (!box || members.length === 0) return;
            const list = [...members, ...members, ...members];
            box.innerHTML = '';
            list.forEach(mem => {
                const block = document.createElement('div');
                block.className = 'marquee-profile-block';
                block.innerHTML = `<img src="${mem.avatarURL}" loading="lazy"> <span>${mem.displayName}</span>`;
                box.appendChild(block);
            });
        }


        fetchAndUpdate();
        setInterval(fetchAndUpdate, UPDATE_INTERVAL);
    </script>
</body>
</html>
