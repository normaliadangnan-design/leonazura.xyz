    <script>
        // 🛡️ SECURITY
        function disableKeys(e) {
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.keyCode == 85) || 
               (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
               (e.ctrlKey && e.keyCode == 83) ||
               (e.ctrlKey && e.shiftKey && e.keyCode == 67) ||
               (e.ctrlKey && e.keyCode == 73)) {
                e.preventDefault();
                return false;
            }
        }
        document.onkeydown = disableKeys;
        document.oncontextmenu = () => false;
        document.onmousedown = e => e.button === 2 ? false : true;


        // 🔢 ✅ TUNAY NA VISITOR COUNTER — BAGONG BISITA LANG DADAGDAGAN
        const VIEWS_STORAGE_KEY = "azura_org_total_views";
        const VISITOR_KEY       = "azura_org_visited_before";
        const BASE_VIEWS        = 5569; // ⬅️ simula base sa totoong bilang ng site mo

        function initVisitorCounter(){
            // Kunin ang nakaimbak na bilang, kung wala pa gamitin yung base
            let totalViews = parseInt(localStorage.getItem(VIEWS_STORAGE_KEY)) || BASE_VIEWS;
            const hasVisited = localStorage.getItem(VISITOR_KEY) === "true";

            // ✅ KUNG BAGONG BISITA TALAGA → +1 LANG ISANG BESES
            if(!hasVisited){
                totalViews += 1;
                localStorage.setItem(VISITOR_KEY, "true");
                localStorage.setItem(VIEWS_STORAGE_KEY, totalViews);
            }

            // ✅ SMOOTH COUNTING ANIMATION
            const viewsEl = document.getElementById("views");
            const duration = 1800; // ms
            const start = 0;
            const end = totalViews;
            const startTime = performance.now();

            function animateCount(now){
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease out cubic
                const current = Math.floor(start + (end - start) * eased);
                viewsEl.textContent = current.toLocaleString();

                if(progress < 1) requestAnimationFrame(animateCount);
                else viewsEl.textContent = end.toLocaleString();
            }
            requestAnimationFrame(animateCount);
        }
        // Patakbuhin agad pagkabukas
        initVisitorCounter();

        // ✅ ✨ ACTIVITY DETECTION — BUO AT TUMPAK ✨
        async function getUserData(userId) {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`, { cache: "no-store" });

                const d = json.data;
                    
                const activities = d.activities || [];
                const customStatus = activities.find(a => a.type === 4) || null;
                const realActivities = activities.filter(a => a.type !== 4);
                const mainAct = realActivities[0] || null;

                let activityInfo = { type: null, text: null, class: '' };

                if (d.spotify) {
                    activityInfo = {
                        type: "listening",
                        text: `🎧 Listening to ${d.spotify.song}\nby ${d.spotify.artist}`,
                        class: "activity-listening"
                    };
                }
                else if (mainAct && mainAct.type === 0) {
                    let details = mainAct.name;
                    if (mainAct.details) details += `\n${mainAct.details}`;
                    if (mainAct.state)   details += `\n${mainAct.state}`;
                    activityInfo = { type:"playing", text:`🎮 Playing ${details}`, class:"activity-playing" };
                }
                else if (mainAct && mainAct.type === 1) {
                    activityInfo = { type:"streaming", text:`📡 Streaming ${mainAct.name}`, class:"activity-streaming" };
                }
                else if (mainAct && mainAct.type === 2) {
                    activityInfo = { type:"listening", text:`🎧 Listening to ${mainAct.name}`, class:"activity-listening" };
                }
                else if (mainAct && mainAct.type === 3) {
                    activityInfo = { type:"watching", text:`📺 Watching ${mainAct.name}`, class:"activity-watching" };
                }
                else if (customStatus) {
                    let emoji = customStatus.emoji?.name || '';
                    let txt   = customStatus.state || '';
                    activityInfo = { 
                        type:"custom", 
                        text: txt ? `${emoji ? emoji+' ' : ''}${txt}` : (emoji ? emoji : 'No activity'),
                        class:"activity-custom" 
                    };
                }

                return {
                    id: userId,
                    username: d.discord_user.username,
                    displayName: d.discord_user.global_name || d.discord_user.username,
                    status: d.discord_status || 'offline',
                    avatarURL: `https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.png?size=1024`,
                    effectURL: d.discord_user.avatar_decoration_data?.asset 
                        ? `https://cdn.discordapp.com/avatar-decoration-presets/${d.discord_user.avatar_decoration_data.asset}.png?size=256` 
                        : null,
                    activity: activityInfo
                };
            } catch (e) {
                console.warn("Lanyard error:", userId, e);
                return null;
            }
        }


        async function fetchAndUpdate() {
            const [allFounder, allAboveAll, allStaff, allScroll1, allScroll2] = await Promise.all([
                Promise.all(founderIDs.map(getUserData)),
                Promise.all(aboveAllIDs.map(getUserData)),
                Promise.all(staffIDs.map(getUserData)),
                Promise.all(scrollingIDsRow1.map(getUserData)),
                Promise.all(scrollingIDsRow2.map(getUserData))
            ]);

            showGroup(allFounder.filter(Boolean),   'founder-container');
            showGroup(allAboveAll.filter(Boolean),  'aboveall-container');
            showGroup(allStaff.filter(Boolean),     'staff-container');
            showMarquee(allScroll1.filter(Boolean), "marquee-container-1");
            showMarquee(allScroll2.filter(Boolean), "marquee-container-2");
        }


        function showGroup(members, containerId) {
            const box = document.getElementById(containerId);
            if (!box) return;
            box.innerHTML = '';

            members.forEach(mem => {
                const wrapper = document.createElement('div'); 
                wrapper.className = 'avatar-wrapper-node';

                const decoHTML = mem.effectURL 
                    ? `<img src="${mem.effectURL}" class="avatar-decoration" alt="deco" loading="lazy">` 
                    : '';

                const statusMap = { online:'status-online', idle:'status-idle', dnd:'status-dnd' };
                const statusClass = statusMap[mem.status] || 'status-offline';

                const actHTML = mem.activity?.text 
                    ? `<div class="tooltip-activity-wrapper ${mem.activity.class}" style="white-space:pre-line;">${mem.activity.text}</div>` 
                    : '';

                wrapper.innerHTML = `
                    <div class="circle-avatar-container">
                        ${decoHTML} 
                        <img src="${mem.avatarURL}" class="avatar-img" alt="avatar" loading="lazy">
                        <span class="status-indicator ${statusClass}"></span>
                    </div>
                    <div class="name-label">${mem.displayName}</div>
                    <div class="avatar-tooltip">
                        <div class="tooltip-header">
                            <img src="${mem.avatarURL}" class="tooltip-avatar-sm">
                            <div class="tooltip-user-info">
                                <h4>${mem.displayName}</h4>
                                <p>@${mem.username}</p>
                            </div>
                        </div>
                        ${actHTML}
                    </div>
                `;
                box.appendChild(wrapper);
            });
        }


        function showMarquee(members, containerId) {
            const box = document.getElementById(containerId);
            if (!box || members.length === 0) return;
            const list = [...members, ...members, ...members];
            box.innerHTML = '';
            list.forEach(mem => {
                const block = document.createElement('div');
                block.className = 'marquee-profile-block';
                block.innerHTML = `<img src="${mem.avatarURL}" loading="lazy"> <span>${mem.displayName}</span>`;
                box.appendChild(block);
            });
        }


        fetchAndUpdate();
        setInterval(fetchAndUpdate, UPDATE_INTERVAL);
    </script>
</body>
</html>
