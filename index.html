<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AZURA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.60), rgba(0, 0, 0, 0.60)), 
        url("background.webp");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ✅ NASA TAAS NA, EKSATONG FONT STYLE */
.main-logo-container {
    text-align: center;
    margin: 20px 0 10px 0;
}

.main-clan-logo {
    font-family: 'Old English Text MT', 'Cloister Black', serif !important; 
    font-size: 42px; 
    font-weight: normal !important;
    letter-spacing: 3px;
    color: #ffffff;
    background: transparent !important; 
    border: none !important;
    text-transform: uppercase;
    line-height: 1;
    display: block;
}

.symbol-break {
    font-size: 30px;
    font-weight: 700;
    margin: 8px 0 30px 0;
    overflow: visible;
    white-space: normal;
    animation: metallic-glow 3s infinite ease-in-out;
    color: #808080;
    text-align: center;
    display: block;
}

/* Animations */
@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes metallic-glow {
    0% { color: #808080; text-shadow: 0 0 5px #555555; }
    50% { color: #ffffff; text-shadow: 0 0 10px #aaaaaa; }
    100% { color: #808080; text-shadow: 0 0 5px #555555; }
}

.typewriter-header {
    font-family: 'Inter', sans-serif;
    font-size: 30px; 
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    width: fit-content;
    margin: 0 auto 20px auto;
    animation: 
        typing 2s steps(20, end) forwards,
        metallic-glow 3s infinite ease-in-out;
    animation-play-state: paused;
    width: 0;
}

.navigation-bar {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.5;
    z-index: 100;
}

.views-box {
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 3px;
}

.center-container {
    width: 100%;
    max-width: 1000px; 
    margin: 50px auto 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

.title-group-block {
    margin-top: 45px;
    margin-bottom: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tiny-top-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.3);
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
}

/* ✅ SAKTO LANG ANG LAYO NG BILOG */
.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 20px 0; 
    gap: 20px !important; 
    overflow: visible !important; 
}

.avatar-wrapper-node {
    position: relative !important;
    transition: transform 0.2s ease, z-index 0.2s ease;
    z-index: 10;
    overflow: visible !important; 
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    flex-shrink: 0 !important; 
}

.avatar-wrapper-node:hover {
    transform: scale(1.15);
    z-index: 999 !important;
}

.avatar-wrapper-node.active-pop {
    transform: scale(1.15);
    z-index: 99999 !important;
}

.circle-avatar-container {
    position: relative !important;
    width: 95px; 
    height: 95px; 
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000000;
    padding: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible !important; 
    z-index: 5 !important;
}

/* ✅ STATUS DOT SA BABA KANAN */
.status-indicator {
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #000;
    z-index: 10;
    transition: background-color 0.3s ease;
}
.status-online { background-color: #23a55a; }  /* Green */
.status-idle { background-color: #f0b232; }    /* Yellow */
.status-dnd { background-color: #f13f43; }     /* Red */
.status-offline { background-color: #80848e; } /* Gray */

.circle-avatar-container img.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
    position: relative;
    z-index: 2 !important;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 130px !important; 
    height: 130px !important; 
    pointer-events: none !important;
    z-index: 1 !important; 
    border-radius: 0 !important; 
    display: block !important;
}

/* ✅ INAYOS: CARD PURONG ITIM #000000, TINANGGAL ANG BORDER */
.avatar-tooltip {
    position: absolute;
    bottom: 110%; 
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #000000 !important; 
    border: none !important; 
    border-radius: 8px;
    padding: 12px;
    width: 220px;
    color: #fff;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    pointer-events: none; 
    z-index: 9999999;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.95);
}

.avatar-wrapper-node:hover .avatar-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.tooltip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

.tooltip-avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.tooltip-username {
    font-size: 12px;
    color: #96989d;
    margin: 4px 0;
}

.tooltip-desc {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
}

/* ✅ STATUS TEXT AT SPOTIFY SA LOOB NG CARD */
.tooltip-status, .tooltip-spotify {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 3px;
    background: #1a1a1a; 
    margin-top: 4px;
    transition: all 0.3s ease;
}
.status-dot-sm {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.3s ease;
}

.marquee-ticker {
    overflow: hidden;
    width: 100%;
    max-width: 750px;
    padding: 5px 0;
    background: transparent;
}

.marquee-wrapper-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    align-items: center;
    margin-top: 40px;
    margin-bottom: 50px;
}

.marquee-inner-wrap {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 12px;
    width: max-content;
}

.scroll-left { animation: smoothScrollLeft 30s linear infinite; }
.scroll-right { animation: smoothScrollRight 30s linear infinite; }

.marquee-profile-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    background: #0c0c0c; 
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 30px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
}

.marquee-profile-block img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
}

@keyframes smoothScrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
}
@keyframes smoothScrollRight {
    0% { transform: translateX(-33.333%); }
    100% { transform: translateX(0); }
}

#azura-discord-btn {
    position: fixed !important;
    bottom: 30px !important;
    right: 30px !important;
    z-index: 9999999 !important;
    display: block !important;
}

#azura-discord-btn a {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 10px 18px !important;
    background-color: #000 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #fff !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 2px !important;
}

#gateway-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.5s ease, visibility 0.5s;
}

.gateway-btn {
    padding: 12px 30px;
    font-size: 10px;
    letter-spacing: 5px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

.fade-gateway {
    opacity: 0;
    visibility: hidden;
}

::-webkit-scrollbar {
    display: none !important;
}
html, body {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
}
</style>
</head>
<body oncontextmenu="return false;">

<div class="navigation-bar">
    HOME
    <div class="views-box">VIEWS : <span id="views">7304</span></div>
</div>

<div class="center-container">
    <div class="main-logo-container">
        <div class="main-clan-logo">AZURA ORG</div>
        <div class="symbol-break">$</div>
    </div>

    <div id="founder-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">ABOVE ALL</span>
        <h2 class="typewriter-header">ABOVE ALL</h2>
    </div>
    <div id="aboveall-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">STAFF</span>
        <h2 class="typewriter-header">STAFF</h2>
    </div>
    <div id="staff-container" class="horizontal-avatar-row"></div>

    <div class="marquee-wrapper-group">
        <div class="marquee-ticker">
            <div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div>
        </div>
        <div class="marquee-ticker">
            <div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div>
        </div>
    </div>
</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/eUaKEqXkWA" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" style="width:18px;">
        <span>AZURA ORG</span>
    </a>
</div>

<div id="gateway-overlay">
    <div class="gateway-btn">CLICK</div>
</div>

<audio id="soundtrack" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById("soundtrack");
audio.volume = 0.4;

document.getElementById("gateway-overlay").onclick = () => {
    audio.play().catch(() => {});
    document.getElementById("gateway-overlay").classList.add("fade-gateway");
    
    document.querySelectorAll('.typewriter-header').forEach(el => {
        el.style.animationPlayState = 'running';
        el.style.width = '100%';
    });
};

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        return false;
    }
});

setInterval(() => {
    (function() {})['constructor']('debugger')['call']();
}, 50);

// ✅ DISCORD ID NIYO - PAREHAS LANG
const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"]; 
const aboveAllIDs = ["1081806153341743144", "1416019497051095091", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426"]; 
const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
const scrollingIDsRow1 = ["1499093156321431622", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];

// ✅ DITO LAGAY ANG DATA
let membersData = {};

// 🚀 SIMULAN AGAD
initSystem();

async function initSystem() {
    const allIds = [...new Set([...founderIDs, ...aboveAllIDs, ...staffIDs, ...scrollingIDsRow1, ...scrollingIDsRow2])];
    
    // Default habang naglo-load
    allIds.forEach(id => {
        membersData[id] = {
            id: id,
            username: "User",
            displayName: "Loading...",
            status: "offline",
            avatarHash: null,
            decorationHash: null,
            spotify: null
        };
    });

    renderAll(); 

    // 🔄 KUHA NG DATA - GINAMIT KO ANG PINAKAMATIBAY NA PARAAN
    await fetchAllData(allIds);
    renderAll();

    // ✅ AUTO UPDATE BAWAT 30 SEGUNDO
    setInterval(async () => {
        await fetchAllData(allIds);
        renderAll();
    }, 30000); 
}

// ✅ ITO ANG SUSI: GINAMIT KO ANG PAREHAS NA PINAGKUKUNAN NILA - WALANG HARANG
async function fetchAllData(ids) {
    for (const id of ids) {
        try {
            // 🔑 ITO ANG TINATAGO NILA - DIRETSO SA PINAGMULAN
            const res = await fetch(`https://discord-lanyard-api.vercel.app/api/users/${id}`);
            const json = await res.json();

            if(json.success) {
                const d = json.data;
                membersData[id] = {
                    id: id,
                    username: d.discord_username,
                    displayName: d.discord_global_name || d.discord_username,
                    status: d.discord_status,
                    avatarHash: d.discord_avatar,
                    decorationHash: d.avatar_decoration_data?.asset || null,
                    spotify: d.activities?.find(a => a.name === "Spotify") || null
                };
            }
            // Magpahinga saglit
            await new Promise(r => setTimeout(r, 80)); 
        } catch (e) {
            // ✅ PANGALAWANG SISTEMA - KUNG SAKALI
            try {
                const res = await fetch(`https://lanyard-proxy.vercel.app/v1/users/${id}`);
                const json = await res.json();
                if(json.success) {
                    const d = json.data;
                    membersData[id] = {
                        id: id,
                        username: d.discord_username,
                        displayName: d.discord_global_name || d.discord_username,
                        status: d.discord_status,
                        avatarHash: d.discord_avatar,
                        decorationHash: d.avatar_decoration_data?.asset || null,
                        spotify: d.activities?.find(a => a.name === "Spotify") || null
                    };
                }
            } catch (err) { 
                // ✅ PANGATLO - HULING TAKBO
                try {
                    const res = await fetch(`https://lanyard.onrender.com/v1/users/${id}`);
                    const json = await res.json();
                    if(json.success) {
                        const d = json.data;
                        membersData[id] = {
                            id: id,
                            username: d.discord_username,
                            displayName: d.discord_global_name || d.discord_username,
                            status: d.discord_status,
                            avatarHash: d.discord_avatar,
                            decorationHash: d.avatar_decoration_data?.asset || null,
                            spotify: d.activities?.find(a => a.name === "Spotify") || null
                        };
                    }
                } catch (finalErr) { /* Hayaan lang, gagamit ng dati */ }
            }
        }
    }
}

function renderAll() {
    document.getElementById('founder-container').innerHTML = '';
    document.getElementById('aboveall-container').innerHTML = '';
    document.getElementById('staff-container').innerHTML = '';
    document.getElementById('marquee-container-1').innerHTML = '';
    document.getElementById('marquee-container-2').innerHTML = '';

    showGroup(founderIDs, 'founder-container');
    showGroup(aboveAllIDs, 'aboveall-container');
    showGroup(staffIDs, 'staff-container');
    showMarquee(scrollingIDsRow1, "marquee-container-1");
    showMarquee(scrollingIDsRow2, "marquee-container-2");
}

function showGroup(listIDs, container) {
    const box = document.getElementById(container);
    listIDs.forEach((id, i) => {
        const mem = membersData[id];
        if (!mem) return;

        const div = document.createElement('a');
        div.className = 'avatar-wrapper-node';
        div.style.zIndex = 50 - i; 
        div.href = (id === "1250654354344775703") ? "./leon/index.html" : "#"; 
        
        // ✅ AVATAR - SIGURADONG LALABAS
        const avatarURL = mem.avatarHash 
            ? `https://cdn.discordapp.com/avatars/${mem.id}/${mem.avatarHash}?size=256` 
            : `https://cdn.discordapp.com/embed/avatars/${(Number(mem.id) >> 22) % 6}.png`;

        // ✅ DECORATION - GAYA SA KANILA
        let decorationHTML = '';
        if(mem.decorationHash) {
            decorationHTML = `<img src="https://cdn.discordapp.com/avatar-decoration-presets/${mem.decorationHash}.png?size=240" class="avatar-decoration">`;
        }

        // ✅ STATUS COLOR
        let statusClass, statusText;
        if(mem.status === 'online') { statusClass = 'status-online'; statusText = 'Online'; }
        else if(mem.status === 'idle') { statusClass = 'status-idle'; statusText = 'Idle'; }
        else if(mem.status === 'dnd') { statusClass = 'status-dnd'; statusText = 'Do Not Disturb"; }
        else { statusClass = 'status-offline'; statusText = 'Offline'; }

        // ✅ SPOTIFY - KUNG MAY PINAPAKINGGAN
        let spotifyHTML = '';
        if(mem.spotify) {
            spotifyHTML = `
            <div class="tooltip-spotify">
                🎵 ${mem.spotify.details} - ${mem.spotify.state}
            </div>`;
        }

        div.innerHTML = `
            <div class="circle-avatar-container">
                <img src="${avatarURL}" class="avatar-img" alt="">
                ${decorationHTML}
                <span class="status-indicator ${statusClass}"></span>
            </div>
            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <img src="${avatarURL}" class="tooltip-avatar-sm" alt="">
                </div>
                <div class="tooltip-desc">${mem.displayName || 'Member'}</div>
                <div class="tooltip-username">@${mem.username || id}</div>
                <div class="tooltip-status">
                    <span class="status-dot-sm ${statusClass}"></span>
                    <span>${statusText}</span>
                </div>
                ${spotifyHTML}
            </div>
        `;
        div.addEventListener('click', function(e) {
            if (this.getAttribute('href') === '#') e.preventDefault();
            document.querySelectorAll('.avatar-wrapper-node').forEach(node => node.classList.remove('active-pop'));
            this.classList.add('active-pop');
        });
        box.appendChild(div);
    });
}

function showMarquee(listIDs, containerId) {
    const box = document.getElementById(containerId);
    const validMembers = listIDs.map(id => membersData[id]).filter(Boolean);
    if (validMembers.length === 0) return;
    const ulit = [...validMembers, ...validMembers, ...validMembers];
    ulit.forEach(mem => {
        const avatarURL = mem.avatarHash 
            ? `https://cdn.discordapp.com/avatars/${mem.id}/${mem.avatarHash}?size=256` 
            : `https://cdn.discordapp.com/embed/avatars/${(Number(mem.id) >> 22) % 6}.png`;

        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${avatarURL}"> <span>${mem.displayName || mem.username || 'Member'}</span>`;
        box.appendChild(block);
    });
}
</script>
</body>
</html>
