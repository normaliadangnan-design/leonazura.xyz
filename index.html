<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leon</title>
<meta name="description" content="Leon — Discord profile, music and socials">
<meta name="theme-color" content="#050505">
<!-- Open Graph: palitan ang og:image ng buong URL (https://domain.com/leon2.jpg) kapag naka-host na -->
<meta property="og:type" content="website">
<meta property="og:title" content="Leon">
<meta property="og:description" content="Discord profile, music and socials">
<meta property="og:image" content="leon2.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0c0c0d;--line:rgba(255,255,255,.08);--text:#f4f4f5;--muted:#a1a1a8;--online:#3ba55d;--idle:#faa81a;--dnd:#ed4245;--off:#747f8d;--rx:0deg;--ry:0deg}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 45%,#161616,#050505 70%);color:var(--text);font-family:"Inter",system-ui,sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65))}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
img{-webkit-user-drag:none;user-drag:none}
img:not([src]){visibility:hidden}
button{font-family:inherit}

/* loading */
#loading-screen{position:fixed;inset:0;background:#050505;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s ease,visibility .7s ease;overflow:hidden}
#loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-gif{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;transition:transform .9s ease,filter .9s ease}
#loading-screen.hidden .loading-gif{transform:scale(1.1);filter:blur(8px)}
.loading-text{position:relative;z-index:1;font-family:"Fredoka",sans-serif;font-size:clamp(1rem,3vw,1.8rem);color:var(--text);letter-spacing:.1em;text-align:center;padding:0 20px;text-shadow:0 0 10px #000,0 0 20px #000;min-height:1.4em}
.caret{display:inline-block;width:2px;height:1em;background:#fff;margin-left:3px;vertical-align:-.12em;animation:blink .8s steps(1) infinite}
#loading-screen.typed .caret{display:none}
.loading-dots{display:inline-flex;gap:2px;opacity:0;transition:opacity .3s}
#loading-screen.typed .loading-dots{opacity:1}
.loading-dots span{animation:bounce 1.4s infinite ease-in-out both}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
.loading-bar{position:relative;z-index:1;width:min(280px,60vw);height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;box-shadow:0 0 12px #000}
.loading-bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
#loading-screen.ready .loading-bar{display:none}
.enter{position:relative;z-index:1;display:inline-flex;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.3em;padding:13px 30px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.5);color:#fff;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:epulse 1.8s ease-in-out infinite;transition:transform .2s,background .2s}
.enter[hidden]{display:none}
.enter:hover{transform:scale(1.06);background:rgba(255,255,255,.15)}
@keyframes epulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@keyframes blink{50%{opacity:0}}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

/* background */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:55vmax;height:55vmax;border-radius:50%;background:radial-gradient(circle,var(--bc,rgba(255,255,255,.4)),transparent 68%);opacity:calc(.16 + var(--lvl,0)*.4);transform:scale(calc(1 + var(--lvl,0)*.25));animation:drift 26s ease-in-out infinite alternate;will-change:transform,opacity}
.b1{--bc:rgba(120,140,255,.55);left:-15vmax;top:-20vmax}
.b2{--bc:rgba(190,120,255,.45);right:-18vmax;bottom:-22vmax;animation-duration:32s;animation-direction:alternate-reverse}
.b3{--bc:rgba(80,220,200,.35);left:30%;top:35%;width:35vmax;height:35vmax;animation-duration:38s}
@keyframes drift{to{translate:12vw 9vh}}
.party .b1{--bc:#ff3cac}.party .b2{--bc:#2b86c5}.party .b3{--bc:#f7ff00}
.party .blob{opacity:calc(.35 + var(--lvl,0)*.4);animation:drift 6s ease-in-out infinite alternate,hue 4s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stars{position:fixed;inset:0;z-index:0}

.stage{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:34px;padding:40px 20px 64px;perspective:1400px}
.card{position:relative;background:linear-gradient(180deg,#121213,#0c0c0d) padding-box,conic-gradient(from var(--ang,0deg),rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 68%,rgba(255,255,255,.95) 100%) border-box;border:1px solid transparent;border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .25s ease-out,opacity .5s ease,visibility .5s ease;transform-style:preserve-3d;opacity:0;visibility:hidden}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.10),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover::after{opacity:1}
.card.visible{opacity:1;visibility:visible;animation:in .9s ease both}
.mid.visible{animation-delay:.1s}
.right.visible{animation-delay:.2s}
.card.visible.float{animation:float var(--fd,7s) ease-in-out var(--fdel,0s) infinite}
.left{--fd:8s;--fdel:-2s}
.mid{--fd:6.5s;--fdel:-4s}
.right{--fd:7.5s;--fdel:-1s}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes fade{from{opacity:0}}
.left{width:340px;padding:20px;transform:translate(var(--dx,0px),var(--dy,0px)) rotateY(calc(11deg + var(--ry))) rotateX(var(--rx)) rotateZ(-1.5deg)}
.mid{width:384px;overflow:hidden;transform:translate(var(--dx,0px),var(--dy,0px)) rotateX(var(--rx)) rotateY(var(--ry))}
.right{width:352px;padding:24px 26px;transform:translate(var(--dx,0px),var(--dy,0px)) rotateY(calc(-11deg + var(--ry))) rotateX(var(--rx)) rotateZ(1.5deg);box-shadow:0 30px 60px rgba(0,0,0,.65),0 0 calc(var(--lvl,0)*70px) rgba(255,255,255,calc(var(--lvl,0)*.16)),inset 0 1px 0 rgba(255,255,255,.04)}
.right::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,calc(var(--lvl,0)*.14)),transparent 62%)}
@media(pointer:fine){.card{cursor:grab}}

.frame{border-radius:18px;overflow:hidden;aspect-ratio:3/4.1;background:#000;border:1px solid var(--line)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,-2%)}}
.top{height:150px;background:linear-gradient(120deg,#bdbdbd,#3a3a3a,#8a8a8a,#0c0c0d 85%);background-size:300% 300%;animation:bn 8s ease-in-out infinite}
@keyframes bn{50%{background-position:100% 50%}}
.body{display:grid;justify-items:center;gap:10px;padding:0 24px 26px;margin-top:-84px;text-align:center}
.av{position:relative;width:172px;height:172px;transition:transform .35s cubic-bezier(.2,1.4,.3,1);cursor:pointer}
.av:hover{transform:scale(1.06) rotate(-2deg)}
.av:active{transform:scale(.96)}
.av .a{position:absolute;inset:12%;width:76%;height:76%;border-radius:50%;object-fit:cover;background:#222}
.av .d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.av .d[hidden]{display:none}
.dot{position:absolute;right:20px;bottom:20px;width:24px;height:24px;border-radius:50%;border:4px solid var(--card);background:var(--off);transition:background .4s}
.dot.online{background:var(--online);--r:rgba(59,165,93,.7);animation:ring 2s infinite}
.dot.idle{background:var(--idle);--r:rgba(250,168,26,.7);animation:ring 2.4s infinite}
.dot.dnd{background:var(--dnd);--r:rgba(237,66,69,.7);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--r)}70%,100%{box-shadow:0 0 0 9px transparent}}
.bub{position:absolute;right:-18px;top:2px;max-width:140px;background:#fff;color:#0a0a0a;font-family:"Fredoka",sans-serif;font-weight:700;font-size:.85rem;line-height:1.1;padding:9px 12px;border-radius:20px 20px 20px 4px;transform:rotate(8deg);box-shadow:0 6px 18px rgba(0,0,0,.5);animation:pop .5s .6s cubic-bezier(.2,1.4,.3,1) both}
.bub[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(8deg)}}
.name{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.2rem;line-height:1;margin-top:6px;letter-spacing:.01em;text-shadow:0 2px 14px rgba(255,255,255,.15);cursor:default}
.name:hover{animation:gl .35s steps(2) infinite}
@keyframes gl{0%{text-shadow:2px 0 #f0f,-2px 0 #0ff}50%{text-shadow:-2px 0 #f0f,2px 0 #0ff;transform:translateX(1px)}100%{text-shadow:2px 1px #0ff,-2px -1px #f0f}}
.handle{color:var(--muted);font-weight:500;letter-spacing:.06em;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.badges[hidden]{display:none}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1a1a1c;border:1px solid var(--line);font-size:.95rem;cursor:help;transition:transform .2s;animation:pop .45s cubic-bezier(.2,1.4,.3,1) both}
.badge:hover{transform:translateY(-3px) scale(1.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:.76rem;padding:3px 10px;border-radius:999px;background:#1a1a1c;border:1px solid var(--line);color:var(--text);transition:transform .2s,background .2s}
.chip:hover{transform:translateY(-2px);background:#232326}
.row{width:100%;background:#141416;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;text-align:left}
.row[hidden]{display:none}
.row .ic{font-size:22px;flex:none}
.row .ic img{width:24px;height:24px;object-fit:contain;display:block}
.row .t{font-size:.72rem;color:var(--muted)}
.row .x{overflow-wrap:anywhere;white-space:pre-wrap;font-size:.95rem}
.row.upd{animation:flash .9s ease}
@keyframes flash{from{background:#2c2c32}to{background:#141416}}
.fadein{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}}
.soc{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.soc a{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#d4d4d8;background:radial-gradient(circle at 35% 30%,#2a2a2d,#121214);border:1px solid var(--line);box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .2s,translate .15s ease-out,color .2s,box-shadow .2s}
.soc a:hover{transform:translateY(-4px) rotate(-6deg);color:#fff;box-shadow:0 10px 22px rgba(255,255,255,.12)}
.soc a:active{transform:scale(.9)}
.soc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg{font-size:.85rem;color:var(--muted)}
.err{color:#ffb3b5}
.small{font-size:.76rem;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.small[hidden]{display:none}

/* player */
.np{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;letter-spacing:.18em;font-weight:600;color:#d4d4d8}
.npr{display:flex;align-items:center;gap:10px}
.lst{background:none;border:0;color:#d4d4d8;cursor:pointer;display:grid;place-items:center;padding:2px;transition:transform .2s,color .2s}
.lst:hover{transform:scale(1.15);color:#fff}
.lst svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.eqi{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eqi i{width:3px;background:#fff;height:4px}
.playing .eqi i{animation:eq 1s ease-in-out infinite}
.eqi i:nth-child(2){animation-delay:-.4s}
.eqi i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.cw{margin:14px 0;border-radius:12px;transform:scale(calc(1 + var(--lvl,0)*.025));box-shadow:0 0 calc(var(--lvl,0)*34px) rgba(255,255,255,calc(var(--lvl,0)*.28))}
.cover{width:100%;aspect-ratio:2.2/1;object-fit:cover;border-radius:12px;background:#18181a;filter:grayscale(1) contrast(1.1);display:block}
.title{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.artist{color:var(--muted);font-size:.88rem;margin-top:4px}
.cap{margin-top:12px;min-height:1.3em;text-align:center;font-family:"Fredoka",sans-serif;font-size:.92rem;color:#e4e4e7}
.cap[hidden]{display:none}
.trk{animation:trk .45s ease both}
.artist.trk{animation-delay:.07s}
.cover.trk{animation:trkc .55s ease both}
@keyframes trk{from{opacity:0;transform:translateY(8px)}}
@keyframes trkc{from{opacity:0;transform:scale(.94)}}
.prog{margin-top:16px}
.tr{height:3px;background:rgba(255,255,255,.14);border-radius:3px;cursor:pointer;position:relative}
.tr i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:3px}
.tm{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px}
.ctl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
.ctl button{position:relative;border:1px solid var(--line);background:radial-gradient(circle at 35% 30%,#2a2a2d,#141416);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;transition:transform .15s,translate .15s ease-out,color .2s}
.ctl button.big{width:54px;height:54px}
.ctl button.sm{width:34px;height:34px;color:#6b6b72}
.ctl button.sm.on{color:#fff}
.ctl button.one::after{content:"1";position:absolute;right:5px;top:3px;font-size:.55rem;font-weight:700;color:#fff}
.ctl button:hover{transform:scale(1.08)}
.ctl button:active{transform:scale(.88)}
.ctl svg{width:16px;height:16px;fill:currentColor}
.ctl .big svg{width:20px;height:20px}
.ctl .sm svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#playIc.swap{animation:iconpop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes iconpop{from{transform:scale(.5) rotate(-40deg);opacity:.4}}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:22px;margin-top:14px}
.wave i{width:2px;height:4px;background:#8a8a90;border-radius:2px;transition:height .08s linear}
.playing .wave i{background:#d4d4d8}
.vol{display:flex;align-items:center;gap:10px;margin-top:12px;color:#d4d4d8}
.vol svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,70%),rgba(255,255,255,.14) var(--p,70%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.pl{display:grid;gap:4px;max-height:0;opacity:0;overflow:hidden;margin-top:0;transition:max-height .45s ease,opacity .3s,margin .3s}
.pl.open{max-height:240px;opacity:1;margin-top:14px;overflow:auto}
.pli{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--text);font-size:.85rem;text-align:left;cursor:pointer;transition:background .2s}
.pli:hover{background:#1a1a1c}
.pli.act{background:#1f1f22;border-color:var(--line)}
.pli b{font-weight:500;width:16px;flex:none;color:var(--muted)}
.pli span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro .ctl,.ro .vol,.ro .lst,.ro .pl{display:none}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* marquee, glow, particles, toast */
.marq{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:4;overflow:hidden;pointer-events:none;display:flex;align-items:center;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);font-family:"Fredoka",sans-serif;font-size:.78rem;letter-spacing:.22em;color:rgba(255,255,255,.55);text-transform:uppercase}
.mt{display:flex;width:max-content;animation:mq 40s linear infinite}
.mt span{white-space:pre;padding-right:3ch}
@keyframes mq{to{transform:translateX(-50%)}}
.glow{position:fixed;left:0;top:0;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%);pointer-events:none;z-index:2;will-change:transform}
.shoot{position:fixed;height:2px;width:130px;background:linear-gradient(90deg,transparent,#fff);z-index:0;pointer-events:none;transform:rotate(35deg);animation:sh 1.1s ease-out forwards}
@keyframes sh{0%{opacity:1;translate:0 0}100%{opacity:0;translate:420px 300px}}
.pt{position:fixed;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;pointer-events:none;z-index:6;animation:ptk .8s ease-out forwards}
@keyframes ptk{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.toast{position:fixed;left:50%;top:22px;translate:-50% 0;background:#fff;color:#0a0a0a;font-family:"Fredoka",sans-serif;font-weight:600;font-size:.85rem;padding:8px 16px;border-radius:999px;z-index:7;pointer-events:none;animation:toast 2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-12px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-12px)}}

@media(max-width:1020px){
  .stage{flex-direction:column;gap:24px}
  .left,.mid,.right{width:min(384px,100%);transform:translate(var(--dx,0px),var(--dy,0px)) rotateX(var(--rx)) rotateY(var(--ry))}
  .left{order:3}.right{order:2}.mid{order:1}
}
@media(prefers-reduced-motion:reduce){
  .card.visible{animation:fade .4s both}
  .card.visible.float{animation:none}
  .card::after{display:none}
  .top,.frame img,.name:hover,.blob,.mt,.enter{animation:none}
  .loading-dots span,.bub,.eqi i,.dot,.trk,.fadein,#playIc.swap,.caret,.badge{animation:none!important}
  .av:hover,.ctl button:hover,.chip:hover,.soc a:hover,.badge:hover{transform:none}
  .loading-gif,#loading-screen.hidden .loading-gif{transition:none;transform:none;filter:none}
}
</style>
</head>
<body>

<div id="loading-screen">
  <img id="loadingGif" src="leon.gif" alt="" class="loading-gif" onerror="this.style.display='none'">
  <div class="loading-text">
    <span id="loadingText"></span><span class="caret"></span><span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
  <div class="loading-bar"><i id="loadingFill"></i></div>
  <button class="enter" id="enterBtn" type="button" hidden>TAP TO ENTER</button>
</div>

<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="stars"></canvas>
<main class="stage" id="stage">

  <section class="card left" aria-label="Picture"><div class="frame"><img id="hero" alt=""></div></section>

  <section class="card mid" aria-label="Discord profile" aria-live="polite">
    <div class="top"></div>
    <div class="body">
      <div class="av" id="avBox">
        <img class="a" id="av" alt="Discord avatar">
        <img class="d" id="deco" alt="" hidden>
        <span class="dot" id="dot"></span>
        <div class="bub" id="bub" hidden></div>
      </div>
      <div class="name" id="dn">Loading…</div>
      <div class="handle" id="un"></div>
      <div class="badges" id="badges" hidden></div>
      <div class="chips" id="chips"></div>

  $("play").onclick = () => { if (audio.paused) { initAnalyser(); audio.play().catch(() => {}); } else audio.pause(); };
  $("prev").onclick = () => { if (audio.currentTime > 3) audio.currentTime = 0; else loadTrack(nextIdx(-1), true); };
  $("next").onclick = () => loadTrack(nextIdx(1), true);
  $("shuf").onclick = () => { shuf = !shuf; $("shuf").classList.toggle("on", shuf); toast(shuf ? "Shuffle ON" : "Shuffle OFF"); };
  $("rep").onclick = () => {
    rep = rep === 1 ? 2 : rep === 2 ? 0 : 1;
    $("rep").classList.toggle("on", rep !== 0); $("rep").classList.toggle("one", rep === 2);
    toast(rep === 1 ? "Repeat: all" : rep === 2 ? "Repeat: one" : "Repeat: off");
  };
  audio.onplay = () => { initAnalyser(); if (actx && actx.state === "suspended") actx.resume().catch(() => {}); $("playIc").innerHTML = '<path d="' + PAUSE + '"/>'; replay($("playIc"), "swap"); setPlaying(true); };
  audio.onpause = () => { $("playIc").innerHTML = '<path d="' + PLAY + '"/>'; replay($("playIc"), "swap"); setPlaying(false); };
  audio.onended = () => {
    if (rep === 2) { audio.currentTime = 0; audio.play().catch(() => {}); }
    else if (rep === 0 && !shuf && idx === TRACKS.length - 1) loadTrack(0, false);
    else loadTrack(nextIdx(1), true);
  };
  audio.onerror = () => { $("pArtist").textContent = "Hindi ma-load ang audio file"; setPlaying(false); };
  audio.onloadedmetadata = () => { $("tEnd").textContent = fmt(audio.duration); };
  audio.ontimeupdate = () => { if (audio.duration) { $("fill").style.width = audio.currentTime / audio.duration * 100 + "%"; $("tNow").textContent = fmt(audio.currentTime); } showCap(); };
  $("tr").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration; };
  $("vol").oninput = (e) => setVol(Number(e.target.value));

  /* keyboard shortcuts: Space, ← →, ↑ ↓, M */
  addEventListener("keydown", (e) => {
    if (!entered || e.ctrlKey || e.metaKey || e.altKey) return;
    const tg = e.target && e.target.tagName, k = e.key;
    if (tg === "INPUT") return;
    if (k === " " && (tg === "BUTTON" || tg === "A")) return;
    let h = true;
    if (k === " ") $("play").click();
    else if (k === "ArrowRight") $("next").click();
    else if (k === "ArrowLeft") $("prev").click();
    else if (k === "ArrowUp") setVol(audio.volume * 100 + 5);
    else if (k === "ArrowDown") setVol(audio.volume * 100 - 5);
    else if (k === "m" || k === "M") { audio.muted = !audio.muted; toast(audio.muted ? "🔇 Muted" : "🔊 Unmuted"); }
    else h = false;
    if (h) e.preventDefault();
  });
} else $("player").classList.add("ro");

let spTimer;
function renderSpotify() {
  clearInterval(spTimer);
  if (!spotifyMode) return;
  if (!sp) { lastSpKey = ""; setMarq(TAGLINE); $("npLabel").textContent = "NOW PLAYING"; $("pTitle").textContent = "Nothing playing"; $("pArtist").textContent = "Walang pinapakinggan sa Spotify"; $("cover").removeAttribute("src"); $("fill").style.width = "0"; $("tNow").textContent = "0:00"; $("tEnd").textContent = "0:00"; setPlaying(false); return; }
  $("npLabel").textContent = "NOW PLAYING · SPOTIFY";
  $("cover").src = sp.album_art_url || ""; $("pTitle").textContent = sp.song || ""; $("pArtist").textContent = (sp.artist || "").replace(/;/g, ",");
  const key = (sp.song || "") + "|" + (sp.artist || ""); if (key !== lastSpKey) { lastSpKey = key; setMarq("♪ " + (sp.song || "") + " — " + (sp.artist || "").replace(/;/g, ",") + "  ✦  " + TAGLINE); if (!REDUCE) trackAnim(); }
  setPlaying(true);
  const t = () => { const { start, end } = sp.timestamps, n = Math.min(Date.now(), end); $("fill").style.width = Math.max(0, Math.min(100, (n - start) / (end - start) * 100)) + "%"; $("tNow").textContent = fmt((n - start) / 1000); $("tEnd").textContent = fmt((end - start) / 1000); };
  t(); spTimer = setInterval(t, 1000);
}

/* ---------- clock, activity uptime, visitor counter ---------- */
let actStart = 0;
{
  const f = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Manila", hour: "numeric", minute: "2-digit", second: "2-digit" });
  const tickClock = () => {
    $("clock").textContent = "🕒 PH time · " + f.format(new Date());
    const u = $("up"); u.hidden = !actStart;
    if (actStart) u.textContent = "⏱ " + fmtHMS((Date.now() - actStart) / 1000);
  };
  tickClock(); setInterval(tickClock, 1000);
}
(async () => {
  const v = $("vis"); let n = null;
  try {
    const first = !sessionStorage.getItem("v");
    const r = await fetch("https://api.counterapi.dev/v1/" + COUNTER_NS + "/visits" + (first ? "/up" : ""));
    const j = await r.json();
    if (j && typeof j.count === "number") { n = j.count; sessionStorage.setItem("v", "1"); }
  } catch (_) {}
  if (n != null) { v.textContent = "👁 " + n.toLocaleString() + " visits"; return; }
  try {
    n = (Number(localStorage.getItem("vc")) || 0) + (sessionStorage.getItem("vl") ? 0 : 1);
    localStorage.setItem("vc", String(n)); sessionStorage.setItem("vl", "1");
    v.textContent = "👁 " + n + " (local)";
  } catch (_) {}
})();

/* ---------- Discord via Lanyard ---------- */
const STATUS = { online: "Online", idle: "Idle", dnd: "Do Not Disturb", offline: "Offline" };
const FLAGS = [[1, "🛠️", "Discord Staff"], [2, "🤝", "Partnered Server Owner"], [4, "🎉", "HypeSquad Events"], [8, "🐛", "Bug Hunter"], [64, "🦁", "HypeSquad Bravery"], [128, "🧠", "HypeSquad Brilliance"], [256, "⚖️", "HypeSquad Balance"], [512, "⭐", "Early Supporter"], [16384, "🐞", "Bug Hunter Gold"], [131072, "🤖", "Early Verified Bot Developer"], [262144, "🛡️", "Certified Moderator"], [4194304, "💻", "Active Developer"]];
let data = null, lastChipKey = "", lastBadgeKey = -1, favSet = "";
const flash = (id, v) => { const r = $(id); if (r.dataset.v !== undefined && r.dataset.v !== v) { r.classList.remove("upd"); void r.offsetWidth; r.classList.add("upd"); } r.dataset.v = v; };
const avatarUrl = (u, size) => !u.avatar ? "https://cdn.discordapp.com/embed/avatars/" + Number((BigInt(u.id) >> 22n) % 6n) + ".png" : "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + "." + (u.avatar.startsWith("a_") ? "gif" : "png") + "?size=" + size;
const since = (u) => { try { return new Date(Number((BigInt(u.id) >> 22n) + 1420070400000n)).getFullYear(); } catch (_) { return ""; } };

function render() {
  if (!data) return;
  const u = data.discord_user || {};
  setText("dn", u.global_name || u.display_name || u.username || "Unknown");
  if (REDUCE) document.title = $("dn").textContent;
  setText("un", u.username ? "@" + u.username : "");
  const au = avatarUrl(u, 256);
  $("av").src = au;
  if (favSet !== au) { favSet = au; $("fav").href = avatarUrl(u, 64); }
  if (!IMAGE_URL) $("hero").src = avatarUrl(u, 512);

  const asset = u.avatar_decoration_data && u.avatar_decoration_data.asset, d = $("deco");
  d.hidden = !asset;
  if (asset) { const url = "https://cdn.discordapp.com/avatar-decoration-presets/" + asset + ".png?size=240&passthrough=true"; if (d.dataset.s !== url) { d.dataset.s = url; d.onerror = () => { d.onerror = null; d.src = url.replace("&passthrough=true", ""); }; d.src = url; } }

  const flags = Number(u.public_flags) || 0, bd = $("badges");
  if (flags !== lastBadgeKey) {
    lastBadgeKey = flags; bd.textContent = ""; let c = 0;
    FLAGS.forEach(([m, ic, nm]) => {
      if (flags & m) {
        const s = el("span", "badge", ic); s.title = nm; s.setAttribute("role", "img"); s.setAttribute("aria-label", nm);
        s.style.animationDelay = (c++ * 70) + "ms"; bd.appendChild(s);
      }
    });
    bd.hidden = c === 0;
  }

  const st = data.discord_status || "offline"; $("dot").className = "dot " + st;
  const devs = [["active_on_discord_desktop", "Desktop"], ["active_on_discord_web", "Web"], ["active_on_discord_mobile", "Mobile"]].filter(([k]) => data[k]);
  const chips = $("chips"), ckey = st + "|" + devs.map((x) => x[1]).join(",");
  chips.textContent = ""; chips.appendChild(el("span", "chip", STATUS[st] || st));
  devs.forEach(([, n]) => chips.appendChild(el("span", "chip", n)));
  const yr = since(u); if (yr) chips.appendChild(el("span", "chip", "Since " + yr));
  if (ckey !== lastChipKey) { lastChipKey = ckey; if (!REDUCE) replay(chips, "fadein"); }

  const acts = data.activities || [];
  const c = acts.find((a) => a.type === 4), has = c && (c.state || c.emoji);
  $("rCustom").hidden = !has;
  if (has) {
    const ic = $("cIc"); ic.textContent = "";
    if (c.emoji && c.emoji.id) { const im = el("img"); im.alt = c.emoji.name || ""; im.src = "https://cdn.discordapp.com/emojis/" + c.emoji.id + "." + (c.emoji.animated ? "gif" : "png") + "?size=64"; ic.appendChild(im); }
    else ic.textContent = (c.emoji && c.emoji.name) || "💬";
    $("cTx").textContent = c.state || ""; flash("rCustom", (c.state || "") + (c.emoji ? c.emoji.name : ""));
  }
  const b = $("bub"); b.hidden = !(c && c.state && c.state.length <= 18); if (!b.hidden) b.textContent = c.state;

  const note = data.kv && data.kv[NOTE_KEY]; $("rNote").hidden = !note; if (note) { $("nTx").textContent = note; flash("rNote", note); }

  const g = acts.find((a) => a.type !== 4 && a.name !== "Spotify");
  $("msg").className = "msg";
  setText("msg", g ? ({ 1: "Streaming ", 2: "Listening to ", 3: "Watching ", 5: "Competing in " }[g.type] || "Playing ") + g.name + (g.details ? " · " + g.details : "") : "");
  actStart = g && g.timestamps && g.timestamps.start ? g.timestamps.start : 0;

  sp = data.listening_to_spotify ? data.spotify : null; renderSpotify();
}
const fail = (t) => { $("dn").textContent = "Can't load Discord"; $("msg").className = "msg err"; $("msg").textContent = t; };
(async () => {
  try {
    const j = await (await fetch("https://api.lanyard.rest/v1/users/" + DISCORD_ID)).json();
    if (!j.success) return fail("User not found. Sumali sa discord.gg/lanyard.");
    data = j.data; render();
  } catch (_) { fail("Network error. Subukan ulit mamaya."); }
})();
(function ws() {
  let hb, s;
  try { s = new WebSocket("wss://api.lanyard.rest/socket"); } catch (_) { return; }
  s.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.op === 1) {
      s.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
      hb = setInterval(() => { if (s.readyState === 1) s.send(JSON.stringify({ op: 3 })); }, m.d.heartbeat_interval);
    } else if (m.op === 0) { data = m.d; render(); }
  };
  s.onclose = () => { clearInterval(hb); setTimeout(ws, 5000); };
  s.onerror = () => s.close();
})();
</script>
