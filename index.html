<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0c0c0d;--line:rgba(255,255,255,.08);--text:#f4f4f5;--muted:#a1a1a8;--online:#3ba55d;--idle:#faa81a;--dnd:#ed4245;--off:#747f8d;--rx:0deg;--ry:0deg}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 45%,#161616,#050505 70%);color:var(--text);font-family:"Inter",system-ui,sans-serif;overflow-x:hidden}

/* ========== LOADING SCREEN ========== */
#loading-screen{
  position: fixed;
  inset: 0;
  background: #050505;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  transition: opacity .6s ease, visibility .6s ease;
  overflow: hidden;
}

#loading-screen.hidden{
  opacity: 0;
  visibility: hidden;
}

.loading-gif{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .85;
}

.loading-text{
  position: relative;
  z-index: 1;
  font-family: "Fredoka", sans-serif;
  font-size: clamp(1rem, 3vw, 1.8rem);
  color: var(--text);
  letter-spacing: .1em;
  text-align: center;
  padding: 0 20px;
  text-shadow: 0 0 10px #000, 0 0 20px #000;
}

.loading-dots{
  display: inline-flex;
  gap: 2px;
}

.loading-dots span{
  animation: bounce 1.4s infinite ease-in-out both;
}

.loading-dots span:nth-child(2){
  animation-delay: .2s;
}

.loading-dots span:nth-child(3){
  animation-delay: .4s;
}

@keyframes bounce{
  0%, 80%, 100%{
    transform: scale(.6);
    opacity: .5;
  }
  40%{
    transform: scale(1);
    opacity: 1;
  }
}


#stars{position:fixed;inset:0;z-index:0}
.stage{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:34px;padding:40px 20px;perspective:1400px}
.card{background:linear-gradient(180deg,#121213,var(--card));border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .25s ease-out,opacity .5s ease,visibility .5s ease;transform-style:preserve-3d;opacity:0;visibility:hidden}
.card.visible{opacity:1;visibility:visible;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
.left{width:340px;padding:20px;transform:rotateY(calc(11deg + var(--ry))) rotateX(var(--rx)) rotateZ(-1.5deg)}
.mid{width:384px;overflow:hidden;animation-delay:.1s;transform:rotateX(var(--rx)) rotateY(var(--ry))}
.right{width:352px;padding:24px 26px;animation-delay:.2s;transform:rotateY(calc(-11deg + var(--ry))) rotateX(var(--rx)) rotateZ(1.5deg)}
/* left */
.frame{border-radius:18px;overflow:hidden;aspect-ratio:3/4.1;background:#000;border:1px solid var(--line)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05)}
/* middle */
.top{height:150px;background:linear-gradient(180deg,#bdbdbd,#3a3a3a 70%,#0c0c0d)}
.body{display:grid;justify-items:center;gap:10px;padding:0 24px 26px;margin-top:-84px;text-align:center}
.av{position:relative;width:172px;height:172px}
.av .a{position:absolute;inset:12%;width:76%;height:76%;border-radius:50%;object-fit:cover;background:#222}
.av .d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dot{position:absolute;right:20px;bottom:20px;width:24px;height:24px;border-radius:50%;border:4px solid var(--card);background:var(--off)}
.dot.online{background:var(--online);--r:rgba(59,165,93,.7);animation:ring 2s infinite}
.dot.idle{background:var(--idle);--r:rgba(250,168,26,.7);animation:ring 2.4s infinite}
.dot.dnd{background:var(--dnd);--r:rgba(237,66,69,.7);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--r)}70%,100%{box-shadow:0 0 0 9px transparent}}
.bub{position:absolute;right:-18px;top:2px;max-width:140px;background:#fff;color:#0a0a0a;font-family:"Fredoka",sans-serif;font-weight:700;font-size:.85rem;line-height:1.1;padding:9px 12px;border-radius:20px 20px 20px 4px;transform:rotate(8deg);box-shadow:0 6px 18px rgba(0,0,0,.5);animation:pop .5s .6s cubic-bezier(.2,1.4,.3,1) both}
.bub[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(8deg)}}
.name{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.2rem;line-height:1;margin-top:6px;letter-spacing:.01em;text-shadow:0 2px 14px rgba(255,255,255,.15)}
.handle{color:var(--muted);font-weight:500;letter-spacing:.06em;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:.76rem;padding:3px 10px;border-radius:999px;background:#1a1a1c;border:1px solid var(--line);color:var(--text)}
.row{width:100%;background:#141416;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;text-align:left}
.row[hidden]{display:none}
.row .ic{font-size:22px;flex:none}.row .ic img{width:24px;height:24px;object-fit:contain;display:block}
.row .t{font-size:.72rem;color:var(--muted)}.row .x{overflow-wrap:anywhere;white-space:pre-wrap;font-size:.95rem}
.row.upd{animation:flash .9s ease}@keyframes flash{from{background:#2c2c32}to{background:#141416}}
.soc{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.soc a{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#d4d4d8;background:radial-gradient(circle at 35% 30%,#2a2a2d,#121214);border:1px solid var(--line);box-shadow:0 6px 14px rgba(0,0,0,.5);transition:transform .2s,color .2s,box-shadow .2s}
.soc a:hover{transform:translateY(-4px);color:#fff;box-shadow:0 10px 22px rgba(255,255,255,.12)}
.soc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg{font-size:.85rem;color:var(--muted)}.err{color:#ffb3b5}
/* right */
.np{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;letter-spacing:.18em;font-weight:600;color:#d4d4d8}
.eqi{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eqi i{width:3px;background:#fff;height:4px}.playing .eqi i{animation:eq 1s ease-in-out infinite}.eqi i:nth-child(2){animation-delay:-.4s}.eqi i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.cover{width:100%;aspect-ratio:2.2/1;object-fit:cover;border-radius:12px;margin:14px 0;background:#18181a;filter:grayscale(1) contrast(1.1);display:block}
.title{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.artist{color:var(--muted);font-size:.88rem;margin-top:4px}
.prog{margin-top:16px}.tr{height:3px;background:rgba(255,255,255,.14);border-radius:3px;cursor:pointer;position:relative}
.tr i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:3px}
.tm{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px}
.ctl{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px}
.ctl button{border:1px solid var(--line);background:radial-gradient(circle at 35% 30%,#2a2a2d,#141416);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.ctl button.big{width:54px;height:54px}.ctl button:hover{transform:scale(1.08)}
.ctl svg{width:16px;height:16px;fill:currentColor}.ctl .big svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:22px;margin-top:14px}
.wave i{width:2px;height:4px;background:#8a8a90;border-radius:2px;transition:height .15s}
.vol{display:flex;align-items:center;gap:10px;margin-top:12px;color:#d4d4d8}
.vol svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,70%),rgba(255,255,255,.14) var(--p,70%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.ro .ctl,.ro .vol{display:none}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:1020px){.stage{flex-direction:column;gap:24px}.left,.mid,.right{width:min(384px,100%);transform:none!important}.left{order:3}.right{order:2}.mid{order:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ========== LOADING SCREEN ========== -->
<div id="loading-screen">
  <img src="leon.gif" alt="Loading…" class="loading-gif">
  <div class="loading-text">
    Kung ang english ng matigas na bato ay hard rock, pwede ba kitang ma-hardfuck?<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
</div>
<!-- ===================================== -->
  
<canvas id="stars"></canvas>
<main class="stage" id="stage">

  <section class="card left" aria-label="Picture"><div class="frame"><img id="hero" alt=""></div></section>

  <section class="card mid" aria-label="Discord profile" aria-live="polite">
    <div class="top"></div>
    <div class="body">
      <div class="av">
        <img class="a" id="av" alt="Discord avatar">
        <img class="d" id="deco" alt="" hidden>
        <span class="dot" id="dot"></span>
        <div class="bub" id="bub" hidden></div>
      </div>
      <div class="name" id="dn">Loading…</div>
      <div class="handle" id="un"></div>
      <div class="chips" id="chips"></div>
      <div class="row" id="rCustom" hidden><span class="ic" id="cIc"></span><div><div class="t">Status</div><div class="x" id="cTx"></div></div></div>
      <div class="row" id="rNote" hidden><span class="ic">✎</span><div><div class="t">Note</div><div class="x" id="nTx"></div></div></div>
      <div class="soc" id="soc"></div>
      <div class="msg" id="msg"></div>
    </div>
  </section>

  <section class="card right" id="player" aria-label="Now playing">
    <div class="np"><span id="npLabel">NOW PLAYING</span><span class="eqi"><i></i><i></i><i></i></span></div>
    <img class="cover" id="cover" alt="Cover">
    <div class="title" id="pTitle">Nothing playing</div>
    <div class="artist" id="pArtist"></div>
    <div class="prog"><div class="tr" id="tr"><i id="fill"></i></div><div class="tm"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div></div>
    <div class="ctl">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="play" class="big" aria-label="Play"><svg id="playIc" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="wave" id="wave"></div>
    <div class="vol"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume"></div>
  </section>
</main>

<script>
/* ================= EDIT DITO ================= */
const DISCORD_ID = "1250654354344775703";
const NOTE_KEY   = "OTEN OTEN";
const IMAGE_URL  = "leon2.jpg";
const SOCIALS = [
  { icon: "discord",   url: "https://discord.com/users/1250654354344775703", label: "Discord" },
  { icon: "tiktok",    url: "https://www.tiktok.com/@leonexclsv_",           label: "TikTok" },
  { icon: "instagram", url: "https://www.instagram.com/dfw_leoky",         label: "Instagram" }
];
const TRACKS = [
  { title: "White Lady", artist: "Uncle Dags feat. Buensa & Niño Armani", src: "White Lady - Uncle Dags (feat. Buensa & Niño Armani).mp3", cover: "blinsk.jpg" },
  { title: "Luhod", artist: "Dreycruz", src: "luhod.mp3", cover: "leon3.jpg" },
  { title: "5 Mil", artist: "HELLMERRY · Gaspari · Jazz Chillin · Scoop Dogg · Buddahbeads", src: "5-mil_2RPY2b9n.mp3", cover: "mask.gif" }
];

/* ========== LOADING SCREEN SETTINGS ========== */
const LOADING_GIF  = "leon.gif";   // Palitan ang GIF filename
const LOADING_TEXT = "Kung ang english ng matigas na bato ay hard rock, pwede ba kitang ma-hardfuck?";  // Palitan ang text na gusto mo
const LOADING_DELAY = 1000;            // Ilang milisec bago maglaho (1500 = 1.5 seconds)
/* ============================================= */

const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- Loading Screen Hide ---------- */
function finishLoading() {
  $("loading-screen").classList.add("hidden");
  document.querySelectorAll(".card").forEach(card => card.classList.add("visible"));
}
window.addEventListener("load", () => {
  setTimeout(finishLoading, LOADING_DELAY);
  
});

/* ---------- stars ---------- */
(function stars() {
  const c = $("stars"), x = c.getContext("2d"); let w, h, S = [];
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; S = Array.from({ length: Math.round(w * h / 9000) }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.4 + .3, a: Math.random(), v: Math.random() * .08 + .02, t: Math.random() * 6 })); };
  size(); addEventListener("resize", size);
  (function loop() { x.clearRect(0, 0, w, h); for (const s of S) { s.y -= s.v; s.t += .02; if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; } x.globalAlpha = .25 + .55 * Math.abs(Math.sin(s.t + s.a * 6)); x.fillStyle = "#fff"; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); } requestAnimationFrame(loop); })();
})();

/* ---------- mouse tilt ---------- */
if (matchMedia("(pointer:fine)").matches) addEventListener("pointermove", (e) => {
  const s = $("stage").style;
  s.setProperty("--ry", ((e.clientX / innerWidth - .5) * 8) + "deg");
  s.setProperty("--rx", ((.5 - e.clientY / innerHeight) * 6) + "deg");
});

/* ---------- socials ---------- */
const ICONS = {
  discord: '<path d="M5 6c2-1.2 4-1.8 7-1.8S17 4.8 19 6c1.5 3 2.300 6 2 10-1.500 1.200-3 1.800-4.500 2.200l-1-1.700M5 6C3.500 9 2.700 12 3 16c1.500 1.200 3 1.800 4.500 2.200l1-1.700M7.500 17.500c3 1 6 1 9 0"/><circle cx="9" cy="11.500" r="1.200" fill="currentColor"/><circle cx="15" cy="11.500" r="1.200" fill="currentColor"/>',
  github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S1
8.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
  youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor"/>',
  tiktok: '<path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.4 2.6 2.2 4.2 5 4.5"/>',
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/>',
  roblox: '<rect x="5" y="5" width="14" height="14" rx="2" transform="rotate(15 12 12)"/><rect x="10" y="10" width="4" height="4" transform="rotate(15 12 12)"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/>'
};
SOCIALS.forEach((s) => {
  const a = el("a"); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.title = s.label; a.setAttribute("aria-label", s.label);
  a.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[s.icon] || ICONS.link}</svg>`; $("soc").appendChild(a);
});

/* ---------- waveform ---------- */
const bars = []; for (let i = 0; i < 38; i++) { const b = el("i"); $("wave").appendChild(b); bars.push(b); }
let waveOn = false;
setInterval(() => bars.forEach((b) => { b.style.height = (waveOn ? 3 + Math.random() * 18 : 3 + (Math.sin(performance.now() / 900 + b.offsetLeft) + 1) * 1.5) + "px"; }), 160);
const setPlaying = (on) => { waveOn = on; $("player").classList.toggle("playing", on); };

/* ---------- player ---------- */
const audio = new Audio(); audio.volume = .7; audio.preload = "metadata";
let idx = 0, spotifyMode = !TRACKS.length, sp = null;
const PLAY = "M7 4l13 8-13 8z", PAUSE = "M6 4h4v16H6zM14 4h4v16h-4z";

function loadTrack(i, autoplay) {
  idx = (i + TRACKS.length) % TRACKS.length; const t = TRACKS[idx];
  audio.src = t.src; $("pTitle").textContent = t.title; $("pArtist").textContent = t.artist || "";
  $("cover").src = t.cover || $("av").src; $("tNow").textContent = "0:00"; $("fill").style.width = "0";
  if (autoplay) audio.play().catch(() => {});
}
if (!spotifyMode) {
  loadTrack(0, false);
  $("play").onclick = () => (audio.paused ? audio.play() : audio.pause());
  $("prev").onclick = () => loadTrack(idx - 1, true);
  $("next").onclick = () => loadTrack(idx + 1, true);
  audio.onplay = () => { $("playIc").innerHTML = `<path d="${PAUSE}"/>`; setPlaying(true); };
  audio.onpause = () => { $("playIc").innerHTML = `<path d="${PLAY}"/>`; setPlaying(false); };
  audio.onended = () => loadTrack(idx + 1, true);
  audio.onloadedmetadata = () => ($("tEnd").textContent = fmt(audio.duration));
  audio.ontimeupdate = () => { if (audio.duration) { $("fill").style.width = audio.currentTime / audio.duration * 100 + "%"; $("tNow").textContent = fmt(audio.currentTime); } };
  $("tr").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration; };
  $("vol").oninput = (e) => { audio.volume = e.target.value / 100; e.target.style.setProperty("--p", e.target.value + "%"); };
} else $("player").classList.add("ro");

let spTimer;
function renderSpotify() {
  clearInterval(spTimer);
  if (!spotifyMode) return;
  if (!sp) { $("pTitle").textContent = "Nothing playing"; $("pArtist").textContent = "Walang pinapakinggan sa Spotify"; $("cover").removeAttribute("src"); $("fill").style.width = "0"; $("tNow").textContent = "0:00"; $("tEnd").textContent = "0:00"; setPlaying(false); return; }
  $("npLabel").textContent = "NOW PLAYING · SPOTIFY";
  $("cover").src = sp.album_art_url || ""; $("pTitle").textContent = sp.song || ""; $("pArtist").textContent = (sp.artist || "").replace(/;/g, ",");
  setPlaying(true);
  const t = () => { const { start, end } = sp.timestamps, n = Math.min(Date.now(), end); $("fill").style.width = Math.max(0, Math.min(100, (n - start) / (end - start) * 100)) + "%"; $("tNow").textContent = fmt((n - start) / 1000); $("tEnd").textContent = fmt((end - start) / 1000); };
  t(); spTimer = setInterval(t, 1000);
}

/* ---------- Discord via Lanyard ---------- */
const STATUS = { online: "Online", idle: "Idle", dnd: "Do Not Disturb", offline: "Offline" };
let data = null;
const flash = (id, v) => { const r = $(id); if (r.dataset.v !== undefined && r.dataset.v !== v) { r.classList.remove("upd"); void r.offsetWidth; r.classList.add("upd"); } r.dataset.v = v; };
const avatarUrl = (u, size) => !u.avatar ? `https://cdn.discordapp.com/embed/avatars/${Number((BigInt(u.id) >> 22n) % 6n)}.png` : `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_") ? "gif" : "png"}?size=${size}`;

function render() {
  if (!data) return;
  const u = data.discord_user || {};
  $("dn").textContent = u.global_name || u.display_name || u.username || "Unknown";
  document.title = $("dn").textContent;
  $("un").textContent = u.username ? "@" + u.username : "";
  $("av").src = avatarUrl(u, 256);
  $("hero").src = IMAGE_URL || avatarUrl(u, 512);

  const asset = u.avatar_decoration_data && u.avatar_decoration_data.asset, d = $("deco");
  d.hidden = !asset;

  sp = data.listening_to_spotify ? data.spotify : null; renderSpotify();
}
