<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AZURA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("banner.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.navigation-bar {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.5;
    z-index: 100;
}

.views-box {
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 3px;
}

.center-container {
    width: 100%;
    max-width: 800px; /* Ibinalik sa orihinal para nakasentro ang lahat pati marquee mo */
    margin: 50px auto 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

.main-clan-logo {
    max-width: 180px;
    width: 100%;
    height: auto;
    margin-bottom: 5px;
    pointer-events: none;
}

.symbol-break {
    font-size: 28px;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 20px;
    font-weight: 700;
}

.title-group-block {
    margin-top: 45px;
    margin-bottom: 15px;
    text-align: center;
}

.tiny-top-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.3);
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
}

.bold-main-header {
    font-family: 'Inter', sans-serif;
    font-size: 30px; font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.8);
}

/* ==================================================
   🔥 ROW NG AVATAR (SWAK NA OVERLAP STYLE)
   ================================================== */
.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important;
    justify-content: center;
    align-items: center;
    width: auto;
    padding: 20px 0;
    /* Ginamit natin ang margin-left sa node para sa overlap kaya ginawa nating 0 ang gap */
    gap: 0px !important; 
}

/* ==================================================
   🔥 NODE CONTROL - SAKTO ANG DIKIT GAYA NG PUBLIC ENEMY
   ================================================== */
.avatar-wrapper-node {
    position: relative;
    /* -5px hanggang -8px ang sikreto para dikit pero litaw pa rin ang decorations */
    margin-left: -6px !important; 
    transition: transform 0.2s ease, z-index 0.2s ease;
    z-index: 10;
}

/* Tanggalin ang dikit sa pinakaunang avatar sa linya */
.avatar-wrapper-node:first-child {
    margin-left: 0 !important;
}

.avatar-wrapper-node.clickable {
    cursor: pointer;
}
.avatar-wrapper-node:hover {
    transform: scale(1.15);
    z-index: 9999 !important;
}

/* CONTAINER SETUP */
.circle-avatar-container {
    position: relative;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000000;
    padding: 2px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
    overflow: visible !important;
    z-index: 1;
}

/* PROFILE PIC LAYER */
.circle-avatar-container img.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
    position: relative;
    z-index: 1 !important;
}

/* DECORATION OVERLAY LAYER */
img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 108px !important; 
    height: 108px !important;
    pointer-events: none;
    z-index: 999999 !important; 
    border-radius: 0 !important; 
}

/* ==================================================
   Target Tooltips
   ================================================== */
.avatar-tooltip {
    position: absolute;
    bottom: -85px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 12px 15px;
    width: 180px;
    white-space: normal;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 99999;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
}

.avatar-wrapper-node:hover .avatar-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.tooltip-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.tooltip-avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #222;
}
.tooltip-emojis {
    font-size: 14px;
}
.tooltip-username {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
}
.tooltip-desc {
    font-size: 12px;
    color: #fff;
    margin-top: 5px;
    font-weight: 500;
}

/* ==================================================
   MARQUEE TICKER (INAYOS ANG CENTERING)
   ================================================== */
.marquee-ticker {
    overflow: hidden;
    width: 100%;
    max-width: 750px;
    padding: 5px 0;
    background: transparent;
}

.marquee-wrapper-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    align-items: center; /* Sinisigurong nakasentro ang scrolling bars */
    margin-top: 40px;
    margin-bottom: 50px;
}

.marquee-inner-wrap {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 12px;
    width: max-content;
}

.scroll-left { animation: smoothScrollLeft 30s linear infinite; }
.scroll-right { animation: smoothScrollRight 30s linear infinite; }

.marquee-profile-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    background: #0c0c0c; 
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 30px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
}

.marquee-profile-block img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
}

@keyframes smoothScrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
}
@keyframes smoothScrollRight {
    0% { transform: translateX(-33.333%); }
    100% { transform: translateX(0); }
}

#azura-discord-btn {
    position: fixed !important;
    bottom: 30px !important;
    right: 30px !important;
    z-index: 9999999 !important;
    display: block !important;
}

#azura-discord-btn a {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 10px 18px !important;
    background-color: #000 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #fff !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 2px !important;
}

#gateway-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
}

.gateway-btn {
    padding: 12px 30px;
    font-size: 10px;
    letter-spacing: 5px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

.fade-gateway {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s;
}
</style>
</head>
<body oncontextmenu="return false;">

<div class="navigation-bar">
    HOME
    <div class="views-box">VIEWS : <span id="views">0</span></div>
</div>

<div class="center-container">
    <img src="azura-logo.webp" alt="AZURA" class="main-clan-logo">
    
    <div class="symbol-break">$</div>
    <div id="founder-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">ABOVE ALL</span>
        <h2 class="bold-main-header">ABOVE ALL</h2>
    </div>
    <div id="aboveall-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">STAFF</span>
        <h2 class="bold-main-header">STAFF</h2>
    </div>
    <div id="staff-container" class="horizontal-avatar-row"></div>

    <div class="marquee-wrapper-group">
        <div class="marquee-ticker">
            <div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div>
        </div>
        <div class="marquee-ticker">
            <div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div>
        </div>
    </div>
</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/eUaKEqXkWA" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" style="width:18px;">
        <span>AZURA ORG</span>
    </a>
</div>

<div id="gateway-overlay">
    <div class="gateway-btn">CLICK</div>
</div>

<audio id="soundtrack" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("soundtrack");
audio.volume = 0.4;

document.getElementById("gateway-overlay").onclick = () => {
    audio.play().catch(() => {});
    document.getElementById("gateway-overlay").classList.add("fade-gateway");
};

fetch('members.json')
    .then(res => res.json())
    .then(members => {
        const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"]; 
        const aboveAllIDs = ["1081806153341743144", "1416019497051095091", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426"]; 
        const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
        
        const scrollingIDsRow1 = ["1499093156321431622", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
        const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];

        showGroup(members, founderIDs, 'founder-container');
        showGroup(members, aboveAllIDs, 'aboveall-container');
        showGroup(members, staffIDs, 'staff-container');
        
        showMarquee(members, scrollingIDsRow1, "marquee-container-1");
        showMarquee(members, scrollingIDsRow2, "marquee-container-2");
    });

function showGroup(allMembers, listIDs, container) {
    const box = document.getElementById(container);
    
    listIDs.forEach((id, i) => {
        const mem = allMembers.find(m => m.id === id);
        if (!mem) return;

        const div = document.createElement('div');
        div.className = 'avatar-wrapper-node';

        let decorationHTML = '';
        if (mem.effectURL && mem.effectURL !== 'null' && mem.effectURL.trim() !== '' && mem.effectURL.startsWith('http')) { 
            decorationHTML = `<img src="${mem.effectURL}" class="avatar-decoration" onerror="this.style.display='none'">`;
        }

        div.innerHTML = `
            <div class="circle-avatar-container">
                <img src="${mem.avatarURL}" class="avatar-img" alt="">
                ${decorationHTML} 
            </div>
            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <img src="${mem.avatarURL}" class="tooltip-avatar-sm" alt="">
                    <span class="tooltip-emojis">👑</span>
                </div>
                <div class="tooltip-username">@${mem.username || 'username'}</div>
                <div class="tooltip-desc">${mem.displayName || 'Member'}</div>
            </div>
        `;
        box.appendChild(div);
    });
}

function showMarquee(allMembers, listIDs, containerId) {
    const box = document.getElementById(containerId);
    const selectedMembers = allMembers.filter(mem => listIDs.includes(mem.id));
    if (selectedMembers.length === 0) return;

    const ulit = [...selectedMembers, ...selectedMembers, ...selectedMembers];
    ulit.forEach(mem => {
        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName || mem.username}</span>`;
        box.appendChild(block);
    });
}
</script>
</body>
</html>
