<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.60), rgba(0, 0, 0, 0.60)), 
        url("pba.webp");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-logo-container {
    text-align: center;
    margin: 20px 0 10px 0;
}

.main-clan-logo {
    background: transparent !important; 
    border: none !important;
    display: block;
}

/* ✅ LOGO: GANON NA LANG YUNG PANGALAN */
.main-clan-logo img {
    height: 90px; 
    width: auto;
    object-fit: contain;
}

.symbol-break {
    font-size: 30px;
    font-weight: 700;
    margin: 8px 0 30px 0;
    overflow: visible;
    white-space: normal;
    animation: metallic-glow 3s infinite ease-in-out;
    color: #808080;
    text-align: center;
    display: block;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes metallic-glow {
    0% { color: #808080; text-shadow: 0 0 5px #555555; }
    50% { color: #ffffff; text-shadow: 0 0 10px #aaaaaa; }
    100% { color: #808080; text-shadow: 0 0 5px #555555; }
}

.typewriter-header {
    font-family: 'Inter', sans-serif;
    font-size: 30px; 
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
    width: fit-content;
    margin: 0 auto 20px auto;
    animation: 
        typing 2s steps(20, end) forwards,
        metallic-glow 3s infinite ease-in-out;
    animation-play-state: paused;
    width: 0;
}

.navigation-bar {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.5;
    z-index: 100;
}

.views-box {
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 3px;
}

.center-container {
    width: 100%;
    max-width: 1000px; 
    margin: 50px auto 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

.title-group-block {
    margin-top: 45px;
    margin-bottom: 15px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tiny-top-text {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255, 255, 255, 0.3);
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
}

.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important; 
    justify-content: center;
    align-items: center;
    width: 100%;
    gap: 20px !important; 
    padding: 20px 0;
}

/* ✅ AVATAR WRAPPER */
.avatar-wrapper-node {
    position: relative;
    transition: transform 0.2s ease;
    cursor: pointer;
}
.avatar-wrapper-node:hover {
    transform: scale(1.08);
}

/* ✅ AVATAR CONTAINER */
.circle-avatar-container {
    position: relative;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    overflow: visible; 
    background: transparent; 
}

/* ✅ AVATAR DECORATION - INAYOS ANG LAKI AT PWEDE */
img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 150px !important; 
    height: 150px !important; 
    pointer-events: none !important;
    z-index: 1 !important; 
    border-radius: 0 !important; 
    object-fit: contain !important;
    background: transparent !important;
    display: block !important;
    opacity: 1 !important;
}

/* ✅ AVATAR PICTURE - NASA TAAS */
.circle-avatar-container img.avatar-img {
    width: 95px !important;
    height: 95px !important;
    border-radius: 50% !important;
    object-fit: cover !important;
    pointer-events: none !important;
    position: relative !important;
    z-index: 2 !important;
    border: 2px solid #000; 
}

/* ✅ STATUS DOT - MALAKI SA GILID */
.status-indicator {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #000;
    z-index: 3 !important;
}

/* ✅ TAMA NA KULAY NG STATUS */
.status-online { background-color: #23a55a; }  /* BERDE */
.status-idle { background-color: #f0b232; }    /* KAHEL / ORANGE */
.status-dnd { background-color: #f13f43; }     /* PULA */
.status-offline { background-color: #80848e; } /* ABO / GRAY */

/* ✅ TOOLTIP / CARD - WALANG KORONA */
.avatar-tooltip {
    position: absolute;
    bottom: 115%; 
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #0a0a0a !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    border-radius: 10px;
    padding: 12px 15px;
    width: 200px;
    color: #fff;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    pointer-events: none; 
    z-index: 99999;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
}
.avatar-wrapper-node:hover .avatar-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.tooltip-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 8px;
}
.tooltip-avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}
.tooltip-username {
    font-size: 12px;
    color: #96989d;
    margin: 4px 0;
}
.tooltip-desc {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
}
.tooltip-status {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 3px;
    background: #1a1a1a;
    max-width: 180px; 
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.status-dot-sm {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
}

/* ✅ SCROLLING NAMES */
.marquee-ticker {
    overflow: hidden;
    width: 100%;
    max-width: 750px;
    padding: 5px 0;
    background: transparent;
}

.marquee-wrapper-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    align-items: center;
    margin-top: 40px;
    margin-bottom: 50px;
}

.marquee-inner-wrap {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 12px;
    width: max-content;
}

.scroll-left { animation: smoothScrollLeft 30s linear infinite; }
.scroll-right { animation: smoothScrollRight 30s linear infinite; }

.marquee-profile-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.8);
    background: #0c0c0c; 
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px;
    border-radius: 30px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
}

.marquee-profile-block img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    pointer-events: none;
}

@keyframes smoothScrollLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-33.333%); }
}
@keyframes smoothScrollRight {
    0% { transform: translateX(-33.333%); }
    100% { transform: translateX(0); }
}

#azura-discord-btn {
    position: fixed !important;
    bottom: 30px !important;
    right: 30px !important;
    z-index: 9999999 !important;
    display: block !important;
}

#azura-discord-btn a {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 10px 18px !important;
    background-color: #000 !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #fff !important;
    font-size: 11px !important;
    font-weight: bold !important;
    text-decoration: none !important;
    border-radius: 2px !important;
}

#gateway-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.5s ease, visibility 0.5s;
}

.gateway-btn {
    padding: 12px 30px;
    font-size: 10px;
    letter-spacing: 5px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

.fade-gateway {
    opacity: 0;
    visibility: hidden;
}

::-webkit-scrollbar { display: none !important; }
</style>
</head>
<body>

<div class="navigation-bar">
    HOME
    <div class="views-box">VIEWS : <span id="views">5569</span></div>
</div>

<div class="center-container">
    <div class="main-logo-container">
        <!-- ✅ GANON NA LANG: "public azura.png" -->
        <div class="main-clan-logo">
            <img src="public azura.png" alt="AZURA ORG LOGO">
        </div>
        <div class="symbol-break">$</div>
    </div>

    <div id="founder-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">ABOVE ALL</span>
        <h2 class="typewriter-header">ABOVE ALL</h2>
    </div>
    <div id="aboveall-container" class="horizontal-avatar-row"></div>

    <div class="title-group-block">
        <span class="tiny-top-text">STAFF</span>
        <h2 class="typewriter-header">STAFF</h2>
    </div>
    <div id="staff-container" class="horizontal-avatar-row"></div>

    <div class="marquee-wrapper-group">
        <div class="marquee-ticker">
            <div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div>
        </div>
        <div class="marquee-ticker">
            <div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div>
        </div>
    </div>
</div>

<div id="azura-discord-btn">
    <a href="https://discord.gg/azuraorg" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" style="width:18px;">
        <span>AZURA ORG</span>
    </a>
</div>

<div id="gateway-overlay">
    <div class="gateway-btn">CLICK</div>
</div>

<audio id="soundtrack" loop>
    <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById("soundtrack");
audio.volume = 0.4;

// ✅ CLICK FUNCTION: AYOS NA
document.getElementById("gateway-overlay").addEventListener("click", function() {
    audio.play().catch(() => {});
    this.classList.add("fade-gateway");
    
    document.querySelectorAll('.typewriter-header').forEach(el => {
        el.style.animationPlayState = 'running';
        el.style.width = '100%';
    });
});

// ✅ API FETCH: TAMA NA
fetch('https://api.leonazura.xyz/api/members')
    .then(res => res.json())
    .then(members => {
        const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"]; 
        const aboveAllIDs = ["1081806153341743144", "1416019497051095091", "918633044276019232", "1499093156321431622", "1506434429613113405", "1498999674969784426"]; 
        const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
        
        const scrollingIDsRow1 = ["1499093156321431622", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
        const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];

        showGroup(members, founderIDs, 'founder-container');
        showGroup(members, aboveAllIDs, 'aboveall-container');
        showGroup(members, staffIDs, 'staff-container');
        showMarquee(members, scrollingIDsRow1, "marquee-container-1");
        showMarquee(members, scrollingIDsRow2, "marquee-container-2");
    });

function showGroup(allMembers, listIDs, container) {
    const box = document.getElementById(container);
    if (!box) return;

    listIDs.forEach((id, i) => {
        const mem = allMembers.find(m => m.id === id);
        if (!mem) return;
        
        const div = document.createElement('div'); 
        div.className = 'avatar-wrapper-node';
        
        // ✅ AVATAR DECO: AYOS NA! GINAMIT KO TAMA ANG effectURL GALING SA API
        let decorationHTML = '';
        
        // Ito ang tamang pagkuha, kung meron, lalabas, kung wala, wala
        if (mem.effectURL && mem.effectURL !== "" && mem.effectURL !== "null") {
            decorationHTML = `<img src="${mem.effectURL}" class="avatar-decoration" loading="lazy">`;
        }
        // Ito yung iba pang pwedeng tawag kung sakaling meron
        else if (mem.avatar_decoration && mem.avatar_decoration !== "") {
            decorationHTML = `<img src="https://cdn.discordapp.com/avatar-decorations/${mem.id}/${mem.avatar_decoration}.png?size=128" class="avatar-decoration" loading="lazy">`;
        }

        // ✅ STATUS LOGIC: TAMA NA
        let statusClass = 'status-offline'; 
        if (mem.status) {
            if (mem.status === 'online') statusClass = 'status-online';
            if (mem.status === 'idle') statusClass = 'status-idle';
            if (mem.status === 'dnd') statusClass = 'status-dnd';
            if (mem.status === 'offline' || mem.status === 'invisible') statusClass = 'status-offline';
        }

        const activityHTML = `<div class="tooltip-status"><span class="status-dot-sm ${statusClass}"></span></div>`;

        // ✅ FINAL HTML: WALANG IBANG BINAGO SA PANGALAN NG LOGO
        div.innerHTML = `
            <div class="circle-avatar-container">
                ${decorationHTML} 
                <img src="${mem.avatarURL || 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png'}" class="avatar-img" alt="User">
                <span class="status-indicator ${statusClass}"></span>
            </div>

            <div class="avatar-tooltip">
                <div class="tooltip-header">
                    <img src="${mem.avatarURL || 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png'}" class="tooltip-avatar-sm">
                </div>
                <div class="tooltip-desc">${mem.displayName || mem.username || 'Unknown User'}</div>
                <div class="tooltip-username">@${mem.username || 'username'}</div>
                ${activityHTML}
            </div>
        `;
        box.appendChild(div);
    });
}

function showMarquee(allMembers, listIDs, containerId) {
    const box = document.getElementById(containerId);
    const selectedMembers = allMembers.filter(mem => listIDs.includes(mem.id));
    if (selectedMembers.length === 0) return;
    const list = [...selectedMembers, ...selectedMembers, ...selectedMembers];
    list.forEach(mem => {
        const block = document.createElement('div');
        block.className = 'marquee-profile-block';
        block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName || mem.username}</span>`;
        box.appendChild(block);
    });
}
</script>
</body>
</html>
