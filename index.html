<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AZURA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url("banner.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Animations */
@keyframes typing { from { width: 0; } to { width: 100%; } }
@keyframes metallic-glow {
    0% { color: #808080; text-shadow: 0 0 5px #555555; }
    50% { color: #ffffff; text-shadow: 0 0 10px #aaaaaa; }
    100% { color: #808080; text-shadow: 0 0 5px #555555; }
}

.typewriter-header {
    font-size: 30px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    white-space: nowrap; margin: 0 auto;
    animation: typing 2s steps(20, end) forwards, metallic-glow 3s infinite ease-in-out;
    animation-play-state: paused; width: 0; overflow: hidden;
}

.center-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; z-index: 10; }

/* INAYOS NA ROW - HINDI NA NAG-WRAP */
.horizontal-avatar-row {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important; 
    justify-content: center !important;
    align-items: center;
    padding: 20px 0;
    gap: 15px !important; 
    width: 100%;
}

.avatar-wrapper-node {
    position: relative;
    cursor: pointer;
    transition: transform 0.2s ease;
    flex-shrink: 0;
}

.avatar-wrapper-node:hover { transform: scale(1.15); z-index: 999; }

.circle-avatar-container {
    width: 80px; height: 80px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000; padding: 2px;
    display: flex; justify-content: center; align-items: center;
}

.circle-avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

/* Marquee Styles */
.marquee-wrapper-group { display: flex; flex-direction: column; gap: 15px; margin-top: 40px; width: 100%; align-items: center; }
.marquee-ticker { overflow: hidden; width: 100%; max-width: 750px; }
.marquee-inner-wrap { display: flex; flex-direction: row; gap: 12px; width: max-content; }
.scroll-left { animation: smoothScrollLeft 30s linear infinite; }
.scroll-right { animation: smoothScrollRight 30s linear infinite; }

@keyframes smoothScrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
@keyframes smoothScrollRight { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }

.marquee-profile-block {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    background: #0c0c0c; border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 16px; border-radius: 30px; white-space: nowrap;
}

#gateway-overlay {
    position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 999999; cursor: pointer; transition: 0.5s;
}
.fade-gateway { opacity: 0; visibility: hidden; }
</style>
</head>
<body>

<div class="center-container">
    <img src="azura-logo.webp" style="max-width:180px; margin-top:50px;">
    <div id="founder-container" class="horizontal-avatar-row"></div>
    <div class="typewriter-header">STAFF</div>
    <div id="staff-container" class="horizontal-avatar-row"></div>

    <div class="marquee-wrapper-group">
        <div class="marquee-ticker"><div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div></div>
        <div class="marquee-ticker"><div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div></div>
    </div>
</div>

<div id="gateway-overlay"><div style="border:1px solid #fff; padding:10px 20px;">CLICK</div></div>

<script>
const audio = new Audio('5-mil_2RPY2b9n.mp3');
document.getElementById("gateway-overlay").onclick = () => {
    audio.play();
    document.getElementById("gateway-overlay").classList.add("fade-gateway");
    document.querySelectorAll('.typewriter-header').forEach(el => { el.style.animationPlayState = 'running'; el.style.width = '100%'; });
};

fetch('members.json').then(res => res.json()).then(members => {
    const founderIDs = ["1250654354344775703", "1506975053370359848", "1123145717461033041"];
    const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789"];
    
    showGroup(members, founderIDs, 'founder-container');
    showGroup(members, staffIDs, 'staff-container');
    showMarquee(members, staffIDs, 'marquee-container-1');
});

function showGroup(all, ids, cont) {
    const box = document.getElementById(cont);
    ids.forEach(id => {
        const m = all.find(x => x.id === id);
        if(!m) return;
        box.innerHTML += `<div class="avatar-wrapper-node"><div class="circle-avatar-container"><img src="${m.avatarURL}"></div></div>`;
    });
}

function showMarquee(all, ids, cont) {
    const box = document.getElementById(cont);
    const list = [...all, ...all];
    list.forEach(m => {
        box.innerHTML += `<div class="marquee-profile-block"><img src="${m.avatarURL}" style="width:25px;height:25px;border-radius:50%"> ${m.displayName}</div>`;
    });
}
</script>
</body>
</html>
