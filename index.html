<!DOCTYPE html>
<html lang="en">
<head>

    <!-- 🛡️ SECURITY: DISABLE INSPECT ELEMENT & RIGHT CLICK -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.lanyard.rest https://cdn.discordapp.com https://fonts.googleapis.com https://cdn.cursors-4u.net; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:;">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kanit:wght@800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.90), rgba(0, 0, 0, 0.90)), 
                url("pba.webp");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        body.loaded { opacity: 1; }

        .center-container, .navigation-bar, #azura-discord-btn {
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        body.loaded .center-container,
        body.loaded .navigation-bar,
        body.loaded #azura-discord-btn {
            opacity: 1;
            visibility: visible;
        }

        .main-logo-container {
            text-align: center;
            margin: 0 0 10px 0;
        }

        .main-clan-logo {
            background: transparent !important; 
            border: none !important;
            display: block;
        }

        .main-clan-logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        /* ✅ $ SYMBOL FONT — SAME AS PUBLIC ENEMY */
        .symbol-break {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin: 5px 0 15px 0;
            color: #888;
            text-align: center;
            display: block;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes metallic-glow {
            0% { color: #808080; text-shadow: 0 0 5px #555; }
            50% { color: #fff; text-shadow: 0 0 10px #aaa; }
            100% { color: #808080; text-shadow: 0 0 5px #555; }
        }

        /* ✅ ABOVE ALL FONT — SAME AS PUBLIC ENEMY */
        .typewriter-header {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            overflow: visible;
            white-space: nowrap;
            width: fit-content;
            margin: 0 auto 8px auto;
            color: #888; /* ✅ GRAY COLOR */
            position: relative;
            /* ✅ REMOVED SMALL LINES, ONLY BIG GRAY LINES */
        }

        /* ✅ BIG GRAY WRAPPER LINES — EXACT LIKE PUBLIC ENEMY */
        .title-group-block {
            position: relative;
            margin: 10px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title-group-block::before,
        .title-group-block::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 200%;
            height: 1px;
            background: #444; /* ✅ GRAY LINE */
        }
        .title-group-block::before { top: -8px; }
        .title-group-block::after { bottom: -8px; }

        .tiny-top-text {
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 4px;
            color: #444; /* ✅ GRAY COLOR */
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        /* ✅ STAFF FONT — SAME AS PUBLIC ENEMY */
        .staff-header {
            font-family: 'Oswald', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #888; /* ✅ GRAY COLOR */
            position: relative;
        }

        /* ✅ HOME & VIEWS — GRAY TEXT */
        .navigation-bar {
            position: absolute;
            top: 25px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #888; /* ✅ GRAY COLOR */
            opacity: 0.8;
            z-index: 100;
        }

        .views-box {
            padding: 3px 12px;
            border: 1px solid #444; /* ✅ GRAY BORDER */
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1px;
            background: transparent;
            color: #888;
        }
        #views {
            font-weight: 500;
            color: #888;
        }

        .center-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            padding: 0 15px;
            gap: 15px;
            overflow: visible;
        }

        .horizontal-avatar-row {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: wrap !important; 
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 35px !important;
            padding: 8px 0;
            min-height: 80px;
            position: relative;
        }

        /* ✅ JOIN LINK — CORRECT POSITION (NOT FAR) */
        .join-link {
            position: absolute;
            left: -50px; /* ✅ FIXED DISTANCE */
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #888;
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.2s;
        }
        .join-link:hover {
            color: #fff;
        }

        .avatar-wrapper-node {
            position: relative;
            transition: transform 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-wrapper-node:hover {
            transform: scale(1.08);
        }

        .circle-avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: visible; 
            background: transparent; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img.avatar-decoration {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 100px !important;
            height: 100px !important; 
            pointer-events: none !important;
            z-index: 1 !important;  
            border-radius: 0 !important; 
            object-fit: contain !important;
            background: transparent !important;
            display: block !important;
            opacity: 1 !important;
        }

        .circle-avatar-container img.avatar-img {
            width: 80px !important;
            height: 80px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            pointer-events: none !important;
            position: relative !important;
            z-index: 2 !important; 
            border: 2px solid #000 !important; 
            background: #000 !important; 
        }

        .status-indicator {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #000;
            z-index: 3 !important;
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f13f43; }
        .status-offline { background-color: #80848e; }

        /* ✅ POPUP BOX — EXACT SAME AS PUBLIC ENEMY */
        .avatar-tooltip {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a0b; /* ✅ DARKER LIKE PUBLIC ENEMY */
            border: 1px solid #222;
            border-radius: 4px; /* ✅ SHARP CORNERS */
            width: 200px; /* ✅ CORRECT WIDTH */
            padding: 8px 10px;
            color: #fff;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: none; /* ✅ NO SHADOW */
        }
        .avatar-wrapper-node:hover .avatar-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .tooltip-avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .tooltip-user-info h4 {
            font-size: 12px;
            font-weight: 500;
            margin: 0;
            color: #fff;
        }
        .tooltip-user-info p {
            font-size: 10px;
            color: #666;
            margin: 0;
        }

        /* ✅ STATUS WRAPPER — SAME STYLE */
        .tooltip-activity-wrapper {
            background: #111;
            border-radius: 2px;
            padding: 4px 6px;
            margin-top: 4px;
            font-size: 10px;
            color: #888;
        }
        .activity-playing { color: #43b581; }
        .activity-streaming { color: #9146ff; }
        .activity-listening { color: #1db954; }
        .activity-watching { color: #faa61a; }

        .marquee-ticker {
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            padding: 2px 0;
            background: transparent;
        }

        .marquee-wrapper-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            align-items: center;
            margin: 8px 0 0 0;
        }

        .marquee-inner-wrap {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 12px;
            width: max-content;
        }

        .scroll-left { animation: smoothScrollLeft 30s linear infinite; }
        .scroll-right { animation: smoothScrollRight 30s linear infinite; }

        .marquee-profile-block {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            background: #0c0c0c; 
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 30px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .marquee-profile-block img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        @keyframes smoothScrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-33.333%); }
        }
        @keyframes smoothScrollRight {
            0% { transform: translateX(-33.333%); }
            100% { transform: translateX(0); }
        }

        #azura-discord-btn {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            z-index: 9999999 !important;
            display: block !important;
        }

        #azura-discord-btn a {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            padding: 8px 14px !important;
            background-color: #000 !important;
            border: 1px solid #444 !important;
            color: #888 !important;
            font-size: 11px !important;
            font-weight: bold !important;
            text-decoration: none !important;
            border-radius: 2px !important;
        }

        /* ✅ LOADING SCREEN — EXACT SAME AS PUBLIC ENEMY */
        #gateway-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999999 !important;
            cursor: pointer;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .gateway-btn {
            font-size: 14px !important;
            letter-spacing: 4px;
            background: transparent;
            border: none !important;
            color: #444 !important; /* ✅ GRAY TEXT */
            text-transform: uppercase;
            transition: all 0.2s ease;
            font-weight: 400 !important;
            font-family: 'Inter', sans-serif !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        .gateway-btn:hover {
            color: #888;
        }

        .fade-gateway {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        ::-webkit-scrollbar { display: none !important; }

        .name-label {
            text-align: center;
            font-size: 11px;
            margin-top: 4px;
            color: #ccc;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .section-divider {
            width: 100%;
            max-width: 1300px;
            height: 1px;
            background: #222; /* ✅ GRAY DIVIDER */
            margin: 12px 0;
        }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return disableKeys(event);">

    <div class="navigation-bar">
        HOME
        <div class="views-box">VIEWS : <span id="views">6529</span></div>
    </div>

    <div class="center-container">
        <div class="main-logo-container">
            <div class="main-clan-logo">
                <img src="public azura.png" alt="AZURA ORG LOGO">
            </div>
            <div class="symbol-break">$</div>
        </div>

        <div id="founder-container" class="horizontal-avatar-row"></div>
        <div class="section-divider"></div>

        <div class="title-group-block">
            <span class="tiny-top-text">ABOVE ALL</span>
            <h2 class="typewriter-header">ABOVE ALL</h2>
        </div>

        <div id="aboveall-container" class="horizontal-avatar-row"></div>
        <div class="section-divider"></div>

        <div class="title-group-block">
            <span class="tiny-top-text">STAFF</span>
            <h2 class="staff-header">STAFF</h2>
        </div>
        <div id="staff-container" class="horizontal-avatar-row">
            <a href="https://discord.gg/azuraorg" class="join-link" target="_blank">JOIN</a>
        </div>

        <div class="marquee-wrapper-group">
            <div class="marquee-ticker">
                <div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div>
            </div>
            <div class="marquee-ticker">
                <div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div>
            </div>
        </div>
    </div>

    <div id="azura-discord-btn">
        <a href="https://discord.gg/azuraorg" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord" style="width:18px;">
            <span>AZURA ORG</span>
        </a>
    </div>

    <div id="gateway-overlay">
        <div class="gateway-btn">CLICK</div>
    </div>

    <audio id="soundtrack" loop>
        <source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">
    

    <script>
        // 🛡️ SECURITY: BLOCK INSPECT ELEMENT, VIEW SOURCE, RIGHT CLICK
        function disableKeys(e) {
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.keyCode == 85) || 
               (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
               (e.ctrlKey && e.keyCode == 83)) {
                return false;
            }
        }
        document.onkeydown = disableKeys;
        document.oncontextmenu = function() { return false; };
        document.onmousedown = function(e) { if(e.button === 2) return false; };


        const audio = document.getElementById("soundtrack");
        audio.volume = 0.4;

        document.getElementById("gateway-overlay").addEventListener("click", function() {
            audio.play().catch(() => {});
            this.classList.add("fade-gateway");
            document.body.classList.add('loaded');
        });

        const UPDATE_INTERVAL = 5000; 

        const founderIDs = ["1250654354344775703", "1123145717461033041", "1085580321623375938"]; 
        const aboveAllIDs = ["1081806153341743144", "1414546504437207161", "918633044276019232", "1499093156321431622", "1242051125776093256", "1498999674969784426"]; 
        const staffIDs = ["1501438491207405588", "1374740899422277703", "995205070679453789", "1366187912118665276", "1459797319863242797", "1495366872516923553", "1314554124976656505", "1398759472821702773"]; 
        const scrollingIDsRow1 = ["1276210406880317522", "1506434429613113405", "1498999674969784426", "1499093156321431622", "1501438491207405588"]; 
        const scrollingIDsRow2 = ["1374740899422277703", "1081806153341743144", "995205070679453789", "1414546504437207161", "1509479201114296353"];


        async function getUserData(userId) {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const json = await res.json();

                if (json.success) {
                    const d = json.data;
                    
                    let status = d.discord_status || 'offline';
                    let activities = d.activities || [];
                    let spotify = d.spotify || null;
                    let customStatus = activities.find(a => a.type === 4) || null;

                    return {
                        id: userId,
                        username: d.discord_user.username,
                        displayName: d.discord_user.global_name || d.discord_user.username,
                        status: status,
                        avatarURL: `https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.png?size=1024`,
                        effectURL: d.discord_user.avatar_decoration_data?.asset 
                            ? `https://cdn.discordapp.com/avatar-decoration-presets/${d.discord_user.avatar_decoration_data.asset}.png?size=256` 
                            : null,
                        spotify: spotify,
                        activities: activities,
                        customStatus: customStatus
                    };
                }
                return null;
            } catch (e) {
                return null;
            }
        }


        async function fetchAndUpdate() {
            const allFounder = await Promise.all(founderIDs.map(id => getUserData(id)));
            const allAboveAll = await Promise.all(aboveAllIDs.map(id => getUserData(id)));
            const allStaff = await Promise.all(staffIDs.map(id => getUserData(id)));
            const allScroll1 = await Promise.all(scrollingIDsRow1.map(id => getUserData(id)));
            const allScroll2 = await Promise.all(scrollingIDsRow2.map(id => getUserData(id)));

            showGroup(allFounder.filter(Boolean), 'founder-container');
            showGroup(allAboveAll.filter(Boolean), 'aboveall-container');
            showGroup(allStaff.filter(Boolean), 'staff-container');
            showMarquee(allScroll1.filter(Boolean), "marquee-container-1");
            showMarquee(allScroll2.filter(Boolean), "marquee-container-2");
        }


        function showGroup(members, container) {
            const box = document.getElementById(container);
            if (!box) return;
            
            // Preserve JOIN link in staff container
            const joinLink = box.querySelector('.join-link');
            box.innerHTML = '';
            if (joinLink) box.appendChild(joinLink);

            members.forEach(mem => {
                const wrapper = document.createElement('div'); 
                wrapper.className = 'avatar-wrapper-node';

                let decoHTML = '';
                if (mem.effectURL) {
                    decoHTML = `<img src="${mem.effectURL}" class="avatar-decoration" alt="decoration" loading="lazy">`;
                }

                let statusClass = 'status-offline'; 
                if (mem.status) {
                    const s = mem.status.toLowerCase().trim();
                    if (s === 'online') statusClass = 'status-online';
                    else if (s === 'idle') statusClass = 'status-idle';
                    else if (s === 'dnd') statusClass = 'status-dnd';
                }

                // ✅ STATUS TEXT — PLAYING / LISTENING / STREAMING / WATCHING
                let statusText = '';
                let statusType = '';

                if (mem.spotify) {
                    statusType = 'activity-listening';
                    statusText = `Listening to ${mem.spotify.song}`;
                } 
                else if (mem.activities && mem.activities.length > 0) {
                    const act = mem.activities.find(a => a.type !== 4) || mem.activities[0];
                    if (act) {
                        if (act.type === 0) { statusType = 'activity-playing'; statusText = `Playing ${act.name}`; }
                        if (act.type === 1) { statusType = 'activity-streaming'; statusText = `Streaming ${act.name}`; }
                        if (act.type === 2) { statusType = 'activity-listening'; statusText = `Listening to ${act.name}`; }
                        if (act.type === 3) { statusType = 'activity-watching'; statusText = `Watching ${act.name}`; }
                    }
                }

                wrapper.innerHTML = `
                    <div class="circle-avatar-container">
                        ${decoHTML} 
                        <img src="${mem.avatarURL}" class="avatar-img" alt="avatar">
                        <span class="status-indicator ${statusClass}"></span>
                    </div>
                    <div class="name-label">${mem.displayName}</div>

                    <!-- ✅ POPUP EXACT SAME AS PUBLIC ENEMY -->
                    <div class="avatar-tooltip">
                        <div class="tooltip-header">
                            <img src="${mem.avatarURL}" class="tooltip-avatar-sm">
                            <div class="tooltip-user-info">
                                <h4>${mem.displayName}</h4>
                                <p>@${mem.username}</p>
                            </div>
                        </div>
                        ${statusText ? `<div class="tooltip-activity-wrapper ${statusType}">${statusText}</div>` : ''}
                    </div>
                `;
                box.appendChild(wrapper);
            });
        }


        function showMarquee(members, containerId) {
            const box = document.getElementById(containerId);
            if (!box || members.length === 0) return;
            const list = [...members, ...members, ...members];
            box.innerHTML = '';
            list.forEach(mem => {
                const block = document.createElement('div');
                block.className = 'marquee-profile-block';
                block.innerHTML = `<img src="${mem.avatarURL}"> <span>${mem.displayName}</span>`;
                box.appendChild(block);
            });
        }


        fetchAndUpdate();
        setInterval(fetchAndUpdate, UPDATE_INTERVAL);
    </script>
</body>
</html>
