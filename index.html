<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta property="og:description" content="click. Logo. HOME. Views: —. above all. FOUNDER. STAFF. Discord Join.">
    <meta name="twitter:title" content="/ AZURA ORG">
    <meta name="twitter:description" content="click. Logo. HOME. Views: —. above all. FOUNDER. STAFF. Discord Join.">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.lanyard.rest https://cdn.discordapp.com https://fonts.googleapis.com https://cdn.cursors-4u.net https://cdn-icons-png.flaticon.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:;">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Kanit:wght@800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            cursor: url('https://cdn.cursors-4u.net/previews/gruppled-move-tool-fa2fca77-32.webp') 48 47, auto !important;
        }

        html, body { width:100%; height:100%; }

        body {
            font-family: 'Inter', sans-serif;
            background:#000;
            background-image: linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,.9)), url("pba.webp");
            background-size:cover; background-position:center; background-attachment:fixed;
            color:#fff; height:100vh; max-height:100vh; overflow:hidden;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:10px 0; opacity:0; transition:opacity .6s ease;
        }
        body.loaded { opacity:1; }

        .center-container, .navigation-bar {
            opacity:0; visibility:hidden; transition:all .6s ease;
        }
        body.loaded .center-container, body.loaded .navigation-bar { opacity:1; visibility:visible; }

        .main-logo-container { text-align:center; margin:0 0 10px; }
        .main-clan-logo img { height:60px; width:auto; object-fit:contain; }

        .symbol-break {
            font-family:'Oswald',sans-serif; font-size:36px; font-weight:700;
            margin:5px 0 15px; text-align:center; display:block;
            animation:metallicRGB 2s infinite alternate;
        }
        @keyframes metallicRGB {
            0%   { color:#555; text-shadow:0 0 4px #333, 0 0 8px #444; }
            25%  { color:#888; text-shadow:0 0 6px #666, 0 0 12px #777; }
            50%  { color:#bbb; text-shadow:0 0 10px #999, 0 0 18px #aaa; }
            75%  { color:#e6e6e6; text-shadow:0 0 8px #bbb, 0 0 14px #ccc; }
            100% { color:#fff; text-shadow:0 0 6px #ddd, 0 0 10px #eee; }
        }

        .typewriter-header {
            font-family:'Oswald',sans-serif; font-size:32px; font-weight:700;
            letter-spacing:3px; text-transform:uppercase; width:fit-content;
            margin:0 auto 8px; animation:metallicRGB 2s infinite alternate;
        }
        .staff-header {
            font-family:'Oswald',sans-serif; font-size:26px; font-weight:700;
            letter-spacing:2px; animation:metallicRGB 2s infinite alternate;
        }

        .navigation-bar {
            position:absolute; top:25px; right:35px;
            display:flex; align-items:center; gap:15px;
            font-size:11px; letter-spacing:2px; color:#888; opacity:.8; z-index:100;
        }
        #views { font-weight:700; color:#bbb; font-variant-numeric:tabular-nums; }

        .center-container {
            max-width:1400px; width:100%; z-index:10;
            padding:0 15px; gap:15px;
            display:flex; flex-direction:column; align-items:center;
        }
        .horizontal-avatar-row {
            display:flex; flex-wrap:wrap; justify-content:center;
            gap:45px !important; padding:8px 0; min-height:120px;
        }
        .avatar-wrapper-node {
            position:relative; transition:transform .2s ease;
            display:flex; flex-direction:column; align-items:center;
        }
        .avatar-wrapper-node:hover { transform:scale(1.08); }

        .circle-avatar-container {
            width:110px !important; height:110px !important; border-radius:50%;
            position:relative; display:flex; align-items:center; justify-content:center;
        }
        img.avatar-decoration {
            position:absolute !important; inset:50% auto auto 50%;
            transform:translate(-50%,-50%) !important;
            width:135px !important; height:135px !important; z-index:1; pointer-events:none;
        }
        .circle-avatar-container img.avatar-img {
            width:110px !important; height:110px !important; border-radius:50% !important;
            object-fit:cover; z-index:2; border:2px solid #000; background:#000;
        }
        .status-indicator {
            position:absolute; bottom:6px; right:6px;
            width:14px; height:14px; border-radius:50%; border:2px solid #000; z-index:3;
        }
        .status-online{background:#23a55a}.status-idle{background:#f0b232}.status-dnd{background:#f13f43}.status-offline{background:#80848e}
        .name-label {
            font-size:12px; margin-top:6px; color:#ccc;
            max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }

        /* ✅ POPUP KALAKI SA PIC */
        .avatar-tooltip {
            position:absolute; top:calc(100% + 14px); left:50%;
            transform:translateX(-50%);
            width:300px !important; background:#0b0b0d;
            border:1px solid #1a1a1d; border-radius:14px;
            padding:18px !important;
            box-shadow:0 10px 40px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02);
            color:#fff; opacity:0; visibility:hidden;
            transition:all .22s ease; pointer-events:none; z-index:99999;
        }
        .avatar-wrapper-node:hover .avatar-tooltip {
            opacity:1; visibility:visible; transform:translateX(-50%) translateY(-2px);
        }
        .tooltip-header {
            display:flex; align-items:center; gap:12px;
            padding-bottom:12px; border-bottom:1px solid #1c1c20; margin-bottom:12px;
        }
        .tooltip-avatar-sm { width:48px !important; height:48px !important; border-radius:50%; }
        .tooltip-user-info {
            display:flex; flex-direction:column; gap:2px; min-width:0;
            position:relative; padding-right:22px;
        }
        .tooltip-user-info h4 { font-size:18px !important; font-weight:600; margin:0; color:#fff; }
        .tooltip-user-info p  { font-size:13px !important; color:#949ba4; margin:0; }
        .tooltip-user-info::after {
            content:""; position:absolute; right:0; top:6px;
            width:12px; height:12px; border-radius:999px; border:2px solid #0b0b0d;
        }
        .avatar-wrapper-node:has(.status-online)  .tooltip-user-info::after{background:#23a55a}
        .avatar-wrapper-node:has(.status-idle)    .tooltip-user-info::after{background:#f0b232}
        .avatar-wrapper-node:has(.status-dnd)     .tooltip-user-info::after{background:#f13f43}
        .avatar-wrapper-node:has(.status-offline) .tooltip-user-info::after{background:#80848e}

        .tooltip-activity-wrapper {
            background:#111214; border-radius:8px;
            padding:10px 12px; font-size:15px !important; font-weight:500;
            color:#b5bac1; line-height:1.4;
        }
        .activity-playing{color:#43b581}.activity-streaming{color:#9146ff}.activity-listening{color:#1db954}.activity-watching{color:#faa61a}.activity-custom{color:#b9bbbe}

        .marquee-ticker { overflow:hidden; width:100%; max-width:900px; }
        .marquee-wrapper-group { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
        .marquee-inner-wrap { display:flex; gap:12px; width:max-content; }
        .scroll-left  { animation:smoothScrollLeft 30s linear infinite; }
        .scroll-right { animation:smoothScrollRight 30s linear infinite; }
        @keyframes smoothScrollLeft  { 0%{transform:translateX(0)} 100%{transform:translateX(-33.333%)} }
        @keyframes smoothScrollRight { 0%{transform:translateX(-33.333%)} 100%{transform:translateX(0)} }
        .marquee-profile-block {
            display:flex; align-items:center; gap:8px; font-size:12px;
            color:rgba(255,255,255,.8); background:#0c0c0c;
            border:1px solid rgba(255,255,255,.08);
            padding:4px 12px; border-radius:999px;
        }
        .marquee-profile-block img { width:28px; height:28px; border-radius:50%; }

        .azura-discord-link {
            position:fixed; bottom:22px; right:28px; z-index:9999;
            display:inline-flex; align-items:center; gap:10px;
            text-decoration:none; animation:azuraPulse 1.6s infinite alternate;
        }
        .discord-icon-svg {
            width:26px; height:22px;
            animation:metallicRGB 2s infinite alternate, discordGlow 1.6s infinite alternate;
        }
        .azura-text-glow {
            font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; letter-spacing:5px;
            animation:metallicRGB 2s infinite alternate;
        }
        @keyframes azuraPulse  { 0%{transform:scale(1);   filter:drop-shadow(0 0 2px #5865F2)} 100%{transform:scale(1.15); filter:drop-shadow(0 0 12px #5865F2)} }
        @keyframes discordGlow { 0%{filter:drop-shadow(0 0 2px #5865F2)} 100%{filter:drop-shadow(0 0 10px #7289da)} }

        /* ✅ LOADING — AGAD LUMALABAS */
        #gateway-overlay {
            position:fixed; inset:0; width:100vw; height:100vh;
            background:#000 !important; display:flex !important;
            justify-content:center; align-items:center; z-index:9999999 !important;
            cursor:pointer; opacity:1; visibility:visible;
            transition:opacity .7s ease, visibility .7s ease;
        }
        #gateway-overlay.fade-gateway { opacity:0 !important; visibility:hidden !important; pointer-events:none !important; }
        .gateway-btn {
            font-family:'Inter',sans-serif !important; font-size:18px !important;
            font-weight:400 !important; letter-spacing:14px !important;
            text-transform:uppercase; color:#cfd2d6 !important;
            text-shadow:0 0 10px rgba(255,255,255,.35), 0 0 28px rgba(255,255,255,.18), 0 0 60px rgba(255,255,255,.08);
            animation:gatewayBlink 2.2s ease-in-out infinite;
        }
        @keyframes gatewayBlink { 0%,100%{opacity:.55} 50%{opacity:1} }

        ::-webkit-scrollbar{display:none !important}
        .section-divider { width:100%; max-width:1300px; height:1px; background:#1a1a1a; margin:15px 0; }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return disableKeys(event);">

    <div class="navigation-bar">
        HOME
        <div class="views-box">VIEWS : <span id="views">0</span></div>
    </div>

    <div class="center-container">
        <div class="main-logo-container">
            <div class="main-clan-logo"><img src="public azura.png" alt="AZURA ORG"></div>
            <div class="symbol-break">$</div>
        </div>

        <div id="founder-container"  class="horizontal-avatar-row"></div>
        <div class="section-divider"></div>
        <h2 class="typewriter-header">ABOVE ALL</h2>
        <div id="aboveall-container" class="horizontal-avatar-row"></div>
        <div class="section-divider"></div>
        <h2 class="staff-header">STAFF</h2>
        <div id="staff-container"    class="horizontal-avatar-row"></div>

        <div class="marquee-wrapper-group">
            <div class="marquee-ticker"><div id="marquee-container-1" class="marquee-inner-wrap scroll-left"></div></div>
            <div class="marquee-ticker"><div id="marquee-container-2" class="marquee-inner-wrap scroll-right"></div></div>
        </div>
    </div>

    <a href="https://discord.gg/azuraorg" class="azura-discord-link" target="_blank">
        <svg class="discord-icon-svg" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9C55.58 2.82 50.73 1.29 45.65.416a.43.43 0 0 0-.5.11c-.624 1.11-1.316 2.558-1.8 3.692-5.457-.818-10.886-.818-16.23.002-.485-1.134-1.202-2.557-1.828-3.668a.428.428 0 0 0-.504-.11C15.406 2.818 10.553 4.898 6.028 6.974-3.17 20.727-5.694 34.14-4.457 47.388a.47.47 0 0 0 .16.366c12.254 9.162 24.74 14.447 37.26 15.367a.446.446 0 0 0 .518-.366c1.363-1.23 2.628-2.597 3.77-4.06a.44.44 0 0 0-.084-.504c-2.883-1.135-5.57-2.545-8.007-4.206a.436.436 0 0 1-.025-.65c.574-.565 1.125-1.155 1.64-1.777a.434.434 0 0 1 .37-.16c10.676 1.632 21.49 1.632 32.081.002a.434.434 0 0 1 .37.16c.515.622 1.066 1.212 1.64 1.777a.436.436 0 0 1-.025.65c-2.437 1.66-5.124 3.07-8.007 4.206a.44.44 0 0 0-.084.504c1.142 1.463 2.407 2.83 3.77 4.06a.446.446 0 0 0 .518.366c12.52-.92 25.006-6.205 37.26-15.367a.47.47 0 0 0 .16-.366c1.766-18.318-5.283-35.626-21.934-40.41ZM23.726 38.325c-3.498 0-6.38-3.212-6.38-7.166 0-3.952 2.826-7.166 6.38-7.166s6.436 3.214 6.38 7.166c0 3.954-2.882 7.166-6.38 7.166Zm23.592 0c-3.498 0-6.38-3.212-6.38-7.166 0-3.952 2.826-7.166 6.38-7.166s6.436 3.214 6.38 7.166c0 3.954-2.882 7.166-6.38 7.166Z"/></svg>
        <span class="azura-text-glow">AZURA</span>
    </a>

    <div id="gateway-overlay"><div class="gateway-btn">CLICK</div></div>
    <audio id="soundtrack" loop preload="auto"><source src="5-mil_2RPY2b9n.mp3" type="audio/mpeg">

    <script>
        // 🛡️ SECURITY
        function disableKeys(e){
            if([123,85,73,83,67].includes(e.keyCode) && (e.ctrlKey||e.shiftKey)){ e.preventDefault(); return false; }
        }
        document.onkeydown=disableKeys;
        document.oncontextmenu=()=>false;

        // 🔢 VISITOR COUNTER
        const K_VIEW="azura_org_total_views", K_VIS="azura_org_visited_before", BASE=5569;
        function initCounter(){
            let v=+localStorage.getItem(K_VIEW)||BASE;
            if(localStorage.getItem(K_VIS)!=="true"){ v++; localStorage.setItem(K_VIS,"true"); localStorage.setItem(K_VIEW,v); }
            const el=document.getElementById("views"), dur=1800, sT=performance.now();
            !function t(n){
                const p=Math.min((n-sT)/dur,1), e=1-Math.pow(1-p,3), c=Math.floor(v*e);
                el.textContent=c.toLocaleString();
                p<1?requestAnimationFrame(t):el.textContent=v.toLocaleString();
            }(performance.now());
        }
        initCounter();

        const audio=document.getElementById("soundtrack"); audio.volume=.35;
        const gw=document.getElementById("gateway-overlay");
        gw.addEventListener("click",()=>{
            audio.play().catch(()=>{});
            gw.classList.add("fade-gateway");
            document.body.classList.add("loaded");
        });

        const UPDATE = 4000; // ⬅️ PINABILIS KO PA NG KONTI ANG REFRESH
        const MY_ID = "1250654354344775703"; // ⬅️ ITO ID MO

        const founderIDs   = [MY_ID,"1123145717461033041","1085580321623375938"];
        const aboveAllIDs  = ["1081806153341743144","1414546504437207161","918633044276019232","1499093156321431622","1242051125776093256","1498999674969784426"];
        const staffIDs     = ["1501438491207405588","1374740899422277703","995205070679453789","1366187912118665276","1459797319863242797","1495366872516923553","1314554124976656505","1398759472821702773"];
        const s1=["1276210406880317522","1506434429613113405","1498999674969784426","1499093156321431622","1501438491207405588"];
        const s2=["1374740899422277703","1081806153341743144","995205070679453789","1414546504437207161","1509479201114296353"];

        // ============================================================
        // ✅ ✅ BAGONG API FETCHER — UUNAHIN TALAGA ANG SPOTIFY ✅ ✅
        // ============================================================
        async function getUserData(userId){
            try {
                // ❌ TINANGGAL KO NA ANG CACHE — BAGONG DATOS LAGI
                const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`,{
                    cache:"no-store",
                    headers:{ "Cache-Control":"no-cache, no-transform", Pragma:"no-cache" }
                });
                if(!res.ok) throw new Error("HTTP "+res.status);
                const json = await res.json();
                if(!json || !json.success) return null;

                const d = json.data;

                // 🔍 PARA MAKITA MO — Buksan F12 > Console, makikita mo buong datos
                if(userId === MY_ID){
                    console.log("%c✅ LANAYARD RAW DATA — IKAW ITO","color:#1db954; font-weight:bold; font-size:14px;");
                    console.log("Spotify:", d.spotify);
                    console.log("Activities:", d.activities);
                    console.log("Status:", d.discord_status);
                    console.log("Full object:", d);
                }

                const activities = Array.isArray(d.activities) ? d.activities : [];
                const customStatus = activities.find(a => a && a.type === 4) || null;
                const realActivities = activities.filter(a => a && a.type !== 4);
                const mainAct = realActivities[0] || null;

                // 🎧 🎧 🎧 SPOTIFY MUNA BAGO ANG LAHAT — ITO ANG PINAKA IMPORTANTE 🎧 🎧 🎧
                let ac = { type:null, text:null, cl:"" };

                if(d.spotify && typeof d.spotify === "object" && d.spotify.track_id){
                    const song = d.spotify.song || "Unknown Song";
                    const artist = d.spotify.artist || "Unknown Artist";
                    const album = d.spotify.album || "";
                    ac = {
                        type:"spotify",
                        text: `🎧 Listening to\n${song}\nby ${artist}${album?"\non "+album:""}`,
                        cl: "activity-listening"
                    };
                }
                // 🎮 GAMES
                else if(mainAct && mainAct.type === 0){
                    let txt = `🎮 Playing ${mainAct.name||""}`;
                    if(mainAct.details) txt += `\n${mainAct.details}`;
                    if(mainAct.state)   txt += `\n${mainAct.state}`;
                    ac = { type:"game", text:txt, cl:"activity-playing" };
                }
                // 📡 STREAM
                else if(mainAct && mainAct.type === 1) ac={type:"stream", text:`📡 Streaming ${mainAct.name||""}`, cl:"activity-streaming"};
                // 🎧 IBA PANG NAKIKINIG
                else if(mainAct && mainAct.type === 2) ac={type:"listen", text:`🎧 Listening to ${mainAct.name||""}`, cl:"activity-listening"};
                // 📺 NANONOOD
                else if(mainAct && mainAct.type === 3) ac={type:"watch",  text:`📺 Watching ${mainAct.name||""}`,  cl:"activity-watching"};
                // 💬 CUSTOM STATUS HULI NA LANG
                else if(customStatus){
                    const em = (customStatus.emoji?.name || customStatus.emoji?.id || "");
                    const tx = customStatus.state || "";
                    const out = (em?em+" ":"") + (tx||em||"");
                    ac = { type:"custom", text: out || "No activity", cl:"activity-custom" };
                }

                return {
                    id: userId,
                    u: d.discord_user.username,
                    dn: d.discord_user.global_name || d.discord_user.display_name || d.discord_user.username,
                    st: d.discord_status || "offline",
                    av: `https://cdn.discordapp.com/avatars/${userId}/${d.discord_user.avatar}.png?size=1024`,
                    fx: d.discord_user.avatar_decoration_data?.asset
                        ? `https://cdn.discordapp.com/avatar-decoration-presets/${d.discord_user.avatar_decoration_data.asset}.png?size=256`
                        : null,
                    ac
                };

            } catch(err){
                console.warn(`❌ Lanyard error ${userId}:`, err.message);
                return null;
            }
        }

        async function go(){
            const [F,A,S,M1,M2] = await Promise.all([
                Promise.all(founderIDs.map(getUserData)),
                Promise.all(aboveAllIDs.map(getUserData)),
                Promise.all(staffIDs.map(getUserData)),
                Promise.all(s1.map(getUserData)),
                Promise.all(s2.map(getUserData))
            ]);
            draw(F,"founder-container");
            draw(A,"aboveall-container");
            draw(S,"staff-container");
            marquee(M1,"marquee-container-1");
            marquee(M2,"marquee-container-2");
        }

        function draw(list, id){
            const b = document.getElementById(id); if(!b) return;
            b.innerHTML = "";
            const smap = {online:"status-online",idle:"status-idle",dnd:"status-dnd"};
            list.filter(Boolean).forEach(m=>{
                const w = document.createElement("div");
                w.className = "avatar-wrapper-node";
                w.innerHTML = `
                    <div class="circle-avatar-container">
                        ${m.fx?`<img src="${m.fx}" class="avatar-decoration" loading="lazy">`:""}
                        <img src="${m.av}" class="avatar-img" loading="lazy">
                        <span class="status-indicator ${smap[m.st]||"status-offline"}"></span>
                    </div>
                    <div class="name-label">${m.dn}</div>
                    <div class="avatar-tooltip">
                        <div class="tooltip-header">
                            <img src="${m.av}" class="tooltip-avatar-sm">
                            <div class="tooltip-user-info">
                                <h4>${m.dn}</h4><p>@${m.u}</p>
                            </div>
                        </div>
                        ${m.ac.text?`<div class="tooltip-activity-wrapper ${m.ac.cl}" style="white-space:pre-line">${m.ac.text}</div>`:""}
                    </div>`;
                b.appendChild(w);
            });
        }

        function marquee(list,id){
            const b=document.getElementById(id); if(!b||!list.length) return;
            const x=[...list,...list,...list];
            b.innerHTML=x.map(m=>`<div class="marquee-profile-block"><img src="${m.av}" loading="lazy"><span>${m.dn}</span></div>`).join("");
        }

        go();
        setInterval(go, UPDATE);
    </script>
</body>
</html>
