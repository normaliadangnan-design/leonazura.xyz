<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZURA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap');

*{margin:0; padding:0; box-sizing:border-box;}

body{
font-family:Poppins;
background: linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.92)), url("att.MNKCYkhOQ9iAQURy1mtb8dbTrtzcFCbCN_gWu1wZyVU.png.webp");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* skeleton texture */
body::before{
content:"☠";
position:fixed;
font-size:520px;
opacity:.04;
top:50%; left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
color:white;
z-index: 1;
}

/* Layout */
.header{ padding-top:70px; text-align:center; position: relative; z-index: 2; }
.logo{ width:140px; animation:float 4s infinite ease-in-out; }
@keyframes float{ 50%{ transform:translateY(-10px); } }

.line{ width:90%; height:1px; background:rgba(255,255,255,.08); margin:50px auto; position: relative; z-index: 2; }

.section-container { text-align: center; width: 100%; position: relative; z-index: 2; }
.founder-title { font-size:24px; font-weight:700; letter-spacing:10px; margin-bottom: 10px; }
.subtitle{ font-size:12px; letter-spacing:8px; opacity:.6; margin-bottom:10px; text-transform:uppercase; }
.title{ font-size:52px; font-family:Cinzel; font-weight:700; letter-spacing:5px; margin-bottom: 15px; }

.row{ display:flex; justify-content:center; gap:25px; flex-wrap:wrap; margin-top:35px; margin-bottom:50px; }
.avatar{ width:95px; height:95px; border-radius:50%; border:2px solid rgba(255,255,255,.35); overflow:hidden; position:relative; }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.avatar-box{ position:relative; }

/* Home/Views Section - FIXED */
.home{ position:absolute; top:30px; right:60px; text-align:right; font-size:13px; letter-spacing:4px; z-index: 3; }
.views-container { margin-top: 5px; }

/* Members Scroll & Footer */
.member-wrap { overflow: hidden; width: 100%; padding: 15px 0; margin-top: 50px; border-top: 1px solid rgba(255, 255, 255, .08); border-bottom: 1px solid rgba(255, 255, 255, .08); background: rgba(0, 0, 0, 0.3); position: relative; z-index: 2; }
.scroll { display: flex; gap: 30px; width: max-content; animation: scroll 30s linear infinite; }
.member { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, .06); padding: 8px 20px 8px 10px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, .1); white-space: nowrap; }
.member-pic { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
@keyframes scroll{ 0%{ transform:translateX(0); } 100%{ transform:translateX(-50%); } }
footer{ text-align:center; padding:50px; opacity:.5; font-size:13px; position: relative; z-index: 2; }

/* Discord Box */
.discord-box{ position:fixed; bottom:30px; right:30px; z-index:999; }
.discord-box a{ display:flex; align-items:center; gap:12px; padding:14px 22px; text-decoration:none; color:white; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:50px; backdrop-filter:blur(10px); }
.discord-box img{ width:28px; }

/* Hover Cards */
.info-card{ position:absolute; top:110px; left:50%; transform:translateX(-50%); width:240px; padding:15px; background:black; border-radius:20px; display:none; z-index:999; border:1px solid rgba(255,255,255,.1); text-align: left; }
.avatar-box:hover .info-card{ display:block; }
.card-pic{ width:100%; height:120px; object-fit:cover; border-radius:15px; margin-bottom:12px; }

/* Enter Screen */
#enterScreen{ position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:flex; justify-content:center; align-items:center; z-index:999999; cursor: pointer; }
.enter-text{ padding:20px 40px; letter-spacing:8px; background:rgba(255,255,255,.05); border-radius:20px; }
</style>
</head>
<body>

<div class="home">
    <div>HOME</div>
    <div class="views-container"> 
        <img src="https://hits.seeyouforme.li/api/count/incr/badge.svg?url=https%3A%2F%2Fleonazura.xyz&count_bg=%23000000&title_bg=%23000000&icon=&icon_color=%23E7E7E7&title=views&edge_flat=false" alt="Views"/> 
    </div>
</div>

<div class="header">
    <img src="azura-logo.png" class="logo">
</div>

<div class="line"></div>

<div class="section-container">
    <div class="founder-title">$</div>
    <div class="row">
        </div>
</div>

<footer>AZURA • ABOVE ALL • $</footer>

<div id="enterScreen"><div class="enter-text">☠ ENTER AZURA ☠</div></div>

<audio id="bgMusic" loop><source src="ssstik.io_1779340810631.mp3" type="audio/mpeg"></audio>

<script>
const music = document.getElementById("bgMusic");
music.volume=0.5;
document.getElementById("enterScreen").onclick=()=>{
music.play().catch(()=>{});
document.getElementById("enterScreen").style.display="none";
};
</script>

<div class="discord-box">
    <a href="https://discord.gg/TvfnaBMFzc" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
        <span>AZURA DISCORD</span>
    </a>
</div>

</body>
</html>
