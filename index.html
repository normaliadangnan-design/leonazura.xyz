<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZURA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Space+Grotesk:wght@300;400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Space Grotesk', sans-serif;
    background: 
        linear-gradient(rgba(0, 0, 0, 0.93), rgba(0, 0, 0, 0.95)),
        url("bg.webp");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #ffffff;
    overflow-x: hidden;
    min-height: 100vh;
    text-align: center;
}

/* TOP WIDGETS */
.top-nav {
    position: absolute;
    top: 25px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 10px;
    letter-spacing: 2px;
    z-index: 100;
    opacity: 0.5;
}

.view-counter {
    padding: 3px 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
}

/* HEADER BRANDING */
.header-container {
    padding-top: 50px;
    margin-bottom: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-brand {
    max-width: 310px;
    height: auto;
    display: block;
}

/* MAIN TREE CLUSTER WRAPPER */
.main-cluster {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

/* SECTION HEADERS (PUBLIC ENEMY ACCURATE STYLING) */
.title-block {
    margin-top: 30px;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.tiny-sub {
    font-size: 8px;
    font-weight: 400;
    letter-spacing: 4px;
    color: rgba(255, 255, 255, 0.25);
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 2px;
}

.main-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffffff;
    line-height: 1.2;
}

.dollar-symbol {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 500;
    color: #ffffff;
    margin-top: 20px;
    margin-bottom: 15px;
    letter-spacing: 0;
}

/* THE OVERLAPPING AVATAR CHAIN */
.row-chain {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 5px 0;
}

.avatar-node {
    position: relative;
    /* Dikit-dikit at nagpapatong ang mga gilid */
    margin-left: -22px; 
    transition: transform 0.2s ease, z-index 0.2s ease;
    z-index: 10;
}

.avatar-node:first-child {
    margin-left: 0;
}

/* Umaangat kapag tinapatan ng mouse */
.avatar-node:hover {
    transform: scale(1.18);
    z-index: 999 !important;
}

/* BASE AVATAR CIRCLE Frame Look */
.circle-frame {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #000000;
    padding: 2px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    overflow: visible; /* Para sa mga dekorasyon sa labas ng bilog */
}

.circle-frame img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

/* CUSTOM COSMETIC ADDONS (KATULAD NG WINGS/EARS SA PUBLIC ENEMY) */
.wings-decoration {
    position: absolute;
    width: 110px;
    height: auto;
    top: -12px;
    left: -17px;
    pointer-events: none;
    z-index: 2;
    opacity: 0.85;
}

/* HOVER DETAILED TOOLTIPS */
.node-info-popup {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%) translateY(5px);
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 4px 10px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 1000;
}

.info-name {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.avatar-node:hover .node-info-popup {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* MARQUEE RUNNER PACK */
.marquee-container {
    overflow: hidden;
    width: 100%;
    padding: 12px 0;
    margin-top: 50px;
    background: rgba(0, 0, 0, 0.4);
    border-top: 1px solid rgba(255, 255, 255, 0.015);
    border-bottom: 1px solid rgba(255, 255, 255, 0.015);
}

.marquee-track {
    display: flex;
    gap: 40px;
    width: max-content;
    animation: marqueeShift 26s linear infinite;
}

.marquee-block {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.6);
}

.marquee-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
}

@keyframes marqueeShift {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* FLOATING JOIN DISCORD ACTION BUTTON */
.discord-button-floating {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 9999;
}

.discord-button-floating a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    text-decoration: none;
    color: #ffffff;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* OVERLAY GATEWAY SCREEN */
#gatekeeper {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    cursor: pointer;
    transition: opacity 0.6s ease, visibility 0.6s;
}

.gate-button {
    padding: 12px 30px;
    font-size: 10px;
    letter-spacing: 5px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

.exit-gate {
    opacity: 0;
    visibility: hidden;
}
</style>
</head>
