<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon | PUBLIC AZURA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)),
        url("../members/founder/leon.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #e0e0e0;
    padding: 20px;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        repeating-linear-gradient(transparent 0px, rgba(255,255,255,0.015) 1px, transparent 2px);
    background-size: 6px 6px, 100% 4px;
    z-index: 1;
    pointer-events: none;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
}

@keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
}

/* 🚀 Loading Screen */
#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

#loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
}

#loading-overlay::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffffff, transparent);
    animation: scanline 2s linear infinite;
    opacity: 0.7;
}

.loading-text {
    font-size: 28px;
    color: #fff;
    letter-spacing: 8px;
    animation: pulse 1.5s infinite alternate;
}

/* 🎯 Main Profile Card - Terminal Style */
.profile-card {
    width: 100%;
    max-width: 520px;
    background: rgba(10, 10, 10, 0.9);
    border: 1px solid rgba(80, 80, 80, 0.4);
    border-radius: 6px;
    padding: 24px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
    z-index: 10;
    animation: fadeIn 0.6s ease-out forwards;
    opacity: 0;
}

/* Header / Avatar Section */
.profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
}

.avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
    position: relative;
    background: #000;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.1);
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: none;
}

.user-info {
    flex: 1;
    overflow: hidden;
}

.display-name {
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px currentColor;
}
.status-online { background-color: #23a55a; color: #23a55a; }
.status-idle { background-color: #f0b232; color: #f0b232; }
.status-dnd { background-color: #f13f43; color: #f13f43; }
.status-offline { background-color: #80848e; color: #80848e; }

.username {
    font-size: 15px;
    color: #a0a0a0;
}

/* Section Styles */
.section {
    margin-bottom: 20px;
}

.section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #777;
    margin-bottom: 10px;
    font-weight: 500;
}

/* Activity */
.activity-box {
    background: rgba(5, 5, 5, 0.6);
    border: 1px solid rgba(60, 60, 60, 0.4);
    border-radius: 4px;
    padding: 12px;
    font-size: 14px;
    color: #cccccc;
}

/* Terminal / Status */
.terminal-box {
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(50, 50, 50, 0.5);
    border-radius: 4px;
    padding: 12px;
    font-size: 14px;
    color: #b0e090;
    line-height: 1.6;
}

.terminal-prompt {
    color: #639cd9;
}

/* Quote / Bio */
.quote-box {
    background: rgba(5, 5, 5, 0.6);
    border: 1px solid rgba(60, 60, 60, 0.4);
    border-radius: 4px;
    padding: 12px;
    font-size: 14px;
    color: #cccccc;
    font-style: italic;
}

/* Links / Socials */
.links-container {
    display: flex;
    gap: 16px;
    margin-top: 8px;
}

.social-link {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.25s ease;
}

.social-link:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-2px);
}

.social-link svg {
    width: 20px;
    height: 20px;
    fill: #e0e0e0;
}

/* Responsive */
@media (max-width: 480px) {
    .profile-header {
        flex-direction: column;
        text-align: center;
    }
    .profile-card {
        padding: 18px;
    }
}
</style>
</head>
<body oncontextmenu="return false;">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.317 4.92c-1.167-.977-2.387-1.785-3.653-2.42a.44.44 0 0 0-.234-.075 10.3 10.3 0 0 0-1.336.557 14.3 14.3 0 0 0-3.864 1.125 14.5 14.5 0 0 0-3.944-1.125 10.4 10.4 0 0 0-1.34-.557.43.43 0 0 0-.233.075c-1.266.635-2.486 1.443-3.653 2.42a.41.41 0 0 0-.067.417c.397 1.23 1.043 2.387 1.917 3.443a.41.41 0 0 0 .443.137c1.03-.38 2.07-.667 3.13-.857a.41.41 0 0 0 .267-.303 9.5 9.5 0 0 1-.107-1.143.41.41 0 0 1 .41-.41h.07a8.3 8.3 0 0 1 2.77.997.41.41 0 0 0 .443 0 8.3 8.3 0 0 1 2.77-.997h.07a.41.41 0 0 1 .41.41c0 .38-.037.76-.107 1.143a.41.41 0 0 0 .267.303c1.06.19 2.1.477 3.13.857a.41.41 0 0 0 .443-.137c.874-1.056 1.52-2.213 1.917-3.443a.41.41 0 0 0-.067-.417zM8.02 14.763c-1.19 0-2.16-1.07-2.16-2.387 0-1.317.953-2.387 2.16-2.387 1.206 0 2.173 1.07 2.16 2.387.013 1.317-.954 2.387-2.16 2.387zm7.96 0c-1.19 0-2.16-1.07-2.16-2.387 0-1.317.953-2.387 2.16-2.387 1.206 0 2.173 1.07 2.16 2.387.013 1.317-.954 2.387-2.16 2.387z"/></svg>

<script>
const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;

// Loading Screen
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('profileCard').style.opacity = "1";
    }, 2500);
});

async function fetchData() {
    try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const json = await res.json();

        if (!json.success) {
            console.error("API Error:", json);
            document.getElementById('activityText').innerText = "API Error";
            return;
        }

        const d = json.data;

        // Avatar & Decoration
        const avatarEl = document.getElementById('avatarImg');
        const decoEl = document.getElementById('avatarDeco');
        if (d.discord_user.avatar) {
            avatarEl.src = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
        } else {
            avatarEl.src = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        }

        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            decoEl.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.style.display = "block";
        } else {
            decoEl.style.display = "none";
        }

        // Names
        document.getElementById('displayName').innerText = d.discord_user.global_name || "Leon";
        document.getElementById('username').innerText = `@${d.discord_user.username || "wtf.leon"}`;

        // Status
        const statusDot = document.getElementById('statusDot');
        statusDot.className = "status-dot";
        switch(d.discord_status) {
            case 'online': statusDot.classList.add('status-online'); break;
            case 'idle': statusDot.classList.add('status-idle'); break;
            case 'dnd': statusDot.classList.add('status-dnd'); break;
            default: statusDot.classList.add('status-offline'); break;
        }

        // Custom Status / Terminal
        const customStatus = d.activities?.find(a => a.type === 4);
        document.getElementById('customStatus').innerText = customStatus?.state || "PA KISS NGA";

        // Activity
        const activityEl = document.getElementById('activityText');
        const activity = d.activities?.find(a => a.type === 0 || a.type === 2 || a.type === 3);
        if (activity) {
            if (activity.type === 0) activityEl.innerText = `Playing: ${activity.name}`;
            if (activity.type === 2) activityEl.innerText = `Listening: ${activity.name}`;
            if (activity.type === 3) activityEl.innerText = `Watching: ${activity.name}`;
        } else {
            activityEl.innerText = "No activity";
        }

        // Quote/Bio
        document.getElementById('quoteText').innerText = customStatus?.details || "Too real , too";

    } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById('activityText').innerText = "Connection Error";
    }
}

fetchData();
setInterval(fetchData, 5000);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if ((e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || e.key === 'F12') {
        e.preventDefault();
    }
});
</script>
