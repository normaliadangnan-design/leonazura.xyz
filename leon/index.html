<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background:
        linear-gradient(rgba(0, 0, 0, 0.80), rgba(0, 0, 0, 0.82)),
        url("../members/founder/leon.gif") center/cover fixed no-repeat;
    color: #ffffff;
    overflow-y: auto;
    padding: 130px 20px 40px;
    position: relative;
}

body::before {
    content: "";
    position: absolute; inset: 0;
    background: 
        radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.7' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 8px 8px, 180px 180px;
    z-index: 1; pointer-events: none;
}

@keyframes borderGlow {
    0%,100% { box-shadow: 0 0 6px rgba(255,255,255,0.14), 0 0 12px rgba(255,255,255,0.08); }
    50% { box-shadow: 0 0 14px rgba(255,255,255,0.28), 0 0 24px rgba(255,255,255,0.16); }
}
@keyframes typing { from {width:0;} to {width:100%;} }
@keyframes blink {50% {border-color:transparent;}}
@keyframes hideCursor {to {border-right:none;}}

#typewriter-name {
    font-family: 'Poppins', sans-serif; font-size:28px; font-weight:700; letter-spacing:2px;
    color:#fff; text-shadow:0 0 18px rgba(255,255,255,0.45);
    margin-bottom:18px; text-align:center; overflow:hidden; white-space:nowrap;
    border-right:2px solid #fff; width:fit-content; margin-inline:auto;
    animation: typing 2.5s steps(9,end) forwards, blink .8s infinite 2.5s, hideCursor .1s forwards 4s;
}

/* 🚀 — PINAGANDANG LOADING SCREEN */
#loading-overlay {
    position:fixed; inset:0;
    background:radial-gradient(circle at center,#0e0e14 0%,#000 100%);
    z-index:999999; display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .9s cubic-bezier(.19,1,.22,1), visibility .9s; overflow:hidden;
}
#loading-overlay::before {
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:28px 28px; animation:bgFloat 7s linear infinite; opacity:.65;
}
@keyframes bgFloat {0%{transform:translate(0,0);}100%{transform:translate(28px,28px);}}
#loading-overlay::after {
    content:""; position:absolute; width:100%; height:4px;
    background:linear-gradient(90deg,transparent,#fff,#ff3377,#00eeff,transparent);
    box-shadow:0 0 25px #fff,0 0 50px #ff337755,0 0 75px #00eeff40;
    animation:scanLine 2.2s linear infinite; opacity:.95;
}
@keyframes scanLine {0%{transform:translateY(-220%);}100%{transform:translateY(750%);}}
.crt-noise {
    position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(transparent 0,rgba(255,255,255,.022) 1px,transparent 2px);
    animation:scanLines 3.5s linear infinite; opacity:.3;
}
@keyframes scanLines {from{transform:translateY(0);}to{transform:translateY(100vh);}}
.loading-content {
    position:relative; text-align:center; padding:65px 95px; border-radius:22px;
    border:1px solid rgba(255,255,255,.14); background:rgba(6,6,8,.68);
    box-shadow:0 0 65px rgba(255,255,255,.14), inset 0 0 90px rgba(0,0,0,.92);
    animation:borderPulse 2.8s ease-in-out infinite;
}
@keyframes borderPulse {
    0%,100%{border-color:rgba(255,255,255,.12);box-shadow:0 0 30px rgba(255,255,255,.08);}
    50%{border-color:rgba(255,255,255,.36);box-shadow:0 0 75px rgba(255,255,255,.22);}
}
.loading-avatar {
    width:145px;height:145px;margin:0 auto 32px;border-radius:50%;overflow:hidden;
    border:2px solid rgba(255,255,255,.22);position:relative;
    animation:floatRock 3.2s ease-in-out infinite alternate;box-shadow:0 0 32px rgba(255,255,255,.16);
}
.loading-avatar img {width:100%;height:100%;object-fit:cover;animation:slowSpin 13s linear infinite;}
@keyframes floatRock {from{transform:translateY(-9px)rotate(-1deg);}to{transform:translateY(9px)rotate(1deg);}}
@keyframes slowSpin {to{transform:rotate(360deg);}}
.loading-main-text {
    font-family:'Oswald',sans-serif;font-size:64px;font-weight:800;letter-spacing:26px;text-transform:uppercase;
    animation:textGlow 2.2s ease-in-out infinite alternate,glitchEffect 5.5s infinite;
}
@keyframes textGlow {from{text-shadow:0 0 16px #fff,0 0 32px #fff40,0 0 48px #ff337720;}to{text-shadow:0 0 28px #fff,0 0 55px #fff80,0 0 80px #00eeff50;}}
@keyframes glitchEffect {
    0%{transform:translate(0);}2%{transform:translate(-4px,2px);text-shadow:2px 0 16px #ff3377,-2px 0 16px #00eeff;}
    4%{transform:translate(4px,-2px);text-shadow:-2px 0 16px #ff3377,2px 0 16px #00eeff;}
    6%{transform:translate(0);text-shadow:0 0 20px #fff;}8%{transform:translate(-2px,-1px);}10%{transform:translate(0);}
}
.loading-sub-text {margin-top:30px;font-size:17px;letter-spacing:7px;color:#ccc;animation:subPulse 2.1s infinite alternate;}
@keyframes subPulse {0%{opacity:.4;letter-spacing:4px;}100%{opacity:1;letter-spacing:7px;}}

/* ✅ LAYOUT */
.logo-img-container {display:flex;justify-content:center;align-items:center;margin-bottom:42px;padding:15px;margin-top:6px;}
.main-logo {max-width:330px;height:auto;filter:drop-shadow(0 0 22px rgba(255,255,255,.32));transition:.4s;}
.main-logo:hover {transform:scale(1.06);filter:drop-shadow(0 0 38px rgba(255,255,255,.55));}
.card {width:100%;max-width:520px;margin:auto;position:relative;z-index:10;}
.title-image-container {display:flex;align-items:center;justify-content:center;gap:14px;height:52px;margin-bottom:26px;}
.title-image {height:100%;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,255,255,.22));transition:.3s;}
.title-image:hover {transform:scale(1.07);}

.status-container {
    display:flex;align-items:center;justify-content:center;gap:11px;padding:11px 26px;border-radius:32px;
    background:rgba(12,12,14,.92);border:1px solid rgba(255,255,255,.14);width:fit-content;margin-inline:auto;
    font-size:16px;font-weight:600;box-shadow:0 5px 16px rgba(0,0,0,.75);animation:borderGlow 4s infinite ease-in-out;
}
.status-dot {width:13px;height:13px;border-radius:50%;box-shadow:0 0 12px currentColor;}
.status-online {background:#23a55a;color:#23a55a;}
.status-idle {background:#f0b232;color:#f0b232;}
.status-dnd {background:#f13f43;color:#f13f43;}
.status-offline {background:#80848e;color:#80848e;}

.avatar {width:165px;height:165px;margin:0 auto 26px;position:relative;cursor:pointer;transition:.4s;}
.avatar:hover {transform:scale(1.07);}
.avatar-img-holder {
    width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.27);background:#000;
    box-shadow:0 0 28px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.08);transition:.35s;position:relative;z-index:2;
}
.avatar:hover .avatar-img-holder {border-color:rgba(255,255,255,.42);box-shadow:0 0 32px rgba(0,0,0,.92),0 0 18px rgba(255,255,255,.18);}
img.avatar-decoration {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)scale(1.06);width:195px;height:195px;pointer-events:none;z-index:1;filter:drop-shadow(0 0 14px rgba(255,255,255,.22));transition:.3s;}
.avatar:hover img.avatar-decoration {filter:drop-shadow(0 0 24px rgba(255,255,255,.38));}

.section-card {
    background:rgba(10,10,12,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.11);border-radius:26px;padding:32px;margin-bottom:26px;
    box-shadow:0 12px 32px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.06);transition:.35s;
}
.section-card:hover {transform:translateY(-4px);border-color:rgba(255,255,255,.2);box-shadow:0 14px 38px rgba(0,0,0,.85);}
.username {display:none;}
.bio {font-size:17px;opacity:.94;line-height:1.65;text-align:center;color:#e8e8e8;letter-spacing:.7px;margin-bottom:34px;min-height:28px;}

.activity-wrapper {margin:22px 0;border-top:1px solid rgba(255,255,255,.09);padding-top:22px;}
.activity-header {font-size:12px;text-transform:uppercase;letter-spacing:2.2px;color:#888;font-weight:600;margin-bottom:14px;}
.activity-card {
    background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;
    display:flex;align-items:center;gap:15px;transition:.3s;
}
.activity-card:hover {border-color:rgba(255,255,255,.22);background:rgba(14,14,14,.8);}
.activity-icon {width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.activity-icon img {width:100%;height:100%;object-fit:cover;}
.activity-info {flex:1;min-width:0;}
.activity-name {font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.activity-details {font-size:13px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.activity-no {color:#777;font-style:italic;padding:14px;text-align:center;font-size:14px;}

.terminal-block {
    margin:20px 0;background:#0a0a0c;border-radius:12px;padding:16px 20px;border:1px solid rgba(0,255,130,.17);
    font-family:monospace;font-size:14px;color:#b8ffb8;box-shadow:inset 0 0 14px rgba(0,255,130,.07);
}
.terminal-prompt {color:#4ecdc4;font-weight:bold;}
.terminal-text {color:#ddd;}

.socials {display:flex;justify-content:center;gap:26px;margin-bottom:14px;}
.social {
    width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);
    text-decoration:none;transition:.35s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.social:hover {transform:translateY(-7px)scale(1.13);background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.24);box-shadow:0 0 22px rgba(255,255,255,.22);}
.social svg {width:31px;height:31px;fill:#fff;transition:.3s;}

/* 🎵 — PINAGANDANG MUSIC PLAYER */
.music-container {
    background:rgba(0,0,0,.9);border-radius:20px;padding:22px;border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:.35s;
}
.music-header {display:flex;align-items:center;gap:18px;margin-bottom:16px;}
.music-album-art {
    width:66px;height:66px;border-radius:50%;overflow:hidden;position:relative;
    border:2px solid rgba(255,255,255,.17);box-shadow:0 0 18px rgba(0,0,0,.9);animation:rotateAlbum 12s linear infinite;transition:.3s;
}
@keyframes rotateAlbum {to{transform:rotate(360deg);}}
.music-album-art.spotify::after {
    content:"";position:absolute;bottom:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:#1DB954;
    background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.49 14.41c-.28.42-.85.55-1.27.27-3.49-2.14-7.89-2.62-11.66-1.43-.46.15-.95-.12-1.1-.58-.15-.46.12-.95.58-1.1 4.24-1.31 9.11-.75 12.57 1.47.42.28.55.85.27 1.27zm2.82-5.28c-.35.54-1.07.71-1.61.36-4.01-2.46-10.11-3.18-14.84-1.74-.62.19-1.29-.16-1.48-.78-.19-.62.16-1.29.78-1.48 5.39-1.64 12.09-.85 16.66 1.95.54.35.71 1.07.36 1.61zm.24-5.59c-.51.69-1.49.87-2.18.36-5.01-3.07-13.26-3.34-18.02-1.84-.75.24-1.55-.2-1.79-.95-.24-.75.2-1.55.95-1.79 5.44-1.7 14.53-1.38 20.15 2.07.69.51.87 1.49.36 2.18z"/%3E%3C/svg%3E');
    background-size:15px; background-position:center; background-repeat:no-repeat; box-shadow:0 0 10px rgba(0,0,0,.7);
}
.music-album-art:hover {border-color:rgba(255,255,255,.28);box-shadow:0 0 22px rgba(0,0,0,1);}
.music-info {flex:1;min-width:0;}
.music-title {font-size:18px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:5px;}
.music-artist {font-size:14px;color:#ccc;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.music-play-button {width:46px;height:46px;border-radius:50%;border:none;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s;box-shadow:0 4px 14px rgba(0,0,0,.7);}
.music-play-button:hover {transform:scale(1.18);background:#f8f8f8;box-shadow:0 0 22px rgba(255,255,255,.32);}
.music-play-button svg {width:21px;height:21px;fill:#000;margin-left:2px;}
.music-progress-container {width:100%;height:7px;background:rgba(255,255,255,.14);border-radius:4px;margin-top:14px;position:relative;cursor:pointer;transition:.25s;}
.music-progress-container:hover {background:rgba(255,255,255,.22);}
.music-progress-bar {height:100%;background:linear-gradient(90deg,#1DB954,#1ed760);border-radius:4px;transition:.15s linear;box-shadow:0 0 12px rgba(29,185,84,.35);position:relative;}
.music-progress-bar::after {content:"";position:absolute;right:0;top:50%;transform:translate(50%,-50%);width:13px;height:13px;border-radius:50%;background:#1DB954;box-shadow:0 0 18px rgba(29,185,84,.65);opacity:0;transition:.25s;}
.music-progress-container:hover .music-progress-bar::after {opacity:1;}
.music-time {display:flex;justify-content:space-between;font-size:12px;color:#999;margin-top:10px;}
.views-pill {
    display:inline-block;padding:8px 30px;border-radius:32px;font-size:14px;font-weight:500;letter-spacing:1.2px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);color:#ddd;margin-top:12px;transition:.3s;
}
.views-pill:hover {background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);}

/* 📌 — TAMANG LAKI NG POPUP: 340px ✅ */
.profile-popup {
    position:absolute;bottom:115%;left:50%;transform:translateX(-50%)translateY(10px);margin-bottom:22px;
    width:340px;padding:26px 24px;border-radius:16px;
    background:rgba(16,16,18,.96);border:1px solid rgba(255,255,255,.14);
    box-shadow:0 12px 32px rgba(0,0,0,.96),inset 0 0 0 1px rgba(255,255,255,.07);
    z-index:9999;opacity:0;visibility:hidden;transition:.3s ease;pointer-events:none;
}
.avatar:hover .profile-popup {opacity:1;visibility:visible;transform:translateX(-50%)translateY(0);}
.popup-header {display:flex;align-items:center;gap:18px;}
.popup-avatar-wrapper {position:relative;width:56px;height:56px;flex-shrink:0;}
.popup-avatar {width:100%;height:100%;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.13);position:relative;z-index:2;}
.popup-decoration {position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)scale(1.08);width:68px;height:68px;pointer-events:none;z-index:1;}
.popup-info {flex:1;overflow:hidden;}
.popup-nickname {font-size:18px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.popup-name {font-size:14px;color:#aaa;margin:4px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.popup-status {font-size:13px;color:#999;display:flex;align-items:center;gap:8px;}
.popup-status .status-dot {width:11px;height:11px;}
.popup-activity {font-size:12px;color:#bbb;background:#141416;padding:7px 12px;border-radius:10px;margin-top:10px;border:1px solid rgba(255,255,255,.09);}

@media (max-width:480px) {
    body {padding:100px 16px 32px;}
    #typewriter-name {font-size:23px;letter-spacing:1px;}
    .loading-main-text {font-size:38px;letter-spacing:14px;}
    .loading-sub-text {font-size:13px;letter-spacing:4px;}
    .loading-content {padding:34px 44px;}
    .loading-avatar, .avatar {width:120px;height:120px;}
    img.avatar-decoration {width:170px;height:170px;}
    .section-card {padding:26px;}
    .profile-popup {width:300px;}
    .social {width:62px;height:62px;}
    .social svg {width:27px;height:27px;}
}
</style>

<script>
const audio = document.getElementById("bgMusic"); audio.volume = 0.5;
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key))||(e.ctrlKey&&['u','s'].includes(e.key)))e.preventDefault();});

function updateViews(){let c=+localStorage.getItem('page_views')||5671;c++;localStorage.setItem('page_views',c);document.getElementById('viewsCount').textContent=`Views: ${c}`;}
updateViews();

const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;
const DEF = {title:"CHILL OUT",artist:"HYU1 — CHILL OUT",art:"leonaise.webp",dur:151000};

let isPlaying=true,curTime=0,totalTime=DEF.dur,timer;
const playBtn=document.getElementById('playPauseBtn'),playI=document.getElementById('playIcon'),pauseI=document.getElementById('pauseIcon'),progBar=document.getElementById('musicProgressBar'),progArea=document.getElementById('progressClickArea'),curT=document.getElementById('musicTimeCurrent'),totT=document.getElementById('musicTimeTotal');

progArea.addEventListener('click',e=>{const r=progArea.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));curTime=p*totalTime;audio.currentTime=curTime/1000;updProg();});
playBtn.addEventListener('click',()=>{if(isPlaying){audio.pause();clearInterval(timer);playI.style.display='block';pauseI.style.display='none';}else{audio.play().catch(()=>{});startTimer();playI.style.display='none';pauseI.style.display='block';}isPlaying=!isPlaying;});

function fmt(ms){if(!ms||ms<0)return"0:00";const s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60;return`${m}:${ss<10?'0':''}${ss}`;}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!isNaN(audio.duration)&&audio.duration>0)totalTime=audio.duration*1000;curTime=audio.currentTime*1000;updProg();},1000);}
function updProg(){progBar.style.width=totalTime>0?`${(curTime/totalTime)*100}%`:'0%';curT.textContent=fmt(curTime);totT.textContent=fmt(totalTime);}

async function fetchData(){
    try{
        const res=await fetch(API_URL,{cache:"no-store"});
        const json=await res.json();
        if(!json.success)throw"fail";
        const d=json.data;

        const avatarUrl=d.discord_user.avatar?`https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`:'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        document.getElementById('avatarImg').src=avatarUrl;document.getElementById('popupAvatarImg').src=avatarUrl;

        const decoEl=document.getElementById('decoImg'),popDeco=document.getElementById('popupDeco');
        if(d.discord_user.avatar_decoration_data){const u=`https://cdn.discordapp.com/avatar-decoration-presets/${d.discord_user.avatarUrl = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
        } else {
            avatarUrl = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        }
        avatarEl.src = avatarUrl;
        popupAvatarEl.src = avatarUrl;

        const decoEl = document.getElementById('decoImg');
        const popupDecoEl = document.getElementById('popupDeco');
        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            const decoUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.src = decoUrl;
            decoEl.style.display = 'block';
            popupDecoEl.src = decoUrl;
            popupDecoEl.style.display = 'block';
        } else {
            decoEl.style.display = 'none';
            popupDecoEl.style.display = 'none';
        }

        const nickname = d.discord_user.global_name || "Leon";
        const username = d.discord_user.username || "wtf.leon";
        document.getElementById('popupNickname').innerText = nickname;
        document.getElementById('popupUsername').innerText = `@${username}`;

        const noteEl = document.getElementById('noteText');
        const customStatus = d.activities?.find(a => a.type === 4);
        let statusText = "PA KISS NGA";
        if (customStatus?.state) {
            statusText = customStatus.state;
        }
        noteEl.innerText = statusText;

        const statusDot = document.getElementById('statusDot');
        const statusTextEl = document.getElementById('statusText');
        const popupStatusDot = document.getElementById('popupStatusDot');
        const popupStatusText = document.getElementById('popupStatusText');
        
        statusDot.className = "status-dot";
        popupStatusDot.className = "status-dot";

        let statusString = "";
        let statusClass = "";

        switch(d.discord_status) {
            case 'online':
                statusClass = 'status-online';
                statusString = 'Online';
                break;
            case 'idle':
                statusClass = 'status-idle';
                statusString = 'Idle';
                break;
            case 'dnd':
                statusClass = 'status-dnd';
                statusString = 'Do Not Disturb';
                break;
            default:
                statusClass = 'status-offline';
                statusString = 'Offline / Invisible';
        }

        statusDot.classList.add(statusClass);
        statusTextEl.innerText = statusString;
        popupStatusDot.classList.add(statusClass);
        popupStatusText.innerText = statusString;

        const activityEl = document.getElementById('popupActivity');
        const activity = d.activities?.find(a => a.type === 0 || a.type === 2 || a.type === 3);
        if (activity) {
            if (activity.type === 0) activityEl.innerText = `Playing: ${activity.name}`;
            if (activity.type === 2) activityEl.innerText = `Listening: ${activity.name}`;
            if (activity.type === 3) activityEl.innerText = `Watching: ${activity.name}`;
        } else {
            activityEl.innerText = "No Activity";
        }

        const titleEl = document.getElementById('musicTitle');
        const artistEl = document.getElementById('musicArtist');
        const artEl = document.getElementById('musicAlbumArt');

        if (d.spotify?.track_id) {
            titleEl.innerText = d.spotify.song || "Unknown Track";
            artistEl.innerText = d.spotify.artist || "Unknown Artist";
            artEl.src = d.spotify.album_art_url || defaultArt;
            
            const start = d.spotify.timestamps?.start || 0;
            const end = d.spotify.timestamps?.end || 0;
            
            if (end > start) {
                totalTime = end - start;
                currentTime = Math.min(Date.now() - start, totalTime);
                timeTotalEl.innerText = formatTime(totalTime);
                updateProgressUI();
            }

        } else {
            titleEl.innerText = defaultTitle;
            artistEl.innerText = defaultArtist;
            artEl.src = defaultArt;
            totalTime = defaultDuration;
            timeTotalEl.innerText = formatTime(defaultDuration);
            updateProgressUI();
        }

    } catch (err) {
        console.error("API Fetch Error:", err);
        document.getElementById('statusText').innerText = 'Error';
    }
}

fetchData();
setInterval(fetchData, 5000);

startProgressTimer();
