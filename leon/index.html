<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.78)),url("../members/founder/leon.gif");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
color:white;
overflow:hidden;
}

body::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
background-size:8px 8px;
z-index:1;
}

/* 🎯 INTERACTIVE LOADING SCREEN OVERLAY */
#loading-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #090909;
z-index: 9999999; /* Tinitiyak na nasa pinaka-ibabaw bago i-click */
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
font-size: 28px;
font-weight: 600;
letter-spacing: 8px;
color: #ffffff;
text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
animation: pulse 1.5s infinite alternate;
text-transform: uppercase;
}

@keyframes pulse {
0% { opacity: 0.3; transform: scale(0.98); }
100% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
}

.card{
position:relative;
z-index:2;
text-align:center;
padding:40px;
width:320px;
backdrop-filter:blur(14px);
background:rgba(0,0,0,.28);
border-radius:25px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 35px rgba(0,0,0,.45);
}

/* 🎯 NEW: CSS PARA SA WEBP LOGO MO */
.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    width: 100%;
}

.main-logo {
    max-width: 80px; /* Saktong sukat para hindi dambuhala sa card */
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)); /* May swabeng glow effect */
}

.title{
font-size:20px;
letter-spacing:4px;
margin-bottom:25px;
}

/* 🎯 FIXED AVATAR CONTAINER: Overflow visible para lumawit ang decoration sa labas ng bilog */
.avatar{
position: relative;
width:110px;
height:110px;
margin:auto;
margin-bottom:15px;
overflow: visible !important;
}

/* 🎯 INNER IMAGE HOLDER: Dito nakakulong ang pfp mo */
.avatar-img-holder {
width: 100%;
height: 100%;
border-radius:50%;
overflow: hidden;
border:3px solid rgba(255,255,255,.18);
background: #000;
}

.avatar-img-holder img{
width:100%;
height:100%;
object-fit:cover;
}

/* 🎯 PERFECTLY CENTERED AVATAR DECORATION */
img.avatar-decoration {
position: absolute !important;
top: 50% !important;
left: 50% !important;
transform: translate(-50%, -50%) !important;
width: 135px !important; /* Optimal na lapat para yakap ang 110px na pfp mo */
height: 135px !important;
pointer-events: none !important;
z-index: 9999 !important; 
display: block !important;
border-radius: 0 !important;
}

.username{
font-size:22px;
font-weight:600;
margin-bottom:5px;
}

.bio{
opacity:.75;
font-size:13px;
margin-bottom:25px;
}

.socials{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:20px;
}

.social{
width:48px;
height:48px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(255,255,255,.08);
text-decoration:none;
font-size:18px;
color:white;
transition:.3s;
}

.social:hover{
transform:translateY(-4px);
background:rgba(255,255,255,.18);
}

.social svg {
width:24px;
height:24px;
fill:white;
}

.music{
display:block;
padding:14px;
border-radius:15px;
background:rgba(0,0,0,.45);
font-size:13px;
color:white;
text-decoration:none;
transition:.3s;
}

.music:hover{
transform:scale(1.05);
background:rgba(255,255,255,.12);
}
</style>
</head>
<body oncontextmenu="return false;">

<div id="loading-overlay">
    <div class="click-text">CLICK</div>
</div>

<div class="card">
<div class="logo-img-container">
    <img src="logo.webp" alt="Leon Logo" class="main-logo" onerror="this.src='https://i.imgur.com/w1A2v2A.png';">
</div>

<div class="title">@Leon</div>

<div class="avatar">
    <div class="avatar-img-holder">
        <img src="../members/founder/user1.jpg" alt="Leon Avatar">
    </div>
    <img src="https://cdn.discordapp.com/avatar-decoration-presets/a_3c97a2d37f433a7913a1c7b7a735d000.png?size=160" class="avatar-decoration" onerror="this.style.opacity='0'">
</div>

<div class="username">@wtf.leon</div>
<div class="bio">tara sleep call</div>

<div class="socials">
<a class="social" href="https://discord.gg/CwsGFu6D" target="_blank">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
<path d="M20.317 4.92c-1.167-.977-2.387-1.785-3.653-2.42a.44.44 0 0 0-.234-.075 10.3 10.3 0 0 0-1.336.557 14.3 14.3 0 0 0-3.864 1.125 14.5 14.5 0 0 0-3.944-1.125 10.4 10.4 0 0 0-1.34-.557.43.43 0 0 0-.233.075c-1.266.635-2.486 1.443-3.653 2.42a.41.41 0 0 0-.067.417c.397 1.23 1.043 2.387 1.917 3.443a.41.41 0 0 0 .443.137c1.03-.38 2.07-.667 3.13-.857a.41.41 0 0 0 .267-.303 9.5 9.5 0 0 1-.107-1.143.41.41 0 0 1 .41-.41h.07a8.3 8.3 0 0 1 2.77.997.41.41 0 0 0 .443 0 8.3 8.3 0 0 1 2.77-.997h.07a.41.41 0 0 1 .41.41c0 .38-.037.76-.107 1.143a.41.41 0 0 0 .267.303c1.06.19 2.1.477 3.13.857a.41.41 0 0 0 .443-.137c.874-1.056 1.52-2.213 1.917-3.443a.41.41 0 0 0-.067-.417zM8.02 14.763c-1.19 0-2.16-1.07-2.16-2.387 0-1.317.953-2.387 2.16-2.387 1.206 0 2.173 1.07 2.16 2.387.013 1.317-.954 2.387-2.16 2.387zm7.96 0c-1.19 0-2.16-1.07-2.16-2.387 0-1.317.953-2.387 2.16-2.387 1.206 0 2.173 1.07 2.16 2.387.013 1.317-.954 2.387-2.16 2.387z"/>
</svg>
</a>
</div>

<a class="music" href="https://open.spotify.com/track/7GmUJDvP0KBIx9KsYiMjHD?si=c24145eff0c14681" target="_blank">🎵 5 Mil</a>
</div>

<audio id="bgMusic" autoplay loop>
<source src="../5-mil_2RPY2b9n.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

// 🎯 LOADING OVERLAY CLICK: Pinapatugtog ang music sabay fade-out ng loading panel
const overlay = document.getElementById("loading-overlay");
overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => {
        overlay.style.visibility = "hidden";
    }, 800);
});

// 🔒 HIGH-LEVEL SECURITY LOCKDOWN (Anti-Right Click & Anti-Source Code)
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
    ) {
        e.preventDefault();
        return false;
    }
});

// Patuloy na loop debugger para i-freeze ang browser dev tools kung piliting i-bypass
setInterval(function() {
    (function() {
        return false;
    }['constructor']('debugger')['call']());
}, 50);
</script>

</body>
</html>
