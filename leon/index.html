<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon | PUBLIC AZURA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background:
        linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.78)),
        url("../members/founder/leon.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    overflow-y: auto;
    padding: 130px 20px 40px;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 8px 8px, 200px 200px;
    z-index: 1;
    pointer-events: none;
}

@keyframes borderGlow {
    0% { box-shadow: 0 0 5px rgba(255,255,255,0.15), 0 0 10px rgba(255,255,255,0.1); }
    50% { box-shadow: 0 0 12px rgba(255,255,0.25), 0 0 20px rgba(255,255,255,0.15); }
    100% { box-shadow: 0 0 5px rgba(255,255,0.15), 0 0 10px rgba(255,255,0.1); }
}

/* Typewriter Animation */
@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}
@keyframes blink {
    50% { border-color: transparent; }
}
@keyframes hideCursor {
    to { border-right: none; }
}

#typewriter-name {
    font-family: 'Poppins', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    margin-bottom: 16px;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid #ffffff;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    animation: 
        typing 2.5s steps(9, end) forwards,
        blink 0.8s infinite 2.5s,
        hideCursor 0.1s forwards 4s;
}

/* 🚀 LOADING SCREEN */
#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #0a0a0f 0%, #000000 100%);
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.9s cubic-bezier(0.19, 1, 0.22, 1);
    overflow: hidden;
}

#loading-overlay::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: bgFloat 8s linear infinite;
    opacity: 0.6;
}
@keyframes bgFloat {
    0% { transform: translate(0,0); }
    100% { transform: translate(30px,30px); }
}

#loading-overlay::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ffffff, #ff2266, #00eeff, transparent);
    box-shadow: 0 0 25px #ffffff, 0 0 50px #ff226660, 0 0 70px #00eeff40;
    animation: scanLine 2.2s linear infinite;
    opacity: 0.95;
}
@keyframes scanLine {
    0% { transform: translateY(-200%); }
    100% { transform: translateY(700%); }
}

.crt-noise {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 2px
    );
    animation: scanLines 4s linear infinite;
    opacity: 0.35;
    pointer-events: none;
}
@keyframes scanLines {
    from { transform: translateY(0); }
    to { transform: translateY(100vh); }
}

.loading-content {
    position: relative;
    text-align: center;
    padding: 60px 90px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(5,5,5,0.65);
    border-radius: 20px;
    box-shadow: 
        0 0 60px rgba(255,255,255,0.12),
        inset 0 0 80px rgba(0,0,0,0.95);
    animation: borderPulse 2.8s ease-in-out infinite;
    overflow: hidden;
}

@keyframes borderPulse {
    0%, 100% { 
        border-color: rgba(255,255,255,0.1); 
        box-shadow: 0 0 30px rgba(255,255,255,0.08); 
    }
    50% { 
        border-color: rgba(255,255,255,0.35); 
        box-shadow: 0 0 70px rgba(255,255,255,0.22); 
    }
}

.loading-avatar {
    width: 140px;
    height: 140px;
    margin: 0 auto 30px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.2);
    position: relative;
    animation: floatRock 3s ease-in-out infinite alternate;
    box-shadow: 0 0 30px rgba(255,255,255,0.15);
}
.loading-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: slowSpin 12s linear infinite;
}
@keyframes floatRock {
    from { transform: translateY(-8px) rotate(-1deg); }
    to { transform: translateY(8px) rotate(1deg); }
}
@keyframes slowSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.loading-main-text {
    font-family: 'Oswald', sans-serif;
    font-size: 62px;
    font-weight: 800;
    letter-spacing: 24px;
    color: #ffffff;
    text-transform: uppercase;
    animation: textGlow 2s ease-in-out infinite alternate, glitchEffect 5.2s infinite;
}
@keyframes textGlow {
    from { text-shadow: 0 0 15px #ffffff, 0 0 30px #ffffff40, 0 0 45px #ff226620; }
    to { text-shadow: 0 0 25px #ffffff, 0 0 50px #ffffff80, 0 0 70px #00eeff50; }
}
@keyframes glitchEffect {
    0% { transform: translate(0); }
    2% { transform: translate(-4px, 2px); text-shadow: 2px 0 15px #ff2266, -2px 0 15px #00eeff; }
    4% { transform: translate(4px, -2px); text-shadow: -2px 0 15px #ff2266, 2px 0 15px #00eeff; }
    6% { transform: translate(0); text-shadow: 0 0 20px #ffffff; }
    8% { transform: translate(-2px, -1px); }
    10% { transform: translate(0); }
}

.loading-sub-text {
    margin-top: 28px;
    font-size: 17px;
    letter-spacing: 6px;
    color: #cccccc;
    opacity: 0.8;
    animation: subPulse 2s infinite alternate;
}
@keyframes subPulse {
    0% { opacity: 0.4; letter-spacing: 4px; }
    100% { opacity: 1; letter-spacing: 6px; }
}

.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 40px;
    padding: 15px;
    margin-top: 5px;
}
.main-logo {
    max-width: 320px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
    transition: all 0.4s ease;
}
.main-logo:hover { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(255,255,255,0.5)); }

.card { width: 100%; max-width: 520px; margin: auto; position: relative; z-index: 10; }

.title-image-container {
    margin-bottom: 25px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}
.title-image {
    height: 100%;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    transition: transform 0.3s ease;
}
.title-image:hover { transform: scale(1.05); }

.status-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    font-size: 16px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 30px;
    background: rgba(12, 12, 12, 0.9);
    border: 1px solid rgba(255,255,255,0.12);
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    animation: borderGlow 4s infinite ease-in-out;
}
.status-dot { width:12px; height:12px; border-radius:50%; display:inline-block; box-shadow:0 0 10px currentColor; }
.status-online { background:#23a55a; color:#23a55a; }
.status-idle { background:#f0b232; color:#f0b232; }
.status-dnd { background:#f13f43; color:#f13f43; }
.status-offline { background:#80848e; color:#80848e; }

.avatar {
    position: relative;
    width:160px; height:160px;
    margin:0 auto 25px;
    cursor:pointer; z-index:100;
    transition:transform 0.4s ease;
}
.avatar:hover { transform:scale(1.06); }

.avatar-img-holder {
    width:100%; height:100%; border-radius:50%; overflow:hidden;
    border:3px solid rgba(255,255,255,0.25); background:#000;
    position:relative; z-index:2;
    box-shadow:0 0 25px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
    transition:all 0.3s ease;
}
.avatar:hover .avatar-img-holder {
    border-color:rgba(255,255,255,0.4);
    box-shadow:0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(255,255,255,0.15);
}
.avatar-img-holder img { width:100%; height:100%; object-fit:cover; }

img.avatar-decoration {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(1.05);
    width:190px; height:190px; pointer-events:none; z-index:1;
    background:transparent; border-radius:0;
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.2));
    transition:filter 0.3s ease;
}
.avatar:hover img.avatar-decoration { filter:drop-shadow(0 0 20px rgba(255,255,255,0.35)); }

.section-card {
    background:rgba(10,10,10,0.75);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.1); border-radius:24px;
    padding:30px; margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.05);
    transition:all 0.35s ease;
}
.section-card:hover {
    transform:translateY(-3px); border-color:rgba(255,255,255,0.18);
    box-shadow:0 12px 35px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
}

.username { display:none; }
.bio {
    opacity:0.92; font-size:17px; margin-bottom:32px; min-height:26px;
    line-height:1.6; text-align:center; color:#e5e5e5;
    letter-spacing:0.6px; font-weight:400;
}

/* ✅ ACTIVITY BOX — NGAYON KASAMA NA ANG SPOTIFY DITO */
.activity-wrapper {
    margin:20px 0; border-top:1px solid rgba(255,255,255,0.08); padding-top:20px;
}
.activity-header {
    font-size:12px; text-transform:uppercase; letter-spacing:2px;
    color:#888; margin-bottom:12px; font-weight:600;
}
.activity-card {
    background:rgba(0,0,0,0.7); border-radius:14px; padding:16px;
    border:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; gap:14px;
    transition:all 0.3s ease;
}
.activity-card:hover { border-color:rgba(255,255,255,0.2); background:rgba(15,15,15,0.8); }
.activity-icon {
    width:48px; height:48px; border-radius:10px; background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; font-size:22px;
}
.activity-icon img { width:100%; height:100%; object-fit:cover; }
.activity-info { flex:1; min-width:0; }
.activity-name { font-size:15px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.activity-details { font-size:13px; color:#aaa; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.activity-progress { width:100%; height:5px; background:rgba(255,255,255,0.15); border-radius:3px; margin-top:10px; overflow:hidden; }
.activity-progress-fill { height:100%; background:linear-gradient(90deg,#1DB954,#1ed760); border-radius:3px; transition:width 0.2s linear; }
.activity-no { color:#777; font-style:italic; padding:12px; text-align:center; font-size:14px; }

/* TERMINAL */
.terminal-block {
    margin:18px 0; background:#0b0b0b; border-radius:10px;
    padding:14px 18px; border:1px solid rgba(0,255,120,0.15);
    font-family:monospace; font-size:14px; color:#b5f9b5;
    box-shadow:inset 0 0 12px rgba(0,255,120,0.06);
}
.terminal-prompt { color:#4ecdc4; font-weight:bold; }
.terminal-text { color:#ddd; }

.socials { display:flex; justify-content:center; gap:24px; margin-bottom:12px; }
.social {
    width:66px; height:66px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
    text-decoration:none; transition:all 0.35s ease; cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);
}
.social:hover {
    transform:translateY(-6px) scale(1.12); background:rgba(255,255,255,0.16);
    border-color:rgba(255,255,255,0.22); box-shadow:0 0 20px rgba(255,255,255,0.2);
}
.social svg { width:30px; height:30px; fill:#ffffff; opacity:0.95; transition:fill 0.3s ease; }
.social:hover svg { fill:#f0f0f0; }

/* POPUP TOOLTIP — NASAAN DIN LALABAS ANG SPOTIFY */
.profile-popup {
    position:absolute; bottom:115%; left:50%; transform:translateX(-50%);
    margin-bottom:20px; width:400px; background:rgba(0,0,0,0.94);
    border:1px solid rgba(255,255,255,0.15); border-radius:14px; padding:20px;
    box-shadow:0 10px 35px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.08);
    z-index:9999; opacity:0; visibility:hidden;
    transition:opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
    pointer-events:none; transform:translateX(-50%) translateY(10px);
}
.avatar:hover .profile-popup { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }

.popup-header { display:flex; align-items:center; gap:16px; }
.popup-avatar-wrapper { position:relative; width:52px; height:52px; flex-shrink:0; }
.popup-avatar { width:100%; height:100%; border-radius:50%; overflow:hidden; border:1px solid rgba(255,255,255,0.12); position:relative; z-index:2; }
.popup-avatar img { width:100%; height:100%; object-fit:cover; }
.popup-decoration { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(1.08); width:66px; height:66px; pointer-events:none; z-index:1; display:block; }
.popup-info { text-align:left; flex:1; overflow:hidden; }
.popup-nickname { font-size:18px; font-weight:600; color:#ffffff; display:block; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.popup-name { font-size:14px; font-weight:400; color:#aaaaaa; display:block; line-height:1.4; margin:3px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.popup-status { font-size:13px; color:#999; display:flex; align-items:center; gap:7px; line-height:1; }
.popup-status .status-dot { width:11px; height:11px; }
.popup-activity { font-size:12px; color:#bbbbbb; background:#121212; padding:6px 10px; border-radius:8px; margin-top:8px; border:1px solid rgba(255,255,255,0.08); }

/* RESPONSIVE */
@media (max-width:480px) {
    body { padding:100px 15px 30px; }
    #typewriter-name { font-size:22px; letter-spacing:1px; }
    .loading-main-text { font-size:36px; letter-spacing:12px; }
    .loading-sub-text { font-size:13px; letter-spacing:3px; }
    .loading-content { padding:30px 40px; }
    .loading-avatar { width:110px; height:110px; }
    .avatar { width:140px; height:140px; }
    img.avatar-decoration { width:165px; height:165px; }
    .section-card { padding:24px; }
    .profile-popup { width:330px; }
    .social { width:60px; height:60px; }
    .social svg { width:26px; height:26px; }
}
</style>
</head>

<!-- ✅ INAYOS NA JS: SPOTIFY + LAHAT NG AKTIBIDAD → PUMAPUNTA SA TAMANG LUGAR -->
<script>
// ⚙️ PALITAN MO ITO NG TAMANG API ENDPOINT MO
const API_URL = "https://api.lanyard.rest/v1/users/1250654354344775703";

// STATUS CLASS MAPPING
function getStatusClass(status) {
    switch(status?.toLowerCase()){
        case 'online': return 'status-online';
        case 'idle': return 'status-idle';
        case 'dnd': case 'do_not_disturb': return 'status-dnd';
        default: return 'status-offline';
    }
}

// 🔄 MAIN FETCH FUNCTION — TAMANG PAGHIWALAY NG SPOTIFY VS IBA PANG AKTIBIDAD
async function fetchData() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if(!data) return;

        // 🟢 UPDATE STATUS
        const status = data.discord_status || 'offline';
        const statusClass = getStatusClass(status);
        document.getElementById('statusDot').className = `status-dot ${statusClass}`;
        document.getElementById('statusText').textContent = status.charAt(0).toUpperCase() + status.slice(1);
        document.getElementById('popupStatusDot').className = `status-dot ${statusClass}`;
        document.getElementById('popupStatusText').textContent = status.charAt(0).toUpperCase() + status.slice(1);

        // 🖼️ AVATAR & DECORATION
        if(data.avatar) {
            document.getElementById('avatarImg').src = `https://cdn.discordapp.com/avatars/${data.user_id}/${data.avatar}.png?size=256`;
            document.getElementById('popupAvatarImg').src = `https://cdn.discordapp.com/avatars/${data.user_id}/${data.avatar}.png?size=128`;
        }
        if(data.decoration) {
            document.getElementById('decoImg').src = data.decoration;
            document.getElementById('popupDeco').src = data.decoration;
        }

        // 🎵 SPOTIFY DATA — ITINUTURONG NGAYON SA ACTIVITY BOX DIRECTLY
        const spotify = data.spotify;
        const otherActivities = (data.activities || []).filter(act => act.type !== 2); // ✅ TANGGALIN DUPLICATE SPOTIFY

        // 📌 PRIORITY RULE: SPOTIFY > IBANG AKTIBIDAD > WALANG GINAGAWA
        let mainActivity = null;
        if(spotify) {
            mainActivity = {
                isSpotify: true,
                name: "Listening to Spotify",
                details: spotify.song,
                state: spotify.artist,
                icon: spotify.album_art_url || "https://cdn-icons-png.flaticon.com/512/2111/2111624.png",
                start: spotify.start_timestamp,
                end: spotify.end_timestamp
            };
        } else if(otherActivities.length > 0) {
            mainActivity = {...otherActivities[0], isSpotify: false};
        }

        // 📥 ILAGAY SA CURRENT ACTIVITY BOX
        const actContainer = document.getElementById('activityContainer');
        const popupAct = document.getElementById('popupActivity');

        if(mainActivity) {
            // ✅ HTML CONTENT SA ACTIVITY BOX
            let progressHTML = "";
            if(mainActivity.isSpotify && mainActivity.start && mainActivity.end) {
                const now = Date.now();
                const total = mainActivity.end - mainActivity.start;
                const elapsed = Math.max(0, now - mainActivity.start);
                const pct = Math.min(100, Math.round((elapsed / total) * 100));
                progressHTML = `<div class="activity-progress"><div class="activity-progress-fill" style="width:${pct}%"></div></div>`;
            }

            actContainer.innerHTML = `
                <div class="activity-icon"><img src="${mainActivity.icon}" alt="Activity Icon"></div>
                <div class="activity-info">
                    <div class="activity-name">${mainActivity.name || "Unknown Activity"}</div>
                    <div class="activity-details">${mainActivity.details || ""}${mainActivity.state ? ` • ${mainActivity.state}` : ""}</div>
                    ${progressHTML}
                </div>
            `;

            // ✅ ILAGAY DIN SA POPUP BOX
            popupAct.textContent = `${mainActivity.name || "Activity"}: ${mainActivity.details || ""} ${mainActivity.state ? `| ${mainActivity.state}` : ""}`;
        } else {
            actContainer.innerHTML = `<div class="activity-no">Waiting for activity...</div>`;
            popupAct.textContent = "No Activity";
        }

    } catch(err) {
        console.error("Fetch Error:", err);
        document.getElementById('activityContainer').innerHTML = `<div class="activity-no">Failed to load</div>`;
    }
}

// ⏱️ AUTO REFRESH EVERY 3 SECONDS
fetchData();
setInterval(fetchData, 3000);
</script>
