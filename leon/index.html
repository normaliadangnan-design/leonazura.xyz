<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon | PUBLIC AZURA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background:
        linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.78)),
        url("../members/founder/leon.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #ffffff;
    overflow-y: auto;
    padding: 100px 20px 40px;
    position: relative;
}

/* ✅ Enhanced Grid Overlay + Subtle Grain */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 8px 8px, 200px 200px;
    z-index: 1;
    pointer-events: none;
}

/* ✅ Glowing Border Animation */
@keyframes borderGlow {
    0% { box-shadow: 0 0 5px rgba(255,255,255,0.15), 0 0 10px rgba(255,255,255,0.1); }
    50% { box-shadow: 0 0 12px rgba(255,255,255,0.25), 0 0 20px rgba(255,255,255,0.15); }
    100% { box-shadow: 0 0 5px rgba(255,255,255,0.15), 0 0 10px rgba(255,255,255,0.1); }
}

/* ✅ Loading Screen */
#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
    font-family: 'Oswald', sans-serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 12px;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    animation: pulse 2s infinite alternate;
    text-transform: uppercase;
}

@keyframes pulse {
    0% { opacity: 0.3; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1.08); }
}

/* ✅ Main Container */
.card {
    width: 100%;
    max-width: 520px;
    margin: auto;
    position: relative;
    z-index: 10;
}

/* ✅ Logo */
.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
    padding: 15px;
}

.main-logo {
    max-width: 280px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 18px rgba(255,255,255,0.25));
    transition: filter 0.3s ease;
}
.main-logo:hover {
    filter: drop-shadow(0 0 25px rgba(255,255,255,0.4));
}

/* ✅ Title Row */
.title-image-container {
    margin-bottom: 25px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.title-image {
    height: 100%;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    transition: transform 0.3s ease;
}
.title-image:hover {
    transform: scale(1.05);
}

/* ✅ Status Badge - Improved */
.status-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    font-size: 16px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 30px;
    background: rgba(12, 12, 12, 0.9);
    border: 1px solid rgba(255,255,255,0.12);
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    transition: all 0.3s ease;
    animation: borderGlow 4s infinite ease-in-out;
}

.status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 10px currentColor;
}
.status-online { background-color: #23a55a; color: #23a55a; }
.status-idle { background-color: #f0b232; color: #f0b232; }
.status-dnd { background-color: #f13f43; color: #f13f43; }
.status-offline { background-color: #80848e; color: #80848e; }

/* ✅ Avatar Section - More Dynamic */
.avatar {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 25px;
    cursor: pointer;
    z-index: 100;
    transition: transform 0.4s ease;
}
.avatar:hover {
    transform: scale(1.06);
}

.avatar-img-holder {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.25);
    background: #000;
    position: relative;
    z-index: 2;
    box-shadow: 0 0 25px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
    transition: all 0.3s ease;
}
.avatar:hover .avatar-img-holder {
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(255,255,255,0.15);
}

.avatar-img-holder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

img.avatar-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.05);
    width: 190px;
    height: 190px;
    pointer-events: none;
    z-index: 1;
    display: block;
    border-radius: 0;
    background: transparent;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));
    transition: filter 0.3s ease;
}
.avatar:hover img.avatar-decoration {
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.35));
}

/* ✅ Card Sections - Better Glassmorphism */
.section-card {
    background: rgba(10, 10, 10, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.05);
    transition: all 0.35s ease;
}
.section-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255,255,255,0.18);
    box-shadow: 0 12px 35px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
}

.username {
    display: none;
}

.bio {
    opacity: 0.92;
    font-size: 17px;
    margin-bottom: 32px;
    min-height: 26px;
    line-height: 1.6;
    text-align: center;
    color: #e5e5e5;
    letter-spacing: 0.6px;
    font-weight: 400;
}

/* ✅ Social Icons - More Stylish */
.socials {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 12px;
}

.social {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    text-decoration: none;
    transition: all 0.35s ease;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
}

.social:hover {
    transform: translateY(-6px) scale(1.12);
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.22);
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.social svg {
    width: 30px;
    height: 30px;
    fill: #ffffff;
    opacity: 0.95;
    transition: fill 0.3s ease;
}
.social:hover svg {
    fill: #f0f0f0;
}

/* ✅ Music Player - Polished */
.music-container {
    display: block;
    color: white;
    background: rgba(0, 0, 0, 0.88);
    border-radius: 18px;
    padding: 20px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    cursor: default;
    transition: all 0.3s ease;
}

.music-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
}

.music-album-art {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    animation: rotateAlbum 12s linear infinite;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 15px rgba(0,0,0,0.9);
    transition: all 0.3s ease;
}
.music-album-art:hover {
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 0 20px rgba(0,0,0,1);
}

@keyframes rotateAlbum {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.music-info {
    text-align: left;
    flex: 1;
    min-width: 0;
}

.music-title {
    font-size: 18px;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.music-artist {
    font-size: 14px;
    opacity: 0.8;
    display: block;
    color: #cccccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ✅ Play/Pause Button */
.music-play-button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.28s ease;
    box-shadow: 0 3px 12px rgba(0,0,0,0.6);
}

.music-play-button:hover {
    transform: scale(1.15);
    background: #f8f8f8;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

.music-play-button svg {
    width: 20px;
    height: 20px;
    fill: #000000;
    margin-left: 2px;
}

/* Progress Bar */
.music-progress-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    margin-top: 12px;
    overflow: hidden;
    cursor: default;
}

.music-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #ffffff, #e8e8e8);
    width: 0%;
    border-radius: 4px;
    transition: width 0.5s linear;
    box-shadow: 0 0 10px rgba(255,255,255,0.25);
}

.music-time {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #999;
    margin-top: 8px;
    font-weight: 400;
}

.views-pill {
    display: inline-block;
    padding: 7px 28px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 500;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    letter-spacing: 1px;
    margin-top: 10px;
    color: #dddddd;
    transition: all 0.3s ease;
}
.views-pill:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.18);
}

/* ✅ Popup / Tooltip - Smoother */
.profile-popup {
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 20px;
    width: 400px;
    background: rgba(0, 0, 0, 0.94);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.08);
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    transform: translateX(-50%) translateY(10px);
}

.avatar:hover .profile-popup {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.popup-header {
    display: flex;
    align-items: center;
    gap: 16px;
}

.popup-avatar-wrapper {
    position: relative;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
}

.popup-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    position: relative;
    z-index: 2;
}

.popup-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.popup-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.08);
    width: 66px;
    height: 66px;
    pointer-events: none;
    z-index: 1;
    display: block;
}

.popup-info {
    text-align: left;
    flex: 1;
    overflow: hidden;
}

.popup-nickname {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    display: block;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.popup-name {
    font-size: 14px;
    font-weight: 400;
    color: #aaaaaa;
    display: block;
    line-height: 1.4;
    margin: 3px 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.popup-status {
    font-size: 13px;
    color: #999;
    display: flex;
    align-items: center;
    gap: 7px;
    line-height: 1;
}

.popup-status .status-dot {
    width: 11px;
    height: 11px;
}

.popup-activity {
    font-size: 12px;
    color: #bbbbbb;
    background: #121212;
    padding: 6px 10px;
    border-radius: 8px;
    margin-top: 8px;
    border: 1px solid rgba(255,255,255,0.08);
}

/* Responsive */
@media (max-width: 480px) {
    .click-text { font-size: 26px; letter-spacing: 8px; }
    .avatar { width: 140px; height: 140px; }
    img.avatar-decoration { width: 165px; height: 165px; }
    .section-card { padding: 24px; }
    .profile-popup { width: 330px; }
    .social { width: 60px; height: 60px; }
    .social svg { width: 26px; height: 26px; }
}
</style>
</head>

    <div class="section-card">
        <div class="music-container">
            <div class="music-header">
                <img id="musicAlbumArt" class="music-album-art" src="leonaise.webp" alt="Album Art">
                <div class="music-info">
                    <span class="music-title" id="musicTitle">CHILL OUT</span>
                    <span class="music-artist" id="musicArtist">HYU1 CHILL OUT (Official Music Video)</span>
                </div>
                <button id="playPauseBtn" class="music-play-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="playIcon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="pauseIcon" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
            </div>

            <div class="music-progress-container">
                <div id="musicProgressBar" class="music-progress-bar"></div>
            </div>

            <div class="music-time">
                <span id="musicTimeCurrent">0:00</span>
                <span id="musicTimeTotal">2:31</span>
            </div>

            <div class="views-pill" id="viewsCount">Views: 5682</div>
        </div>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="../HYU1 - CHILL OUT.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

const overlay = document.getElementById("loading-overlay");

overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => { 
        overlay.style.visibility = "hidden"; 
    }, 800);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        return false;
    }
});

function updateViews() {
    let count = localStorage.getItem('page_views');
    if (!count) count = 5671; 
    count = parseInt(count) + 1;
    localStorage.setItem('page_views', count);
    document.getElementById('viewsCount').innerText = `Views: ${count}`;
}
updateViews();

const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;

const defaultTitle = "CHILL OUT";
const defaultArtist = "HYU1 CHILL OUT (Official Music Video)";
const defaultArt = "leonaise.webp";
const defaultLink = "https://open.spotify.com/playlist/0EpzfpMwBENOUUHAWMIgUI?si=DoTqgxLBSzSXV8Tbdbrg5w";
const defaultDuration = 151000;

let isPlaying = true;
let currentTime = 0;
let totalTime = defaultDuration;
let progressInterval;

const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const progressBar = document.getElementById('musicProgressBar');
const timeCurrentEl = document.getElementById('musicTimeCurrent');
const timeTotalEl = document.getElementById('musicTimeTotal');

playPauseBtn.addEventListener('click', () => {
    if (isPlaying) {
        audio.pause();
        clearInterval(progressInterval);
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
    } else {
        audio.play().catch(e => console.log(e));
        startProgressTimer();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
    }
    isPlaying = !isPlaying;
});

function formatTime(ms) {
    if (!ms || ms < 0) return "0:00";
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
}

function startProgressTimer() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        if (currentTime < totalTime) {
            currentTime += 1000;
            updateProgressUI();
        } else {
            currentTime = 0;
            audio.currentTime = 0;
        }
    }, 1000);
}

function updateProgressUI() {
    const percentage = totalTime > 0 ? (currentTime / totalTime) * 100 : 0;
    progressBar.style.width = percentage + "%";
    timeCurrentEl.innerText = formatTime(currentTime);
}

async function fetchData() {
    try {
        const res = await fetch(API_URL, {cache: "no-store"});
        const json = await res.json();

        if (!json.success) {
            console.error("API Error:", json);
            document.getElementById('statusText').innerText = 'Error';
            return;
        }
        const d = json.data;

        const avatarEl = document.getElementById('avatarImg');
        const popupAvatarEl = document.getElementById('popupAvatarImg');
        let avatarUrl = "";
        if (d.discord_user.avatar) {
            avatarUrl = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
        } else {
            avatarUrl = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        }
        avatarEl.src = avatarUrl;
        popupAvatarEl.src = avatarUrl;

        const decoEl = document.getElementById('decoImg');
        const popupDecoEl = document.getElementById('popupDeco');
        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            const decoUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.src = decoUrl;
            decoEl.style.display = 'block';
            popupDecoEl.src = decoUrl;
            popupDecoEl.style.display = 'block';
        } else {
            decoEl.style.display = 'none';
            popupDecoEl.style.display = 'none';
        }

        const nickname = d.discord_user.global_name || "Leon";
        const username = d.discord_user.username || "wtf.leon";
        document.getElementById('popupNickname').innerText = nickname;
        document.getElementById('popupUsername').innerText = `@${username}`;

        const noteEl = document.getElementById('noteText');
        const customStatus = d.activities?.find(a => a.type === 4);
        let statusText = "PA KISS NGA";
        if (customStatus?.state) {
            statusText = customStatus.state;
        }
        noteEl.innerText = statusText;

        const statusDot = document.getElementById('statusDot');
        const statusTextEl = document.getElementById('statusText');
        const popupStatusDot = document.getElementById('popupStatusDot');
        const popupStatusText = document.getElementById('popupStatusText');
        
        statusDot.className = "status-dot";
        popupStatusDot.className = "status-dot";

        let statusString = "";
        let statusClass = "";

        switch(d.discord_status) {
            case 'online':
                statusClass = 'status-online';
                statusString = 'Online';
                break;
            case 'idle':
                statusClass = 'status-idle';
                statusString = 'Idle';
                break;
            case 'dnd':
                statusClass = 'status-dnd';
                statusString = 'Do Not Disturb';
                break;
            default:
                statusClass = 'status-offline';
                statusString = 'Offline / Invisible';
        }

        statusDot.classList.add(statusClass);
        statusTextEl.innerText = statusString;
        popupStatusDot.classList.add(statusClass);
        popupStatusText.innerText = statusString;

        const activityEl = document.getElementById('popupActivity');
        const activity = d.activities?.find(a => a.type === 0 || a.type === 2 || a.type === 3);
        if (activity) {
            if (activity.type === 0) activityEl.innerText = `Playing: ${activity.name}`;
            if (activity.type === 2) activityEl.innerText = `Listening: ${activity.name}`;
            if (activity.type === 3) activityEl.innerText = `Watching: ${activity.name}`;
        } else {
            activityEl.innerText = "No Activity";
        }

        const titleEl = document.getElementById('musicTitle');
        const artistEl = document.getElementById('musicArtist');
        const artEl = document.getElementById('musicAlbumArt');

        if (d.spotify?.track_id) {
            titleEl.innerText = d.spotify.song || "Unknown Track";
            artistEl.innerText = d.spotify.artist || "Unknown Artist";
            artEl.src = d.spotify.album_art_url || defaultArt;
            
            const start = d.spotify.timestamps?.start || 0;
            const end = d.spotify.timestamps?.end || 0;
            
            if (end > start) {
                totalTime = end - start;
                currentTime = Math.min(Date.now() - start, totalTime);
                timeTotalEl.innerText = formatTime(totalTime);
                updateProgressUI();
            }

        } else {
            titleEl.innerText = defaultTitle;
            artistEl.innerText = defaultArtist;
            artEl.src = "leonaise.webp";
            totalTime = defaultDuration;
            timeTotalEl.innerText = "2:31";
            if(isPlaying) {
                currentTime = audio.currentTime * 1000;
                updateProgressUI();
            }
        }

    } catch (err) {
        console.error("API Fetch Error:", err);
        document.getElementById('statusText').innerText = 'Error';
    }
}

fetchData();
setInterval(fetchData, 5000);

startProgressTimer();
playIcon.style.display = 'none';
pauseIcon.style.display = 'block';

history.replaceState(null, null, location.href);
window.onpopstate = () => history.go(1);
window.addEventListener('load', () => history.pushState(null, null, location.href));
</script>
</body>
</html>
