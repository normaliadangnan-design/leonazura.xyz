<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),url("../members/founder/leon.gif");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:8px 8px;
    z-index:1;
}

#loading-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #090909; z-index: 9999999;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
    font-size: 28px; font-weight: 600; letter-spacing: 8px; color: #ffffff;
    animation: pulse 1.5s infinite alternate; text-transform: uppercase;
}

@keyframes pulse {
    0% { opacity: 0.3; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
}

.card{
    position:relative; z-index:2; text-align:center; padding:40px; width:320px;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(15px);
    border-radius:25px; border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 10px 30px rgba(0,0,0,0.8);
}

.logo-img-container {
    display: flex; justify-content: center; align-items: center;
    margin-bottom: 15px; width: 100%; background: #000000;
    padding: 10px; border-radius: 12px;
}

.main-logo { max-width: 80px; height: auto; }

.title{ font-size:20px; letter-spacing:4px; margin-bottom:25px; }

.avatar{ position: relative; width:110px; height:110px; margin:auto; margin-bottom:15px; }

.avatar-img-holder { width: 100%; height: 100%; border-radius:50%; overflow: hidden; border:3px solid rgba(255,255,255,.18); background: #000; }

.avatar-img-holder img{ width:100%; height:100%; object-fit:cover; }

.username{ font-size:22px; font-weight:600; margin-bottom:2px; }

/* DITO ANG STATUS STYLE */
#status-pill {
    font-size: 11px; font-weight: 600; margin-bottom: 15px;
    padding: 2px 10px; border-radius: 10px; display: inline-block;
    text-transform: uppercase; letter-spacing: 1px;
}

.bio{ opacity:.75; font-size:13px; margin-bottom:25px; }

.socials{ display:flex; justify-content:center; gap:14px; margin-bottom:20px; }

.social{
    width:48px; height:48px; border-radius:50%; display:flex;
    justify-content:center; align-items:center; background:rgba(255,255,255,.05);
    transition:.3s;
}

.social:hover{ transform:translateY(-4px); background:rgba(255,255,255,.15); }
.social svg { width:22px; height:22px; fill:white; }

.music-container {
    display: block; text-decoration: none; color: white;
    background: rgba(0,0,0,0.3); border-radius: 15px;
    padding: 14px; transition: .3s; border: 1px solid rgba(255,255,255,0.05);
}
.music-container:hover { transform: scale(1.03); background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<div id="loading-overlay">
    <div class="click-text">CLICK</div>
</div>

<div class="card">
    <div class="logo-img-container">
        <img src="logo.webp" alt="Leon" class="main-logo" onerror="this.src='https://i.imgur.com/w1A2v2A.png';">
    </div>

    <div class="title">@Leon</div>

    <div class="avatar">
        <div class="avatar-img-holder">
            <img src="../members/founder/user1.jpg" alt="Avatar">
        </div>
    </div>

    <div class="username">@wtf.leon</div>
    <div id="status-pill">Loading...</div>
    
    <div class="bio">tara sleep call</div>

    <div class="socials">
        <a class="social" href="https://discord.gg/CwsGFu6D" target="_blank"><svg viewBox="0 0 24 24"><path d="M20.317 4.92... (svg code)"/></svg></a>
    </div>
</div>

<script>
// ILAGAY DITO ANG DISCORD ID MO
const DISCORD_ID = "1250654354344775703"; 

async function updateStatus() {
    const statusPill = document.getElementById("status-pill");
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const data = await res.json();
        if(data.success) {
            const status = data.data.discord_status;
            const colors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
            statusPill.style.background = colors[status];
            statusPill.innerText = status;
        }
    } catch(e) { statusPill.innerText = "OFFLINE"; }
}

updateStatus();
setInterval(updateStatus, 10000); // Refresh kada 10 seconds

// Existing Scripts
const audio = document.getElementById("bgMusic");
const overlay = document.getElementById("loading-overlay");
overlay.addEventListener('click', () => {
    overlay.style.opacity = "0";
    setTimeout(() => { overlay.style.visibility = "hidden"; }, 800);
});
</script>
</body>
</html>
