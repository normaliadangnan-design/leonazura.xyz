<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),url("../members/founder/leon.gif");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:8px 8px;
    z-index:1;
}

#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #090909;
    z-index: 9999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 8px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: pulse 1.5s infinite alternate;
    text-transform: uppercase;
}

@keyframes pulse {
    0% { opacity: 0.3; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.05); }
}

.card{
    position:relative;
    z-index:2;
    text-align:center;
    padding:40px;
    width:380px;
    background: transparent !important;
    border-radius:25px;
    border: none;
    box-shadow: none;
}

.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom:20px;
    width: 100%;
    background: transparent;
    padding: 15px;
    border-radius: 12px;
}

/* ✅ SOBRANG LAKI NA NG LOGO */
.main-logo {
    max-width: 240px;
    height: auto;
    object-fit: contain;
}

.title {
    font-size: 22px;
    letter-spacing: 4px;
    margin-bottom: 10px;
    overflow: hidden;
    white-space: nowrap;
    border-right: 0; 
    width: fit-content;
    margin: 0 auto 10px auto;
    width: 0; 
    font-weight: 600;
}

.title.typing-active {
    animation: typing 2s steps(20, end) forwards;
}

@keyframes typing {
    from { width: 0; }
    to { width: 80px; } 
}

/* ✅ STATUS CONTAINER: INAYOS PARA LUMABAS */
.status-container {
    display: flex !important;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 15px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 15px;
    background: #111;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    opacity: 1 !important;
    visibility: visible !important;
    z-index: 10;
    position: relative;
}

/* ✅ PARE-PAREHO ANG LAKI NG DOTS */
.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}
.status-online { background-color: #23a55a; } /* ✅ GREEN */
.status-idle { background-color: #f0b232; } /* ✅ YELLOW */
.status-dnd { background-color: #f13f43; } /* ✅ RED */
.status-offline { background-color: #80848e; } /* ✅ GRAY */

.avatar{
    position: relative;
    width:140px;
    height:140px;
    margin:auto;
    margin-bottom:18px;
    overflow: visible !important;
    cursor: pointer;
}

.avatar-img-holder {
    width: 100%;
    height: 100%;
    border-radius:50%;
    overflow: hidden;
    border:3px solid rgba(255,255,255,.18);
    background: transparent;
    position: relative;
    z-index: 2;
}

.avatar-img-holder img{
    width:100%;
    height:100%;
    object-fit:cover;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 170px !important;
    height: 170px !important;
    pointer-events: none !important;
    z-index: 1 !important;
    display: none;
    border-radius: 0 !important;
    background: transparent !important;
    image-rendering: -webkit-optimize-contrast;
}

.username{
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 8px;
    color: #ddd;
    display: block;
}

.bio{
    opacity:.85;
    font-size:15px;
    margin-bottom:28px;
    min-height: 20px;
    transition: all 0.3s ease;
    line-height: 1.4;
    word-break: break-word;
}

.socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:25px;
}

.social{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.05);
    text-decoration:none;
    transition:.3s;
}

.social:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.15);
}

.social svg {
    width:26px;
    height:26px;
    fill:white;
}

/* ✅ MUSIC BOX: FULL BLACK NA */
.music-container {
    display: block;
    color: white;
    background: #000000 !important;
    border-radius: 12px;
    padding: 22px 18px;
    width: 100%;
    transition: .3s;
    border: none;
    pointer-events: none;
    cursor: default;
    margin-bottom: 8px;
}

.music-container:hover {
    transform: scale(1.03);
    background: #000000;
}

.music-title {
    font-size: 18px;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
    color: #ffffff;
}

.music-artist {
    font-size: 14px;
    opacity: 0.7;
    display: block;
    margin-bottom: 0;
    color: #cccccc;
    letter-spacing: 0.5px;
}

.views-pill {
    display: inline-block;
    padding: 5px 24px;
    border-radius: 30px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    letter-spacing: 1px;
    margin-top: 4px;
}

a {
    text-decoration: none !important;
    color: inherit !important;
    pointer-events: auto;
}

/* ✅ POPUP BOX: SOBRANG LAKI NA GAYA NG GUSTO MO */
.profile-popup {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 12px;
    width: 380px;
    background: #000000 !important;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.9);
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    pointer-events: none;
}

.avatar:hover .profile-popup {
    opacity: 1;
    visibility: visible;
}

.popup-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    position: relative;
}

.popup-avatar-wrapper {
    position: relative;
    width: 45px;
    height: 45px;
    flex-shrink: 0;
}

.popup-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: none;
    position: relative;
    z-index: 2;
}

.popup-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.popup-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 58px;
    height: 58px;
    pointer-events: none;
    z-index: 1;
    display: none;
}

.popup-info {
    text-align: left;
    flex: 1;
    overflow: hidden;
}

.popup-nickname {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    display: block;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.popup-name {
    font-size: 13px;
    font-weight: 400;
    color: #8a8a8a;
    display: block;
    line-height: 1.2;
    margin: 2px 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ✅ STATUS SA POPUP: PARE-PAREHO ANG LAKI NG DOTS */
.popup-status {
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
}

.popup-status .status-dot {
    width: 10px !important;
    height: 10px !important;
}

.popup-note {
    display: none;
}

</style>
</head>
<body oncontextmenu="return false;">

<div id="loading-overlay">
    <div class="click-text">CLICK</div>
</div>

<div class="card">
    <div class="logo-img-container">
        <img src="public azura.png" alt="Leon Logo" class="main-logo" onerror="this.src='https://i.imgur.com/w1A2v2A.png';">
    </div>

    <div class="title">$Leon</div>

    <!-- ✅ STATUS CONTAINER: HINDI NA NAKATAGO -->
    <div id="statusArea" class="status-container">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText"></span>
    </div>

    <div class="avatar">
        <div class="profile-popup">
            <div class="popup-header">
                <div class="popup-avatar-wrapper">
                    <img id="popupDeco" class="popup-decoration" src="" alt="">
                    <div class="popup-avatar">
                        <img id="popupAvatarImg" src="" alt="">
                    </div>
                </div>
                <div class="popup-info">
                    <div class="popup-nickname" id="popupNickname">Leon</div>
                    <div class="popup-name" id="popupUsername">@wtf.leon</div>
                    <div class="popup-status">
                        <span id="popupStatusDot" class="status-dot"></span>
                        <span id="popupStatusText">dnd</span>
                    </div>
                </div>
            </div>
        </div>

        <img id="decoImg" src="" class="avatar-decoration" onerror="this.style.display='none'">
        <div class="avatar-img-holder">
            <img id="avatarImg" src="" alt="Leon Avatar">
        </div>
    </div>

    <div id="usernameText" class="username"></div>
    
    <div id="noteText" class="bio">PA KISS NGA</div>

    <div class="socials">
        <a class="social" href="https://discord.gg/CwsGFu6D" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.317 4.92c-1.167-.977-2.387-1.785-3.653-2.42a.44.44 0 0 0-.234-.075 10.3 10.3 0 0 0-1.336.557 14.3 14.3 0 0 0-3.864 1.125 14.5 14.5 0 0 0-3.944-1.125 10.4 10.4 0 0 0-1.34-.557.43.43 0 0 0-.233.075c-1.266.635-2.486 1.443-3.653 2.42a.41.41 0 0 0-.067.417c.397 1.23 1.043 2.387 1.917 3.443a.41.41 0 0 0 .443.137c1.03-.38 2.07-.667 3.13-.857a.41.41 0 0 0 .267-.303 9.5 9.5 0 0 1-.107-1.143.41.41 0 0 1 .41-.41h.07a8.3 8.3 0 0 1 2.77.997.41.41 0 0 0 .443 0 8.3 8.3 0 0 1 2.77-.997h.07a.41.41 0 0 1 .41.41c0 .38-.037.76-.107 1.143a.41.41 0 0 0 .267.303c1.06.19 2.1.477 3.13.857a.41.41 0 0 0 .443-.137c.874-1.056 1.52-2.213 1.917-3.443a.41.41 0 0 0-.067-.417zM8.02 14.763c-1.19 0-2.16-1.07-2.16-2.387 0-1.317.953-2.387 2.16-2.387 1.206 0 2.173 1.07 2.16 2.387.013 1.317-.954 2.387-2.16 2.387zm7.96 0c-1.19 0-2.16-1.07-2.16-2.387 0-1.317.953-2.387 2.16-2.387 1.206 0 2.173 1.07 2.16 2.387.013 1.317-.954 2.387-2.16 2.387z"/></svg>

    </div>

    <div class="music-container">
        <span class="music-title">CHILL OUT</span>
        <span class="music-artist">HYU1 (Official Music Video)</span>
        <span class="views-pill">Views: 5669</span>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="../HYU1 - CHILL OUT.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

const overlay = document.getElementById("loading-overlay");
const typewriterText = document.querySelector('.title'); 

overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => { 
        overlay.style.visibility = "hidden"; 
        typewriterText.classList.add('typing-active');
    }, 800);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        return false;
    }
});
setInterval(function() { (function() { return false; }['constructor']('debugger')['call']()); }, 50);

const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;

async function fetchData() {
    try {
        const res = await fetch(API_URL);
        const json = await res.json();

        if (!json.success) return;
        const d = json.data;

        const avatarEl = document.getElementById('avatarImg');
        const popupAvatarEl = document.getElementById('popupAvatarImg');
        let avatarUrl = "";
        if (d.discord_user.avatar) {
            avatarUrl = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
        } else {
            avatarUrl = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        }
        avatarEl.src = avatarUrl;
        popupAvatarEl.src = avatarUrl;

        const decoEl = document.getElementById('decoImg');
        const popupDecoEl = document.getElementById('popupDeco');
        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            const decoUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.src = decoUrl;
            decoEl.style.display = 'block';
            popupDecoEl.src = decoUrl;
            popupDecoEl.style.display = 'block';
        } else {
            decoEl.style.display = 'none';
            popupDecoEl.style.display = 'none';
        }

        const nickname = d.discord_user.global_name || "Leon";
        const username = d.discord_user.username || "wtf.leon";
        document.getElementById('popupNickname').innerText = nickname;
        document.getElementById('popupUsername').innerText = `@${username}`;
        document.getElementById('usernameText').innerText = username;

        const noteEl = document.getElementById('noteText');
        const popupNoteEl = document.getElementById('popupNote');
        const customStatus = d.activities.find(a => a.type === 4);
        let statusText = "PA KISS NGA";
        if (customStatus && customStatus.state) {
            statusText = customStatus.state;
        }
        noteEl.innerText = statusText;
        popupNoteEl.innerText = statusText;

        // ✅ STATUS: NASA MAIN BOX AT NASA POPUP BOX - INAYOS ANG PAGBASA
        const statusDot = document.getElementById('statusDot');
        const statusTextEl = document.getElementById('statusText');
        const popupStatusDot = document.getElementById('popupStatusDot');
        const popupStatusText = document.getElementById('popupStatusText');
        const statusArea = document.getElementById('statusArea');
        
        // ✅ LINISIN MUNA ANG LAHAT NG CLASS
        statusDot.className = "status-dot";
        popupStatusDot.className = "status-dot";

        let statusString = "";
        let statusClass = "";

        switch(d.discord_status) {
            case 'online':
                statusClass = 'status-online';
                statusString = 'Online';
                break;
            case 'idle':
                statusClass = 'status-idle';
                statusString = 'Idle';
                break;
            case 'dnd':
                statusClass = 'status-dnd';
                statusString = 'dnd';
                break;
            default:
                statusClass = 'status-offline';
                statusString = 'Offline / Invisible';
        }

        // ✅ ILAGAY ANG TAMANG KULAY AT TEKSTO
        statusDot.classList.add(statusClass);
        statusTextEl.innerText = statusString;
        popupStatusDot.classList.add(statusClass);
        popupStatusText.innerText = statusString;
        statusArea.style.display = 'flex';

    } catch (err) {
        console.error("API Error:", err);
    }
}

fetchData();
setInterval(fetchData, 30000);

history.replaceState(null, null, location.href);
window.onpopstate = () => history.go(1);
window.addEventListener('load', () => history.pushState(null, null, location.href));
</script>
</body>
</html>
