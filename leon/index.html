<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
*{ margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }

/* GIF BACKGROUND */
body {
    height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)), url("../members/founder/leon.gif");
    background-size: cover; background-position: center;
    color: white; overflow: hidden;
}

.card {
    position: relative; z-index: 2; text-align: center; padding: 30px; width: 320px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(15px);
    border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);
}

.avatar { width: 110px; height: 110px; margin: auto; margin-bottom: 15px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.18); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.username { font-size: 22px; font-weight: 600; margin-bottom: 5px; }

#status-pill { 
    font-size: 10px; font-weight: 600; margin-bottom: 15px; padding: 4px 12px; 
    border-radius: 12px; display: inline-block; text-transform: uppercase; background: #333; 
}

.bio { opacity: .75; font-size: 13px; margin-bottom: 20px; }
.socials { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
.social { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.05); }
.social svg { width: 20px; height: 20px; fill: white; }

.music-container { display: block; text-decoration: none; color: white; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 12px; }
.music-title { font-size: 14px; font-weight: 600; display: block; }
.music-artist { font-size: 11px; opacity: 0.7; display: block; margin-bottom: 5px; }
.views-pill { font-size: 10px; background: rgba(0,0,0,0.2); padding: 2px 10px; border-radius: 10px; }
</style>
</head>
<body>

<div class="card">
    <div class="avatar"><img src="../members/founder/user1.jpg" alt="Avatar"></div>
    <div class="username">@wtf.leon</div>
    <div id="status-pill">CHECKING STATUS...</div>
    <div class="bio">tara sleep call</div>

    <div class="socials">
        <a class="social" href="https://discord.gg/CwsGFu6D"><svg viewBox="0 0 24 24"><path d="M20.317 4.92... fill="white"/></svg></a>
        <a class="social" href="https://open.spotify.com/playlist/0EpzfpMwBENOUUHAWMIgUI?si=SUQ8MgwkTUywqQ-JQlJutQ"><svg viewBox="0 0 24 24"><path d="M12 2C6.477... fill="white"/></svg></a>
        <a class="social" href="https://www.instagram.com/leonky.2/"><svg viewBox="0 0 24 24"><path d="M12 2.163... fill="white"/></svg></a>
    </div>

    <a class="music-container" href="https://youtu.be/Llcjhy2z4iE?si=HKQiEpVZIJrLT9cW">
        <span class="music-title">Luhod</span>
        <span class="music-artist">Dreycruz</span>
        <span class="views-pill">Views: 5669</span>
    </a>
</div>

<audio id="bgMusic" autoplay loop>
    <source src="../luhod.mp3" type="audio/mpeg">
</audio>

<script>
// PALITAN MO NG IYONG DISCORD ID
const DISCORD_ID = "1250654354344775703"; 

async function updateStatus() {
    const pill = document.getElementById("status-pill");
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const data = await res.json();
        if(data.success) {
            const status = data.data.discord_status;
            const colors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
            pill.style.background = colors[status] || "#747f8d";
            pill.innerText = status;
        }
    } catch(e) { pill.innerText = "OFFLINE"; }
}
updateStatus();
setInterval(updateStatus, 5000);
</script>
</body>
</html>
