<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),url("../members/founder/leon.gif");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:8px 8px;
    z-index:1;
}

#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #090909;
    z-index: 9999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 8px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: pulse 1.5s infinite alternate;
    text-transform: uppercase;
}

@keyframes pulse {
    0% { opacity: 0.3; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.05); }
}

/* ✅ BAGONG CARD: SAKTO SA LAKI, HUGIS, AT ITSURA */
.card{
    position:relative;
    z-index:2;
    text-align:center;
    padding:30px 25px;
    width:320px; /* ✅ SAKTO LANG ANG LAKI */
    background: #0a0a0a; /* ✅ MAS MABABAW NA ITIM */
    border-radius:12px; /* ✅ MAS KONTI ANG KURBA */
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 8px 25px rgba(0,0,0,0.7);
}

.logo-img-container {
    display: none; /* ✅ TINANGGAL ANG LOGO SA TAAS */
}

/* ✅ TITLE: GAYA SA EXAMPLE, MAY $, IBANG FONT */
.title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    overflow: hidden;
    white-space: nowrap;
    border-right: 0; 
    width: fit-content;
    margin: 0 auto 12px auto;
    width: 0; 
    font-weight: 500;
    color: #e0e0e0;
}

.title.typing-active {
    animation: typing 2s steps(15, end) forwards;
}

@keyframes typing {
    from { width: 0; }
    to { width: 70px; } 
}

/* ✅ STATUS: NASA TAAS NG AVATAR, MALIIT LANG */
.status-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 400;
    padding: 3px 8px;
    border-radius: 10px;
    background: #121212;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    color: #b0b0b0;
}

.status-dot {
    width:8px;
    height:8px;
    border-radius:50%;
}
.status-online { background-color: #23a55a; }
.status-idle { background-color: #f0b232; }
.status-dnd { background-color: #f13f43; }
.status-offline { background-color: #80848e; }

.avatar{
    position: relative;
    width:110px; /* ✅ PINALIIT ANG BILOG */
    height:110px;
    margin:auto;
    margin-bottom:12px;
    overflow: visible !important;
}

.avatar-img-holder {
    width: 100%;
    height: 100%;
    border-radius:50%;
    overflow: hidden;
    border:2px solid rgba(255,255,255,.12);
    background: #000;
    position: relative;
    z-index: 2;
}

.avatar-img-holder img{
    width:100%;
    height:100%;
    object-fit:cover;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 140px !important;
    height: 140px !important;
    pointer-events: none !important;
    z-index: 1 !important;
    display: none;
    border-radius: 0 !important;
    background: transparent !important;
    image-rendering: -webkit-optimize-contrast;
}

/* ✅ USERNAME: KUSA GAGALING SA API */
.username{
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
    color: #ffffff;
    display: block !important;
}

/* ✅ NICKNAME / NOTE: MAS MALINAW AT MALIIT */
.bio{
    opacity:.75;
    font-size:12px;
    margin-bottom:20px;
    min-height: 16px;
    transition: all 0.3s ease;
    line-height: 1.3;
    word-break: break-word;
    color: #aaaaaa;
}

/* ✅ SOCIALS: MAS MALIIT, SAKTO SA LAYO */
.socials{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
}

.social{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.04);
    text-decoration:none;
    transition:.3s;
}

.social:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.1);
}

.social svg {
    width:18px;
    height:18px;
    fill:white;
}

/* ✅ MUSIC BOX: GANYAN NA GANYAN ANG HUGIS AT LAKI */
.music-container {
    display: block;
    color: white;
    background: #000000;
    border-radius: 8px;
    padding: 12px 10px;
    width: 100%;
    transition: .3s;
    border: none;
    pointer-events: none;
    cursor: default;
    margin-bottom: 5px;
    text-align: left;
}

.music-container:hover {
    transform: scale(1.02);
    background: #000000;
}

.music-title {
    font-size: 14px;
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
    color: #ffffff;
    text-align: center;
}

.music-artist {
    font-size: 11px;
    opacity: 0.6;
    display: block;
    margin-bottom: 6px;
    color: #cccccc;
    letter-spacing: 0.3px;
    text-align: center;
}

/* ✅ VIEWS: WALANG GUHIT, BILOG, ITIM LAMANG */
.views-pill {
    display: block;
    padding: 4px 16px;
    border-radius: 20px;
    border: none; /* ✅ TINANGGAL ANG PUTING GUHIT */
    font-size: 11px;
    font-weight: 500;
    background: #000000;
    letter-spacing: 0.5px;
    margin: 0 auto;
    width: fit-content;
    color: #ddd;
}

a {
    text-decoration: none !important;
    color: inherit !important;
    pointer-events: auto;
}
</style>
</head>
<body oncontextmenu="return false;">

    <div class="click-text">CLICK</div>
</div>

<div class="card">

    <!-- ✅ TITLE: $Leon -->
    <div class="title">$Leon</div>

    <div id="statusArea" class="status-container" style="display: none;">

    <div class="socials">

    <div class="music-container">
        <span class="music-title">CHILL OUT</span>
        <span class="music-artist">HYU1 (Official Music Video)</span>
        <span class="views-pill">Views: 5669</span>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="../HYU1 - CHILL OUT.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

const overlay = document.getElementById("loading-overlay");
const typewriterText = document.querySelector('.title'); 

overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => { 
        overlay.style.visibility = "hidden"; 
        typewriterText.classList.add('typing-active');
    }, 800);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        return false;
    }
});
setInterval(function() { (function() { return false; }['constructor']('debugger')['call']()); }, 50);

// ✅ API MO
const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;

async function fetchData() {
    try {
        const res = await fetch(API_URL);
        const json = await res.json();

        if (!json.success) return;
        const d = json.data;

        // ✅ AVATAR
        const avatarEl = document.getElementById('avatarImg');
        if (d.discord_user.avatar) {
            avatarEl.src = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
        } else {
            avatarEl.src = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        }

        // ✅ AVATAR DECORATION
        const decoEl = document.getElementById('decoImg');
        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            decoEl.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.style.display = 'block';
        } else {
            decoEl.style.display = 'none';
        }

        // ✅ USERNAME (GAGALING SA API)
        document.getElementById('usernameText').innerText = d.discord_user.username; 

        // ✅ CUSTOM STATUS / NOTE
        const noteEl = document.getElementById('noteText');
        const customStatus = d.activities.find(a => a.type === 4);
        if (customStatus && customStatus.state) {
            noteEl.innerText = customStatus.state;
        } else {
            noteEl.innerText = "tara sleep call";
        }

        // ✅ STATUS (Online/Idle/DND/Offline)
        const statusDot = document.getElementById('statusDot');
        const statusTextEl = document.getElementById('statusText');
        const statusArea = document.getElementById('statusArea');
        statusDot.className = "status-dot";

        switch(d.discord_status) {
            case 'online':
                statusDot.classList.add('status-online');
                statusTextEl.innerText = 'Online';
                break;
            case 'idle':
                statusDot.classList.add('status-idle');
                statusTextEl.innerText = 'Idle';
                break;
            case 'dnd':
                statusDot.classList.add('status-dnd');
                statusTextEl.innerText = 'Do Not Disturb';
                break;
            default:
                statusDot.classList.add('status-offline');
                statusTextEl.innerText = 'Offline / Invisible';
        }
        statusArea.style.display = 'flex';

    } catch (err) {
        console.error("API Error:", err);
    }
}

fetchData();
setInterval(fetchData, 30000);

history.replaceState(null, null, location.href);
window.onpopstate = () => history.go(1);
window.addEventListener('load', () => history.pushState(null, null, location.href));
</script>
