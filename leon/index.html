*{ margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif; }

body{
    height:100vh;
    display:flex; justify-content:center; align-items:center;
    background: #000;
    color:white; overflow:hidden;
}

.card{
    position:relative; z-index:2; text-align:center; padding:30px; width:320px;
    background: #000;
    border-radius:25px;
    border:1px solid #222;
}

.avatar{ width:110px; height:110px; margin:auto; margin-bottom:15px; border-radius:50%; border:3px solid #333; overflow:hidden; }
.avatar img{ width:100%; height:100%; object-fit:cover; }

.username{ font-size:22px; font-weight:600; margin-bottom: 5px; }

/* Status Styles */
#status-pill { font-size: 10px; font-weight: 600; margin-bottom: 15px; padding: 3px 10px; border-radius: 10px; display: inline-block; text-transform: uppercase; }

.bio{ opacity:.75; font-size:13px; margin-bottom:20px; }

.socials{ display:flex; justify-content:center; gap:15px; margin-bottom:25px; }
.social{ width:40px; height:40px; border-radius:50%; display:flex; justify-content:center; align-items:center; background:#111; }
.social svg { width:20px; height:20px; fill:white; }

.music-container { display: block; text-decoration: none; color: white; background: #111; border-radius: 15px; padding: 12px; }
.music-title { font-size: 14px; font-weight: 600; display: block; }
.music-artist { font-size: 11px; opacity: 0.7; display: block; margin-bottom: 5px; }
.views-pill { font-size: 10px; background: #222; padding: 2px 10px; border-radius: 10px; }
</style>

<script>
async function updateStatus() {
    const DISCORD_ID = "1250654354344775703"; // PALITAN MO ITO
    const pill = document.getElementById("status-pill");
    try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const data = await res.json();
        if(data.success) {
            const status = data.data.discord_status;
            const colors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
            pill.style.background = colors[status];
            pill.innerText = status;
        }
    } catch(e) { pill.innerText = "OFFLINE"; }
}
updateStatus();
setInterval(updateStatus, 10000);
</script>
