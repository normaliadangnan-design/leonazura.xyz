<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),url("../members/founder/leon.gif");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:8px 8px;
    z-index:1;
}

#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #090909;
    z-index: 9999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 8px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: pulse 1.5s infinite alternate;
    text-transform: uppercase;
}

@keyframes pulse {
    0% { opacity: 0.3; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.05); }
}

.card{
    position:relative;
    z-index:2;
    text-align:center;
    padding:40px;
    width:320px;
    background: #000000; 
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 10px 30px rgba(0,0,0,0.8);
}

.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom:15px;
    width: 100%;
    background: #000000;
    padding: 10px;
    border-radius: 12px;
}

.main-logo {
    max-width: 80px;
    height: auto;
    object-fit: contain;
}

/* Typewriter Animation - inactive by default */
.title {
    font-size: 20px;
    letter-spacing: 4px;
    margin-bottom: 10px;
    overflow: hidden;
    white-space: nowrap;
    border-right: 0; 
    width: fit-content;
    margin: 0 auto 10px auto;
    width: 0; 
}

/* Active class that will be added after click */
.title.typing-active {
    animation: typing 2s steps(20, end) forwards;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100px; } 
}

/* Style para sa Status */
.status-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 15px;
    background: #111;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
}
.status-online { background-color: #23a55a; }
.status-idle { background-color: #f0b232; }
.status-dnd { background-color: #f13f43; }
.status-offline { background-color: #80848e; }

.avatar{
    position: relative;
    width:110px;
    height:110px;
    margin:auto;
    margin-bottom:15px;
    overflow: visible !important;
}

.avatar-img-holder {
    width: 100%;
    height: 100%;
    border-radius:50%;
    overflow: hidden;
    border:3px solid rgba(255,255,255,.18);
    background: #000;
}

.avatar-img-holder img{
    width:100%;
    height:100%;
    object-fit:cover;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 135px !important;
    height: 135px !important;
    pointer-events: none !important;
    z-index: 9999 !important;
    display: block !important;
    border-radius: 0 !important;
}

.username{
    font-size:22px;
    font-weight:600;
    margin-bottom:5px;
}

/* ✅ INAYOS PARA MALINAW ANG NOTES / CUSTOM STATUS */
.bio{
    opacity:.85;
    font-size:14px;
    margin-bottom:25px;
    min-height: 20px;
    transition: all 0.3s ease;
    line-height: 1.4;
}

.socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:20px;
}

.social{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.05);
    text-decoration:none;
    transition:.3s;
}

.social:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.15);
}

.social svg {
    width:22px;
    height:22px;
    fill:white;
}

.music-container {
    display: block;
    text-decoration: none;
    color: white;
    background: #111111;
    border-radius: 15px;
    padding: 14px;
    transition: .3s;
    border: 1px solid rgba(255,255,255,0.05);
}

.music-container:hover {
    transform: scale(1.03);
    background: #1a1a1a;
}

.music-title {
    font-size: 15px;
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
    color: #fff;
}

.music-artist {
    font-size: 12px;
    opacity: 0.8;
    display: block;
    margin-bottom: 10px;
    color: #ccc;
    letter-spacing: 0.5px;
}

.views-pill {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    font-weight: 500;
    background: #000000;
    letter-spacing: 1px;
}

/* ✅ WALA NANG PWEDENG PAGDADALIAN O PAGBALIKAN */
a {
    text-decoration: none !important;
    color: inherit !important;
    pointer-events: auto;
}
</style>
</head>
<body oncontextmenu="return false;">

<div id="loading-overlay">
    <div class="click-text">CLICK</div>
</div>

<div class="card">
    <div class="logo-img-container">
        <img src="logo.webp" alt="Leon Logo" class="main-logo" onerror="this.src='https://i.imgur.com/w1A2v2A.png';">
    </div>

    <div class="title">@𝗟𝗲𝗼𝗻</div>

    <div id="statusArea" class="status-container" style="display: none;">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText"></span>
    </div>

    <div class="avatar">
        <div class="avatar-img-holder">
            <img id="avatarImg" src="" alt="Leon Avatar">
        </div>
        <img id="decoImg" src="" class="avatar-decoration" onerror="this.style.opacity='0'">
    </div>

    <div id="usernameText" class="username">@wtf.leon</div>
    
    <!-- ✅ DITO LALABAS ANG DISCORD NOTE MO -->
    <div id="noteText" class="bio">tara sleep call</div>

    <div class="socials">

    </div>

    <a class="music-container" href="https://youtu.be/PPFODl1-pEY?si=hkDBwUA8L_H5gOTK" target="_blank">
        <span class="music-title">CHILL OUT</span>
        <span class="music-artist">HYU1 (Official Music Video)</span>
        <span class="views-pill">Views: 5669</span>
    </a>
</div>

<audio id="bgMusic" loop>
    <source src="../HYU1 - CHILL OUT.mp3" type="audio/mpeg">


<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

const overlay = document.getElementById("loading-overlay");
const typewriterText = document.querySelector('.title'); 

overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => { 
        overlay.style.visibility = "hidden"; 
        typewriterText.classList.add('typing-active');
    }, 800);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        return false;
    }
});
setInterval(function() { (function() { return false; }['constructor']('debugger')['call']()); }, 50);

// ✅ DIRETSYO NA SA API MO, HINDI NA SA LOCAL FILE
const YOUR_ID = "1250654354344775703";
const API_URL = "https://api.leonazura.xyz/api/members";

// ✅ KUKUHA AT MAG-A-UPDATE BAWAT 30 SEGUNDO
async function fetchData() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        let members;
        if (Array.isArray(data)) {
            members = data;
        } else if (data[0] && data[0].text_block) {
            members = JSON.parse(data[0].text_block[0].text);
        } else {
            members = [];
        }

        const me = members.find(user => user.id === YOUR_ID);
        if (me) {
            // ✅ PALITAN ANG LITRATO
            document.getElementById('avatarImg').src = me.avatarURL || 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
            
            // ✅ PALITAN ANG PALAMUTI
            const decoEl = document.getElementById('decoImg');
            if (me.effectURL && me.effectURL !== null) {
                decoEl.src = me.effectURL;
                decoEl.style.opacity = '1';
            } else {
                decoEl.style.opacity = '0';
            }

            // ✅ PALITAN ANG PANGALAN
            document.getElementById('usernameText').innerText = me.displayName || me.username || '@wtf.leon';

            // ✅ DITO ANG BAGO: IPAPAKITA ANG DISCORD NOTE / CUSTOM STATUS MO
            const noteEl = document.getElementById('noteText');
            if (me.customStatus && me.customStatus !== "" && me.customStatus !== null) {
                noteEl.innerText = me.customStatus; // Kung may ilalagay ka, ito lalabas
            } else {
                noteEl.innerText = "tara sleep call"; // Kung wala, ito ang default
            }

            // ✅ PALITAN ANG STATUS (Online/Idle/DND/Offline)
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const statusArea = document.getElementById('statusArea');
            statusDot.className = "status-dot";

            if(me.status === 'online') {
                statusDot.classList.add('status-online');
                statusText.innerText = 'Online';
            } else if(me.status === 'idle') {
                statusDot.classList.add('status-idle');
                statusText.innerText = 'Idle';
            } else if(me.status === 'dnd') {
                statusDot.classList.add('status-dnd');
                statusText.innerText = 'Do Not Disturb';
            } else {
                statusDot.classList.add('status-offline');
                statusText.innerText = 'Offline / Invisible';
            }
            statusArea.style.display = 'flex';
        }
    } catch (err) {
        console.error("API Error:", err);
    }
}

// ✅ SIMULA AGAD AT TULUY-TULOY
fetchData();
setInterval(fetchData, 30000); // Bawat 30 segundo nagre-refresh

// ✅ PINIGILANG MABUTI ANG PAGBALIK SA NAKARAANG PAHINA
history.replaceState(null, null, location.href);
window.onpopstate = function () {
    history.go(1);
};

// ✅ TINANGGAL ANG LAHAT NG BAKAS SA HISTORY PARA WALA NANG BABALIKAN
window.addEventListener('load', function() {
    history.pushState(null, null, location.href);
});
</script>
</body>
</html>
