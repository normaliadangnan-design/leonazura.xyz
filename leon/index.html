<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.78)),url("../members/founder/leon.gif");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
color:white;
overflow:hidden;
}

body::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
background-size:8px 8px;
z-index:1;
}

/* 🎯 INTERACTIVE LOADING SCREEN OVERLAY */
#loading-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #090909;
z-index: 9999999; 
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
font-size: 28px;
font-weight: 600;
letter-spacing: 8px;
color: #ffffff;
text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
animation: pulse 1.5s infinite alternate;
text-transform: uppercase;
}

@keyframes pulse {
0% { opacity: 0.3; transform: scale(0.98); }
100% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
}

.card{
position:relative;
z-index:2;
text-align:center;
padding:40px;
width:320px;
backdrop-filter:blur(14px);
background:rgba(0,0,0,.28);
border-radius:25px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 35px rgba(0,0,0,.45);
}

/* 🎯 WEBP LOGO CSS */
.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    width: 100%;
}

.main-logo {
    max-width: 80px; 
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)); 
}

.title{
font-size:20px;
letter-spacing:4px;
margin-bottom:25px;
}

/* 🎯 FIXED AVATAR CONTAINER */
.avatar{
position: relative;
width:110px;
height:110px;
margin:auto;
margin-bottom:15px;
overflow: visible !important;
}

/* 🎯 INNER IMAGE HOLDER */
.avatar-img-holder {
width: 100%;
height: 100%;
border-radius:50%;
overflow: hidden;
border:3px solid rgba(255,255,255,.18);
background: #000;
}

.avatar-img-holder img{
width:100%;
height:100%;
object-fit:cover;
}

/* 🎯 PERFECTLY CENTERED AVATAR DECORATION */
img.avatar-decoration {
position: absolute !important;
top: 50% !important;
left: 50% !important;
transform: translate(-50%, -50%) !important;
width: 135px !important; 
height: 135px !important;
pointer-events: none !important;
z-index: 9999 !important; 
display: block !important;
border-radius: 0 !important;
}

.username{
font-size:22px;
font-weight:600;
margin-bottom:5px;
}

.bio{
opacity:.75;
font-size:13px;
margin-bottom:25px;
}

/* 🎯 SOCIALS CONTAINER GAP */
.socials{
display:flex;
justify-content:center;
gap:14px;
margin-bottom:20px;
}

.social{
width:48px;
height:48px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(255,255,255,.08);
text-decoration:none;
transition:.3s;
}

.social:hover{
transform:translateY(-4px);
background:rgba(255,255,255,.18);
}

.social svg {
width:22px;
height:22px;
fill:white;
}

/* 🎯 FIXED: BAGONG MUSIC BOX STYLE (Hango sa Luhod layout) */
.music-container {
display: block;
text-decoration: none;
color: white;
background: rgba(0,0,0,.45);
border-radius: 15px;
padding: 14px;
transition: .3s;
}

.music-container:hover {
transform: scale(1.03);
background: rgba(255,255,255,.12);
}

.music-title {
font-size: 15px;
font-weight: 600;
display: block;
margin-bottom: 2px;
color: #fff;
}

.music-artist {
font-size: 12px;
opacity: 0.8;
display: block;
margin-bottom: 10px;
color: #ccc;
letter-spacing: 0.5px;
}

/* 🎯 FIXED: VIEWS COUNTER PILL-SHAPED LOOK */
.views-pill {
display: inline-block;
padding: 4px 18px;
border-radius: 20px;
border: 1px solid rgba(255, 255, 255, 0.25);
font-size: 12px;
font-weight: 500;
background: rgba(0, 0, 0, 0.2);
letter-spacing: 1px;
}
</style>
</head>

<audio id="bgMusic" autoplay loop>
<source src="../luhod.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

// 🎯 LOADING OVERLAY CLICK INTERACTION
const overlay = document.getElementById("loading-overlay");
overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => {
        overlay.style.visibility = "hidden";
    }, 800);
});

// 🔒 TOTAL SECURITY LOCKDOWN (Anti-Right Click & Anti-Source Code)
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
    ) {
        e.preventDefault();
        return false;
    }
});

// DevTools Freeze Loop
setInterval(function() {
    (function() {
        return false;
    }['constructor']('debugger')['call']());
}, 50);
</script>
