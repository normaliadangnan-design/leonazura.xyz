<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Leon</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.55),
rgba(0,0,0,.78)),
url("../members/founder/leon.gif");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

color:white;

overflow:hidden;

}

body::before{

content:"";

position:absolute;
inset:0;

background:
radial-gradient(
rgba(255,255,255,.07) 1px,
transparent 1px);

background-size:8px 8px;

}

.card{

position:relative;
z-index:2;

text-align:center;

padding:40px;

width:320px;

backdrop-filter:blur(14px);

background:
rgba(0,0,0,.28);

border-radius:25px;

border:
1px solid rgba(255,255,255,.08);

box-shadow:
0 0 35px rgba(0,0,0,.45);

}

.logo{

font-size:42px;

margin-bottom:10px;

}

.title{

font-size:20px;

letter-spacing:4px;

margin-bottom:25px;

}

.avatar{

width:110px;
height:110px;

margin:auto;

border-radius:50%;

overflow:hidden;

border:
3px solid rgba(255,255,255,.18);

margin-bottom:15px;

}

.avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.username{

font-size:22px;

font-weight:600;

margin-bottom:5px;

}

.bio{

opacity:.75;

font-size:13px;

margin-bottom:25px;

}

.socials{

display:flex;

justify-content:center;

gap:12px;

margin-bottom:20px;

}

.social{

width:48px;
height:48px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

background:
rgba(255,255,255,.08);

text-decoration:none;

font-size:18px;

color:white;

transition:.3s;

}

.social:hover{

transform:translateY(-4px);

background:
rgba(255,255,255,.18);

}

.music{

display:block;

padding:14px;

border-radius:15px;

background:
rgba(0,0,0,.45);

font-size:13px;

color:white;

text-decoration:none;

transition:.3s;

}

.music:hover{

transform:scale(1.05);

background:
rgba(255,255,255,.12);

}

</style>

</head>

<body>

<div class="card">

<div class="logo">☠</div>

<div class="title">
Leon
</div>

<div class="avatar">

<img src="../members/founder/user1.jpg" alt="Leon Avatar">

</div>

<div class="username">
@wtf.leon
</div>

<div class="bio">
youngest • AZURA
</div>

<div class="socials">

<a class="social"
href="https://discord.gg/CwsGFu6D"
target="_blank">

DC

</a>

</div>

<a class="music"
href="https://open.spotify.com/track/6G30DMFfBSW1NIw6OXF4UZ?si=1a8d5614252248d9"
target="_blank">

🎵 Nateman — 123

</a>

</div>

<audio id="bgMusic" autoplay loop>

<source
src="../Nateman - 123 (Official Music Video).mp3"
type="audio/mpeg">

</audio>

<script>

const music =
document.getElementById("bgMusic");

music.volume = .5;

music.play().catch(()=>{

document.body.onclick = ()=>{

music.play();

};

});

</script>

</body>
</html>
