<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon | PUBLIC AZURA</title>
<style>
/* ✅ Fixed JetBrains Mono Font */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)),
        url("../members/founder/leon.gif");
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #e0e0e0;
    padding: 20px;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        repeating-linear-gradient(transparent 0px, rgba(255,255,255,0.015) 1px, transparent 2px);
    background-size: 6px 6px, 100% 4px;
    z-index: 1;
    pointer-events: none;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
}

@keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
}

@keyframes textGlow {
    from { text-shadow: 0 0 15px #ffffff, 0 0 30px #ffffff40; }
    to { text-shadow: 0 0 25px #ffffff, 0 0 50px #ffffff80; }
}

/* 🚀 IMPROVED LOADING SCREEN */
#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    transition: opacity 1s ease, visibility 1s ease;
}

#loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
}

/* Scan line effect */
#loading-overlay::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffffff, transparent);
    box-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff70;
    animation: scanline 2.5s linear infinite;
    opacity: 0.8;
}

/* Loading Banner/Text */
.loading-main {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 10px;
    color: #ffffff;
    text-transform: uppercase;
    animation: pulse 2s infinite alternate, textGlow 3s infinite alternate;
}

.loading-sub {
    font-size: 20px;
    letter-spacing: 6px;
    color: #cccccc;
    animation: pulse 2s infinite alternate-reverse;
}

/* 🎯 Main Profile Card */
.profile-card {
    width: 100%;
    max-width: 460px;
    background: rgba(12, 12, 12, 0.92);
    border: 1px solid rgba(70, 70, 70, 0.4);
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.06);
    z-index: 10;
    animation: fadeIn 0.8s ease-out forwards;
    opacity: 0;
    position: relative;
}

/* Header / Avatar Section */
.profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
}

.avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    overflow: hidden;
    position: relative;
    background: #000;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.avatar:hover {
    transform: scale(1.05);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.1);
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: none;
}

.user-info {
    flex: 1;
    overflow: hidden;
}

.display-name {
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px currentColor;
}
.status-online { background-color: #23a55a; color: #23a55a; }
.status-idle { background-color: #f0b232; color: #f0b232; }
.status-dnd { background-color: #f13f43; color: #f13f43; }
.status-offline { background-color: #80848e; color: #80848e; }

.username {
    font-size: 14px;
    color: #a0a0a0;
}

/* Section Styles */
.section {
    margin-bottom: 20px;
}

.section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #777;
    margin-bottom: 8px;
    font-weight: 500;
}

/* ✅ Updated Activity Box with Spotify Logo */
.activity-box {
    background: rgba(8, 8, 8, 0.7);
    border: 1px solid rgba(50, 50, 50, 0.5);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 13px;
    color: #cccccc;
    min-height: 38px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.spotify-icon {
    width: 16px;
    height: 16px;
    fill: #1DB954;
    flex-shrink: 0;
}

/* Terminal / Status */
.terminal-box {
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid rgba(40, 40, 40, 0.6);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 13px;
    color: #b0e090;
    line-height: 1.6;
}

.terminal-prompt {
    color: #639cd9;
}

/* Quote / Bio */
.quote-box {
    background: rgba(8, 8, 8, 0.7);
    border: 1px solid rgba(50, 50, 50, 0.5);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 13px;
    color: #cccccc;
    font-style: italic;
    min-height: 38px;
    display: flex;
    align-items: center;
}

/* Links / Socials */
.links-container {
    display: flex;
    gap: 16px;
    margin-top: 6px;
}

.social-link {
    width: 38px;
    height: 38px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.25s ease;
}

.social-link:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-2px);
}

.social-link svg {
    width: 18px;
    height: 18px;
    fill: #e0e0e0;
}

/* ✅ AVATAR POPUP BOX */
.profile-popup {
    position: absolute;
    top: 0;
    left: 110%;
    width: 320px;
    background: #0a0a0a;
    border: 1px solid rgba(80, 80, 80, 0.5);
    border-radius: 8px;
    padding: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.95);
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    transform: translateX(15px);
    pointer-events: none;
}

.avatar:hover ~ .profile-popup,
.profile-popup:hover {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
    pointer-events: auto;
}

.popup-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.popup-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    overflow: hidden;
    position: relative;
    background: #000;
}

.popup-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.popup-info .popup-name {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 2px;
}

.popup-info .popup-user {
    font-size: 12px;
    color: #a0a0a0;
    margin-bottom: 6px;
}

.popup-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #cccccc;
}

.popup-section {
    margin-top: 10px;
    font-size: 12px;
}

.popup-section span {
    color: #888;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
}

.popup-activity {
    background: rgba(5,5,5,0.7);
    border: 1px solid rgba(50,50,50,0.4);
    border-radius: 4px;
    padding: 6px 8px;
    color: #dddddd;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Responsive */
@media (max-width: 768px) {
    .profile-popup {
        left: 50%;
        top: 110%;
        transform: translateX(-50%) translateY(15px);
    }
    .avatar:hover ~ .profile-popup {
        transform: translateX(-50%) translateY(0);
    }
}

@media (max-width: 480px) {
    .profile-card {
        padding: 18px;
    }
    .loading-main {
        font-size: 30px;
        letter-spacing: 6px;
    }
    .loading-sub {
        font-size: 16px;
    }
}
</style>
</head>

<script>
const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;

// Loading Screen
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('profileCard').style.opacity = "1";
    }, 3000);
});

async function fetchData() {
    try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const json = await res.json();

        if (!json.success) {
            console.error("API Error:", json);
            document.getElementById('activityText').innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> API Error`;
            document.getElementById('popupActivity').innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> API Error`;
            return;
        }

        const d = json.data;

        // Avatar & Decoration
        const avatarEl = document.getElementById('avatarImg');
        const popupAvatarEl = document.getElementById('popupAvatarImg');
        const decoEl = document.getElementById('avatarDeco');

        if (d.discord_user.avatar) {
            const avatarUrl = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
            avatarEl.src = avatarUrl;
            popupAvatarEl.src = avatarUrl;
        } else {
            const defaultAvatar = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
            avatarEl.src = defaultAvatar;
            popupAvatarEl.src = defaultAvatar;
        }

        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            decoEl.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.style.display = "block";
        } else {
            decoEl.style.display = "none";
        }

        // Names
        const displayName = d.discord_user.global_name || "Leon";
        const username = d.discord_user.username || "wtf.leon";
        document.getElementById('displayName').innerText = displayName;
        document.getElementById('username').innerText = `@${username}`;
        document.getElementById('popupName').innerText = displayName;
        document.getElementById('popupUser').innerText = `@${username}`;

        // Status
        const statusDot = document.getElementById('statusDot');
        const popupStatusDot = document.getElementById('popupStatusDot');
        const popupStatusText = document.getElementById('popupStatusText');
        statusDot.className = "status-dot";
        popupStatusDot.className = "status-dot";

        let statusText = "Offline / Invisible";
        let statusClass = "status-offline";

        switch(d.discord_status) {
            case 'online':
                statusClass = 'status-online';
                statusText = 'Online';
                break;
            case 'idle':
                statusClass = 'status-idle';
                statusText = 'Idle';
                break;
            case 'dnd':
                statusClass = 'status-dnd';
                statusText = 'Do Not Disturb';
                break;
        }

        statusDot.classList.add(statusClass);
        popupStatusDot.classList.add(statusClass);
        popupStatusText.innerText = statusText;

        // Custom Status / Terminal
        const customStatus = d.activities?.find(a => a.type === 4);
        document.getElementById('customStatus').innerText = customStatus?.state || "PA KISS NGA";
        document.getElementById('quoteText').innerText = customStatus?.details || "Too real , too";

        // ✅ ACTIVITY - WITH SPOTIFY LOGO & FORMAT
        const activityEl = document.getElementById('activityText');
        const popupActivityEl = document.getElementById('popupActivity');

        if (d.spotify?.track_id) {
            // If listening to Spotify
            const song = d.spotify.song || "Unknown Track";
            const artist = d.spotify.artist || "Unknown Artist";
            activityEl.innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> Listening: ${song} — ${artist}`;
            popupActivityEl.innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> Listening: ${song} — ${artist}`;
        } else {
            // Other activities
            const activity = d.activities?.find(a => a.type === 0 || a.type === 3);
            let activityText = "No activity";
            if (activity) {
                if (activity.type === 0) activityText = `Playing: ${activity.name}`;
                if (activity.type === 3) activityText = `Watching: ${activity.name}`;
            }
            activityEl.innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> ${activityText}`;
            popupActivityEl.innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> ${activityText}`;
        }

    } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById('activityText').innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> Connection Error`;
        document.getElementById('popupActivity').innerHTML = `<svg class="spotify-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> Connection Error`;
    }
}

fetchData();
setInterval(fetchData, 5000);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if ((e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || e.key === 'F12') {
        e.preventDefault();
    }
});
</script>
