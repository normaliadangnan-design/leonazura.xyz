<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url("../members/founder/leon.gif");
    background-size:cover;
    background-position:center;
    color:white;
    overflow-y:auto;
    padding-top:100px;
}
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:8px 8px;
    z-index:1;
}

#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #090909;
    z-index: 9999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.click-text {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 8px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: pulse 1.5s infinite alternate;
    text-transform: uppercase;
}

@keyframes pulse {
    0% { opacity: 0.3; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.05); }
}

.card{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:0;
    background:transparent;
    box-shadow:none;
}
.logo-img-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom:20px;
    width: 100%;
    background: transparent;
    padding: 15px;
    border-radius: 12px;
}

.main-logo {
    max-width: 240px;
    height: auto;
    object-fit: contain;
}

.title-image-container {
    margin-bottom: 10px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}
.title-image {
    height: 100%;
    width: auto;
    object-fit: contain;
}

.status-container {
    display: flex !important;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 15px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 15px;
    background: #111;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    opacity: 1 !important;
    visibility: visible !important;
    z-index: 999;
    position: relative;
    border: 1px solid rgba(255,255,255,0.1);
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}
.status-online { background-color: #23a55a; }
.status-idle { background-color: #f0b232; }
.status-dnd { background-color: #f13f43; }
.status-offline { background-color: #80848e; }

.avatar{
    position: relative;
    width:140px;
    height:140px;
    margin:auto;
    margin-bottom:18px;
    overflow: visible !important;
    cursor: pointer;
}

.avatar-img-holder {
    width: 100%;
    height: 100%;
    border-radius:50%;
    overflow: hidden;
    border:3px solid rgba(255,255,255,.18);
    background: transparent;
    position: relative;
    z-index: 2;
}

.avatar-img-holder img{
    width:100%;
    height:100%;
    object-fit:cover;
}

img.avatar-decoration {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 170px !important;
    height: 170px !important;
    pointer-events: none !important;
    z-index: 1 !important;
    display: none;
    border-radius: 0 !important;
    background: transparent !important;
    image-rendering: -webkit-optimize-contrast;
}

.section-card{
    background:rgba(15,15,15,.65);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}
    
.username{
    display: none !important;
}

.bio{
    opacity:.85;
    font-size:15px;
    margin-bottom:28px;
    min-height: 20px;
    transition: all 0.3s ease;
    line-height: 1.4;
    word-break: break-word;
}

.socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:25px;
}

.social{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.05);
    text-decoration:none;
    transition:.3s;
}

.social:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.15);
}

.social svg {
    width:26px;
    height:26px;
    fill:white;
}

/* ==================================================
   ✅ MUSIC PLAYER - WITH PLAY BUTTON & CONTROLS
   ================================================== */
.music-container {
    display: block;
    color: white;
    background: #000000 !important;
    border-radius: 12px;
    padding: 15px;
    width: 100%;
    transition: .3s;
    border: none;
    cursor: pointer;
    margin-bottom: 8px;
}

.music-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.music-album-art {
    width: 55px;
    height: 55px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
}

.music-info {
    text-align: left;
    flex: 1;
}

.music-title {
    font-size: 16px;
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.music-artist {
    font-size: 13px;
    opacity: 0.7;
    display: block;
    color: #cccccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* PLAY BUTTON */
.music-play-button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.2s ease;
}

.music-play-button:hover {
    transform: scale(1.1);
}

.music-play-button svg {
    width: 16px;
    height: 16px;
    fill: #000000;
    margin-left: 2px;
}

/* Progress Bar */
.music-progress-container {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
    cursor: pointer;
}

.music-progress-bar {
    height: 100%;
    background: #ffffff;
    width: 0%;
    border-radius: 2px;
    transition: width 0.5s linear;
}

.music-time {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888;
    margin-top: 4px;
}

.views-pill {
    display: inline-block;
    padding: 5px 24px;
    border-radius: 30px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    letter-spacing: 1px;
    margin-top: 4px;
}

a {
    text-decoration: none !important;
    color: inherit !important;
    pointer-events: auto;
}

.profile-popup {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 12px;
    width: 380px;
    background: #000000 !important;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.9);
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    pointer-events: none;
}

.avatar:hover .profile-popup {
    opacity: 1;
    visibility: visible;
}

.popup-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    position: relative;
}

.popup-avatar-wrapper {
    position: relative;
    width: 45px;
    height: 45px;
    flex-shrink: 0;
}

.popup-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: none;
    position: relative;
    z-index: 2;
}

.popup-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.popup-decoration {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 58px;
    height: 58px;
    pointer-events: none;
    z-index: 1;
    display: none;
}

.popup-info {
    text-align: left;
    flex: 1;
    overflow: hidden;
}

.popup-nickname {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    display: block;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.popup-name {
    font-size: 13px;
    font-weight: 400;
    color: #8a8a8a;
    display: block;
    line-height: 1.2;
    margin: 2px 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.popup-status {
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
}

.popup-status .status-dot {
    width: 10px !important;
    height: 10px !important;
}

.popup-note {
    display: none;
}

</style>
</head>

<script>
const audio = document.getElementById("bgMusic");
audio.volume = 0.5;

const overlay = document.getElementById("loading-overlay");

overlay.addEventListener('click', () => {
    audio.play().catch(e => console.log(e));
    overlay.style.opacity = "0";
    setTimeout(() => { 
        overlay.style.visibility = "hidden"; 
    }, 800);
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
        e.preventDefault();
        return false;
    }
});
setInterval(function() { (function() { return false; }['constructor']('debugger')['call']()); }, 50);

function updateViews() {
    let count = localStorage.getItem('page_views');
    if (!count) count = 5671; 
    count = parseInt(count) + 1;
    localStorage.setItem('page_views', count);
    document.getElementById('viewsCount').innerText = `Views: ${count}`;
}
updateViews();

const YOUR_ID = "1250654354344775703";
const API_URL = `https://api.lanyard.rest/v1/users/${YOUR_ID}`;

// Default music info
const defaultTitle = "ORIGIMAL";
const defaultArtist = "Uncle Dags ORIGIMAL";
const defaultArt = "https://i.scdn.co/image/ab67616d0000b2734121faee8df82ba027c0456";
const defaultLink = "https://open.spotify.com/playlist/0EpzfpMwBENOUUHAWMIgUI?si=DoTqgxLBSzSXV8Tbdbrg5w";
const defaultDuration = 151000; // 2:31 in ms

let currentTrackUrl = defaultLink;
let isPlaying = true;
let currentTime = 0;
let totalTime = defaultDuration;
let progressInterval;

// ==============================================
// ✅ PLAY / PAUSE FUNCTIONALITY
// ==============================================
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const progressBar = document.getElementById('musicProgressBar');
const timeCurrentEl = document.getElementById('musicTimeCurrent');
const timeTotalEl = document.getElementById('musicTimeTotal');
const musicLinkContainer = document.getElementById('musicLinkContainer');
const progressBarContainer = document.getElementById('progressBarContainer');

// Open Spotify Link when clicking music area
musicLinkContainer.addEventListener('click', (e) => {
    // Don't open if clicking the play button
    if (!e.target.closest('.music-play-button')) {
        window.open(currentTrackUrl, '_blank');
    }
});

playPauseBtn.addEventListener('click', () => {
    if (isPlaying) {
        audio.pause();
        clearInterval(progressInterval);
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
    } else {
        audio.play();
        startProgressTimer();
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
    }
    isPlaying = !isPlaying;
});

// Click on progress bar to seek
progressBarContainer.addEventListener('click', (e) => {
    const rect = progressBarContainer.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    const newTime = percent * totalTime;
    
    currentTime = newTime;
    updateProgressUI();
    
    // Update audio position if it's the default song
    if (!document.getElementById('musicTitle').dataset.isSpotify) {
        audio.currentTime = newTime / 1000;
    }
});

function formatTime(ms) {
    if (!ms || ms < 0) return "0:00";
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
}

function startProgressTimer() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        if (currentTime < totalTime) {
            currentTime += 1000;
            updateProgressUI();
        } else {
            currentTime = 0; // Loop
        }
    }, 1000);
}

function updateProgressUI() {
    const percentage = totalTime > 0 ? (currentTime / totalTime) * 100 : 0;
    progressBar.style.width = percentage + "%";
    timeCurrentEl.innerText = formatTime(currentTime);
}

// ==============================================
// ✅ FETCH DATA FROM API
// ==============================================
async function fetchData() {
    try {
        const res = await fetch(API_URL, {cache: "no-store"});
        const json = await res.json();

        if (!json.success) {
            console.error("API Error:", json);
            return;
        }
        const d = json.data;

        // Avatar
        const avatarEl = document.getElementById('avatarImg');
        const popupAvatarEl = document.getElementById('popupAvatarImg');
        let avatarUrl = "";
        if (d.discord_user.avatar) {
            avatarUrl = `https://cdn.discordapp.com/avatars/${YOUR_ID}/${d.discord_user.avatar}.png?size=256`;
        } else {
            avatarUrl = 'https://discord.com/assets/f99e19bae51a14c679b3c4361546955a.png';
        }
        avatarEl.src = avatarUrl;
        popupAvatarEl.src = avatarUrl;

        // Decoration
        const decoEl = document.getElementById('decoImg');
        const popupDecoEl = document.getElementById('popupDeco');
        if (d.discord_user.avatar_decoration_data) {
            const asset = d.discord_user.avatar_decoration_data.asset;
            const decoUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=240&passthrough=true`;
            decoEl.src = decoUrl;
            decoEl.style.display = 'block';
            popupDecoEl.src = decoUrl;
            popupDecoEl.style.display = 'block';
        } else {
            decoEl.style.display = 'none';
            popupDecoEl.style.display = 'none';
        }

        // Names
        const nickname = d.discord_user.global_name || "Leon";
        const username = d.discord_user.username || "wtf.leon";
        document.getElementById('popupNickname').innerText = nickname;
        document.getElementById('popupUsername').innerText = `@${username}`;

        // Bio / Custom Status
        const noteEl = document.getElementById('noteText');
        const customStatus = d.activities.find(a => a.type === 4);
        let statusText = "PA KISS NGA";
        if (customStatus && customStatus.state) {
            statusText = customStatus.state;
        }
        noteEl.innerText = statusText;

        // Status
        const statusDot = document.getElementById('statusDot');
        const statusTextEl = document.getElementById('statusText');
        const popupStatusDot = document.getElementById('popupStatusDot');
        const popupStatusText = document.getElementById('popupStatusText');
        
        statusDot.className = "status-dot";
        popupStatusDot.className = "status-dot";

        let statusString = "";
        let statusClass = "";

        switch(d.discord_status) {
            case 'online':
                statusClass = 'status-online';
                statusString = 'Online';
                break;
            case 'idle':
                statusClass = 'status-idle';
                statusString = 'Idle';
                break;
            case 'dnd':
                statusClass = 'status-dnd';
                statusString = 'Do Not Disturb';
                break;
            default:
                statusClass = 'status-offline';
                statusString = 'Offline / Invisible';
        }

        statusDot.classList.add(statusClass);
        statusTextEl.innerText = statusString;
        popupStatusDot.classList.add(statusClass);
        popupStatusText.innerText = statusString;

        // ==============================================
        // ✅ SPOTIFY / MUSIC PLAYER UPDATE
        // ==============================================
        const titleEl = document.getElementById('musicTitle');
        const artistEl = document.getElementById('musicArtist');
        const artEl = document.getElementById('musicAlbumArt');

        if (d.spotify && d.spotify.track_id) {
            // NAKIKINIG SA SPOTIFY
            titleEl.innerText = d.spotify.song || "Unknown Track";
            artistEl.innerText = d.spotify.artist || "Unknown Artist";
            artEl.src = d.spotify.album_art_url || defaultArt;
            
            // Timestamps
            const start = d.spotify.timestamps?.start || 0;
            const end = d.spotify.timestamps?.end || 0;
            
            if (end > start) {
                totalTime = end - start;
                currentTime = Math.min(Date.now() - start, totalTime);
                timeTotalEl.innerText = formatTime(totalTime);
                updateProgressUI();
            }
            
            // Link to track
            currentTrackUrl = `https://open.spotify.com/track/${d.spotify.track_id}`;
            titleEl.dataset.isSpotify = "true";

        } else {
            // DEFAULT MUSIC
            titleEl.innerText = defaultTitle;
            artistEl.innerText = defaultArtist;
            artEl.src = "leonaise.webp";
            currentTrackUrl = defaultLink;
            totalTime = defaultDuration;
            timeTotalEl.innerText = "2:31";
            titleEl.dataset.isSpotify = "false";
            
            // Update time for default song
            if(isPlaying) {
                currentTime = audio.currentTime * 1000;
                updateProgressUI();
            }
        }

    } catch (err) {
        console.error("API Fetch Error:", err);
        document.getElementById('statusText').innerText = 'Error';
    }
}

fetchData();
setInterval(fetchData, 5000); // Update every 5 seconds

// Start timer on load
startProgressTimer();
playIcon.style.display = 'none';
pauseIcon.style.display = 'block';

history.replaceState(null, null, location.href);
window.onpopstate = () => history.go(1);
window.addEventListener('load', () => history.pushState(null, null, location.href));
</script>
</body>
</html>
